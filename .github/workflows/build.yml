name: Build Desktop and Mobile Apps

on:
  push:
    branches: [ main ]
    paths:
      - 'desktop-app/**'
      - 'android-app/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'desktop-app/**'
      - 'android-app/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  # ==================== Windows 桌面端 ====================
  build-windows:
    name: Build Windows Installer (.exe)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
        shell: pwsh

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: desktop-app/package-lock.json

    - name: Install dependencies
      run: npm ci
      env:
        ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        NPM_CONFIG_REGISTRY: https://registry.npmmirror.com

    - name: Build Windows Installer
      run: npm run build:win
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Rename artifact
      run: |
        $exe = Get-ChildItem -Path dist -Filter "*.exe" | Select-Object -First 1
        if ($exe) {
          Rename-Item $exe.FullName "dist/玄机算命-Setup.exe"
        }
        Get-ChildItem dist

    - name: Upload Windows Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-xuanji-installer
        path: desktop-app/dist/玄机算命-Setup.exe
        retention-days: 30

  # ==================== Linux 桌面端 ====================
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-app

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: desktop-app/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build Linux AppImage
      run: npm run build:linux

    - name: Rename artifact
      run: |
        find dist -name "*.AppImage" -exec mv {} dist/玄机算命-Linux.AppImage \;
        ls -lh dist/

    - name: Upload Linux Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-xuanji-appimage
        path: desktop-app/dist/玄机算命-Linux.AppImage
        retention-days: 30

  # ==================== Android 移动端 ====================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-34 build-tools;34.0.0'

    - name: Generate keystore
      working-directory: android-app/app
      run: |
        keytool -genkey -v \
          -keystore release.keystore \
          -alias xuanji \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=玄机算命, OU=Dev, O=Xuanji, L=Beijing, ST=Beijing, C=CN"

    - name: Setup Gradle wrapper
      run: |
        if [ ! -f gradlew ]; then
          gradle wrapper --gradle-version 8.5
        fi
        chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Rename APK artifact
      run: |
        APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -1)
        if [ -n "$APK" ]; then
          cp "$APK" 玄机算命-Android.apk
          echo "APK built: $APK"
        fi

    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: android-xuanji-apk
        path: android-app/玄机算命-Android.apk
        retention-days: 30

  # ==================== 发布 Release ====================
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-android]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Read version
      id: version
      run: |
        VERSION=$(cat version.json | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])")
        echo "version=v${VERSION}" >> $GITHUB_OUTPUT
        echo "version_num=${VERSION}" >> $GITHUB_OUTPUT

    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: windows-xuanji-installer
        path: release-assets/

    - name: Download Linux artifact
      uses: actions/download-artifact@v4
      with:
        name: linux-xuanji-appimage
        path: release-assets/

    - name: Download Android artifact
      uses: actions/download-artifact@v4
      with:
        name: android-xuanji-apk
        path: release-assets/

    - name: List release assets
      run: ls -lh release-assets/

    - name: Delete existing tag (if any)
      run: |
        git push origin :refs/tags/${{ steps.version.outputs.version }} 2>/dev/null || true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: 玄机算命 ${{ steps.version.outputs.version }}
        body: |
          ## 玄机算命客户端

          本次构建由 GitHub Actions 自动生成。

          ### 📥 下载
          - **Windows**: `玄机算命-Setup.exe` — 双击安装，支持 Windows 10/11
          - **Linux**: `玄机算命-Linux.AppImage` — 下载后 `chmod +x` 即可运行
          - **Android**: `玄机算命-Android.apk` — 下载安装，支持 Android 8.0+

          ### 🔗 在线使用
          浏览器访问 https://xuanjisuanming.top 即刻使用，无需安装。

          ---
          Built by [GitHub Actions](https://github.com/WERLK/suanming/actions)
        draft: false
        prerelease: false
        files: release-assets/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
