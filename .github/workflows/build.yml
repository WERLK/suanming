name: Build Desktop and Mobile Apps

on:
  push:
    branches: [ main ]
    paths:
      - 'desktop-app/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'desktop-app/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: desktop-app/package-lock.json

    - name: Install dependencies
      run: npm install
      env:
        ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        NPM_CONFIG_REGISTRY: https://registry.npmmirror.com

    - name: Build Windows .exe
      run: npm run build:win
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-exe
        path: desktop-app/dist/*.exe
        retention-days: 30

  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-app

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: desktop-app/package-lock.json

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Android APK
      run: |
        mkdir -p android-app/app/src/main/java/top/xuanjisuanming/app
        mkdir -p android-app/app/src/main/res/layout
        mkdir -p android-app/app/src/main/res/values
        mkdir -p android-app/gradle/wrapper

        # AndroidManifest.xml
        cat > android-app/app/src/main/AndroidManifest.xml << 'MANIFEST'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="top.xuanjisuanming.app">

            <uses-permission android:name="android.permission.INTERNET" />

            <application
                android:allowBackup="true"
                android:label="玄机算命"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.NoTitleBar"
                android:usesCleartextTraffic="true">
                <activity
                    android:name=".MainActivity"
                    android:configChanges="orientation|screenSize"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        MANIFEST

        # MainActivity.java
        cat > android-app/app/src/main/java/top/xuanjisuanming/app/MainActivity.java << 'JAVA'
        package top.xuanjisuanming.app;

        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView webView = new WebView(this);
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("https://xuanjisuanming.top");
                setContentView(webView);
            }
        }
        JAVA

        # strings.xml
        cat > android-app/app/src/main/res/values/strings.xml << 'XML'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string name="app_name">玄机算命</string>
        </resources>
        XML

        # build.gradle (project)
        cat > android-app/build.gradle << 'GRADLE'
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.0'
            }
        }

        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        GRADLE

        # build.gradle (app)
        cat > android-app/app/build.gradle << 'GRADLE'
        apply plugin: 'com.android.application'

        android {
            namespace 'top.xuanjisuanming.app'
            compileSdk 34

            defaultConfig {
                applicationId "top.xuanjisuanming.app"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0.0"
            }

            buildTypes {
                release {
                    minifyEnabled true
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
                }
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        GRADLE

        # settings.gradle
        cat > android-app/settings.gradle << 'GRADLE'
        rootProject.name = "玄机算命"
        include ':app'
        GRADLE

        # gradle.properties
        cat > android-app/gradle.properties << 'PROPS'
        android.useAndroidX=true
        PROPS

        echo "Android project structure created. Run ./gradlew assembleRelease to build."

    - name: Upload Android artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-apk-src
        path: desktop-app/android-app/
        retention-days: 30
