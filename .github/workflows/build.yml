name: Build Desktop and Mobile Apps

on:
  push:
    branches: [ main ]
    paths:
      - 'desktop-app/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'desktop-app/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-windows:
    name: Build Windows Installer (.exe)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
        shell: pwsh

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: desktop-app/package-lock.json

    - name: Install dependencies
      run: npm ci
      env:
        ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        NPM_CONFIG_REGISTRY: https://registry.npmmirror.com

    - name: Build Windows Installer
      run: npm run build:win
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Rename artifact
      run: |
        $exe = Get-ChildItem -Path dist -Filter "*.exe" | Select-Object -First 1
        if ($exe) {
          Rename-Item $exe.FullName "dist/玄机算命-Setup.exe"
        }
        Get-ChildItem dist

    - name: Upload Windows Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-xuanji-installer
        path: desktop-app/dist/玄机算命-Setup.exe
        retention-days: 30

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-app

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: desktop-app/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build Linux AppImage
      run: npm run build:linux

    - name: Rename artifact
      run: |
        find dist -name "*.AppImage" -exec mv {} dist/玄机算命-Linux.AppImage \;
        ls -lh dist/

    - name: Upload Linux Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-xuanji-appimage
        path: desktop-app/dist/玄机算命-Linux.AppImage
        retention-days: 30

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Read version
      id: version
      run: |
        VERSION=$(cat desktop-app/package.json | grep '"version"' | head -1 | sed 's/.*"version": *"\(.*\)".*/\1/')
        echo "version=v${VERSION}" >> $GITHUB_OUTPUT
        echo "version_num=${VERSION}" >> $GITHUB_OUTPUT

    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: windows-xuanji-installer
        path: release-assets/

    - name: Download Linux artifact
      uses: actions/download-artifact@v4
      with:
        name: linux-xuanji-appimage
        path: release-assets/

    - name: List release assets
      run: ls -lh release-assets/

    - name: Delete existing tag (if any)
      run: |
        git push origin :refs/tags/${{ steps.version.outputs.version }} 2>/dev/null || true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: 玄机算命 ${{ steps.version.outputs.version }}
        body: |
          ## 玄机算命桌面客户端

          本次构建由 GitHub Actions 自动生成。

          ### 📥 下载
          - **Windows**: `玄机算命-Setup.exe` — 双击安装，支持 Windows 10/11
          - **Linux**: `玄机算命-Linux.AppImage` — 下载后 `chmod +x` 即可运行

          ### 🔗 在线使用
          浏览器访问 https://xuanjisuanming.top 即刻使用，无需安装。

          ---
          Built by [GitHub Actions](https://github.com/WERLK/suanming/actions)
        draft: false
        prerelease: false
        files: release-assets/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
