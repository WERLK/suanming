<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://xuanjisuanming.top; script-src 'self' https://xuanjisuanming.top 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://xuanjisuanming.top; frame-src https://xuanjisuanming.top;">
    <title>玄机算命</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; overflow: hidden; }
        #loader {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #101828;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }
        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loader-spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(232,184,75,0.2);
            border-top-color: rgba(232,184,75,0.8);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        iframe {
            width: 100%; height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div id="loader"><div class="loader-spinner"></div></div>
    <iframe id="app-frame" src="https://xuanjisuanming.top"></iframe>
    <script>
        const iframe = document.getElementById('app-frame');
        const loader = document.getElementById('loader');
        iframe.addEventListener('load', () => {
            loader.classList.add('hidden');
            setTimeout(() => loader.remove(), 500);
        });
    </script>
</body>
</html>
