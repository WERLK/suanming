<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码 - 玄机算命网</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/profile-compatible.css">
    <style>
        .auth-body { min-height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; padding:1rem; }
        .auth-card { width:100%; max-width:400px; background:linear-gradient(135deg,rgba(26,26,46,0.95),rgba(22,33,62,0.95)); border:1px solid rgba(255,215,0,0.2); border-radius:16px; padding:2rem; }
        .auth-title { text-align:center; color:#ffd700; font-size:1.5rem; margin-bottom:0.3rem; }
        .auth-subtitle { text-align:center; color:rgba(255,255,255,0.5); font-size:0.85rem; margin-bottom:1.5rem; }
        .auth-msg { display:none; padding:0.7rem 1rem; border-radius:8px; margin-bottom:1rem; font-size:0.9rem; text-align:center; }
        .auth-msg.error { display:block; background:rgba(255,59,48,0.15); border:1px solid rgba(255,59,48,0.3); color:#ff6b6b; }
        .auth-msg.success { display:block; background:rgba(76,217,100,0.15); border:1px solid rgba(76,217,100,0.3); color:#4cd964; }
        .form-group { margin-bottom:1rem; }
        .form-group label { display:block; color:rgba(255,255,255,0.7); font-size:0.85rem; margin-bottom:0.4rem; }
        .form-input { width:100%; padding:0.75rem 1rem; background:rgba(255,255,255,0.05); border:1px solid rgba(255,215,0,0.15); border-radius:10px; color:#fff; font-size:0.95rem; box-sizing:border-box; }
        .form-input:focus { outline:none; border-color:rgba(255,215,0,0.5); }
        .btn { width:100%; padding:0.85rem; border:none; border-radius:10px; font-size:1rem; font-weight:bold; cursor:pointer; }
        .btn-primary { background:linear-gradient(135deg,#ffd700,#ffc107); color:#000; }
        .btn-primary:disabled { opacity:0.5; cursor:not-allowed; }
        .auth-links { text-align:center; margin-top:1rem; font-size:0.9rem; }
        .auth-links a { color:#ffd700; text-decoration:none; }
    </style>
</head>
<body>
<div class="page-header">
    <button class="back-btn" onclick="window.location.href='/login.html'">←</button>
    <h1>忘记密码</h1>
</div>
<div class="content-area">
<div class="stars" id="stars"></div>
<div class="auth-body">
    <div class="auth-card">
        <h1 class="auth-title">🔑 忘记密码</h1>
        <p class="auth-subtitle">输入注册邮箱，我们将发送重置链接</p>
        <div class="auth-msg" id="authMsg"></div>

        <form id="forgotForm" novalidate>
            <div class="form-group">
                <label>注册邮箱</label>
                <input type="email" class="form-input" id="email" placeholder="请输入注册时使用的邮箱" required>
            </div>
            <button type="submit" class="btn btn-primary" id="submitBtn">发送重置链接</button>
        </form>

        <div class="auth-links">
            <a href="/login.html">返回登录</a> | <a href="/">返回首页</a>
        </div>
    </div>
</div>

<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
<script>
(function() {
    var $ = function(id) { return document.getElementById(id); };
    document.addEventListener('DOMContentLoaded', function() { if (window.createStars) createStars(); });

    $('forgotForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        var email = $('email').value.trim();
        if (!email || !email.includes('@')) { Auth.showMsg('authMsg', '请输入有效的邮箱地址', true); return; }

        var btn = $('submitBtn');
        btn.disabled = true;
        btn.textContent = '发送中...';

        try {
            var result = await Auth.forgotPassword(email);
            if (result.success) {
                Auth.showMsg('authMsg', '重置邮件已发送，请查收', false);
                btn.textContent = '已发送';
            } else {
                Auth.showMsg('authMsg', result.message || '发送失败', true);
                btn.disabled = false;
                btn.textContent = '发送重置链接';
            }
        } catch (e) {
            Auth.showMsg('authMsg', '网络错误，请重试', true);
            btn.disabled = false;
            btn.textContent = '发送重置链接';
        }
    });
})();
</script>
</div>
</body>
</html>
