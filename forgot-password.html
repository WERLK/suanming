<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>忘记密码 - 玄机算命网</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* 忘记密码页面特定样式 */
        .forgot-container {
            max-width: 400px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .forgot-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-top: 2rem;
        }
        
        .forgot-header h1 {
            color: #ffd700;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        
        .forgot-header p {
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
        }
        
        .forgot-form {
            background: linear-gradient(135deg, rgba(255,215,0,0.05), rgba(255,215,0,0.02));
            border: 1px solid rgba(255,215,0,0.15);
            border-radius: 16px;
            padding: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            color: #ffd700;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,215,0,0.2);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            transition: all 0.3s;
            box-sizing: border-box;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: rgba(255,215,0,0.5);
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 10px rgba(255,215,0,0.1);
        }
        
        .form-group input::placeholder {
            color: rgba(255,255,255,0.3);
        }
        
        .form-hint {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
            margin-top: 0.5rem;
            line-height: 1.6;
        }
        
        .btn-submit {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            border: none;
            border-radius: 8px;
            color: #000;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 1rem;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255,215,0,0.3);
        }
        
        .btn-submit:active {
            transform: translateY(0);
        }
        
        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .back-link {
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
        }
        
        .back-link a {
            color: #ffd700;
            text-decoration: none;
            font-weight: bold;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
        
        .error-message {
            display: none;
            background: rgba(255,0,0,0.1);
            border: 1px solid rgba(255,0,0,0.3);
            border-radius: 8px;
            padding: 0.8rem;
            margin-bottom: 1rem;
            color: #ff6b6b;
            font-size: 0.85rem;
            text-align: center;
        }
        
        .error-message.show {
            display: block;
        }
        
        .success-message {
            display: none;
            background: rgba(0,255,0,0.1);
            border: 1px solid rgba(0,255,0,0.3);
            border-radius: 8px;
            padding: 0.8rem;
            margin-bottom: 1rem;
            color: #51cf66;
            font-size: 0.85rem;
            text-align: center;
        }
        
        .success-message.show {
            display: block;
        }
        
        .reset-link {
            background: rgba(255,215,0,0.05);
            border: 1px solid rgba(255,215,0,0.15);
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
            word-break: break-all;
        }
        
        .reset-link a {
            color: #ffd700;
            text-decoration: none;
        }
        
        .reset-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <div class="app">
        <div class="forgot-container">
            <div class="forgot-header">
                <h1>🔮 忘记密码</h1>
                <p>输入您的邮箱，重置密码</p>
            </div>
            
            <div class="forgot-form">
                <div class="error-message" id="errorMessage"></div>
                <div class="success-message" id="successMessage"></div>
                
                <form id="forgotForm" onsubmit="handleForgotPassword(event)">
                    <div class="form-group">
                        <label for="email">邮箱地址</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="请输入注册时使用的邮箱"
                            required
                        >
                        <div class="form-hint">我们将向此邮箱发送密码重置链接</div>
                    </div>
                    
                    <button type="submit" class="btn-submit" id="submitBtn">发送重置链接</button>
                </form>
                
                <div class="back-link">
                    <a href="/login.html">← 返回登录</a>
                </div>
                
                <div class="reset-link" id="resetLinkDiv" style="display: none;">
                    <strong>演示模式：</strong><br>
                    重置链接：<br>
                    <a href="#" id="resetLink" target="_blank"></a>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/js/main.js"></script>
    <script>
        // 创建星空背景
        document.addEventListener('DOMContentLoaded', function() {
            createStars();
        });
        
        // 显示错误信息
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            
            // 3秒后自动隐藏
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 3000);
        }
        
        // 显示成功信息
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.classList.add('show');
            
            // 3秒后自动隐藏
            setTimeout(() => {
                successDiv.classList.remove('show');
            }, 3000);
        }
        
        // 处理忘记密码
        async function handleForgotPassword(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '发送中...';
            
            const email = document.getElementById('email').value.trim();
            
            // 验证邮箱
            if (!email) {
                showError('请输入邮箱地址');
                submitBtn.disabled = false;
                submitBtn.textContent = '发送重置链接';
                return;
            }
            
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showError('请输入正确的邮箱地址');
                submitBtn.disabled = false;
                submitBtn.textContent = '发送重置链接';
                return;
            }
            
            try {
                // 调用后端API
                const response = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // 发送成功
                    showSuccess(data.message || '重置链接已发送');
                    
                    // 演示模式下显示重置链接
                    if (data.reset_link) {
                        const resetLinkDiv = document.getElementById('resetLinkDiv');
                        const resetLink = document.getElementById('resetLink');
                        resetLink.href = data.reset_link;
                        resetLink.textContent = data.reset_link;
                        resetLinkDiv.style.display = 'block';
                    }
                    
                    // 清空表单
                    document.getElementById('email').value = '';
                } else {
                    // 发送失败
                    showError(data.message || '发送失败，请重试');
                }
            } catch (error) {
                showError('网络错误，请稍后重试');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '发送重置链接';
            }
        }
    </script>
</body>
</html>
