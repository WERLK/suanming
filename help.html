<script>
// 视频加载错误处理
(function() {
    var video = document.getElementById('tutorialVideo');
    var errorDiv = document.getElementById('tutorialVideoError');
    if (video && errorDiv) {
        var onError = function(e) {
            video.style.display = 'none';
            errorDiv.style.display = 'block';
            console.warn('教程视频加载失败:', video.error ? video.error.message : '未知错误');
        };
        video.addEventListener('error', onError);
        // 超时检测：5秒后仍未开始加载则视为失败
        setTimeout(function() {
            if (video.readyState === 0 && video.networkState !== 2) {
                onError();
            }
        }, 5000);
    }
})();
</script>

var currentCat = 'all';

document.addEventListener('DOMContentLoaded', function() {
    renderCategories();
    renderHelp();
});

function renderCategories() {
    var el = document.getElementById('helpCats');
    el.innerHTML = helpCategories.map(function(cat) {
        var count = cat.id === 'all' ? helpTopics.length :
            helpTopics.filter(function(t) { return t.category === cat.id; }).length;
        return '<span class="help-cat' + (cat.id === currentCat ? ' active' : '') +
            '" data-cat="' + cat.id + '" onclick="switchCat(\'' + cat.id + '\')">' +
            cat.label + '<span class="count">' + count + '</span></span>';
    }).join('');
}

function switchCat(catId) {
    currentCat = catId;
    document.getElementById('helpSearch').value = '';
    renderCategories();
    renderHelp();
}

function renderHelp(filteredTopics) {
    var topics = filteredTopics || helpTopics;
    if (!filteredTopics && currentCat !== 'all') {
        topics = helpTopics.filter(function(t) { return t.category === cat.id; });
    }

    // 按分类分组
    if (currentCat === 'all' && !filteredTopics) {
        var html = '';
        helpCategories.forEach(function(cat) {
            if (cat.id === 'all') return;
            var items = helpTopics.filter(function(t) { return t.category === cat.id; });
            if (items.length === 0) return;
            html += '<div class="help-category-title">' + cat.label + '</div>';
            html += items.map(renderItem).join('');
        });
        document.getElementById('helpList').innerHTML = html;
    } else {
        document.getElementById('helpList').innerHTML = topics.map(renderItem).join('');
    }

    // 无结果
    document.getElementById('helpNoResult').style.display = topics.length === 0 ? 'block' : 'none';
}

function renderItem(topic) {
    return '<div class="help-item" onclick="toggleItem(this)">'
        + '<div class="help-question"><span class="help-q-icon">Q</span>'
        + highlightSearch(topic.q)
        + '<span class="help-arrow">▾</span></div>'
        + '<div class="help-answer">' + topic.a + '</div>'
        + '</div>';
}

function highlightSearch(text) {
    var q = (document.getElementById('helpSearch') || {}).value;
    if (!q || !q.trim()) return text;
    var escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return text.replace(new RegExp('(' + escaped + ')', 'gi'), '<b class="help-highlight">$1</b>');
}

function toggleItem(item) {
    // 手风琴：关闭其他
    var all = document.querySelectorAll('.help-item.expanded');
    all.forEach(function(i) { if (i !== item) i.classList.remove('expanded'); });
    item.classList.toggle('expanded');
}

function filterHelp() {
    var q = document.getElementById('helpSearch').value.trim().toLowerCase();
    if (!q) {
        currentCat = 'all';
        renderCategories();
        renderHelp();
        return;
    }

    var filtered = helpTopics.filter(function(t) {
        return t.q.toLowerCase().indexOf(q) !== -1 ||
               t.a.replace(/<[^>]*>/g, '').toLowerCase().indexOf(q) !== -1;
    });

    document.getElementById('helpList').innerHTML = filtered.map(function(t) {
        // 显示分类
        var catName = (helpCategories.find(function(c) { return c.id === t.category; }) || {}).label || '';
        return '<span style="font-size:0.7rem;color:rgba(255,215,0,0.5);">' + catName + '</span>' + renderItem(t);
    }).join('');

    document.getElementById('helpNoResult').style.display = filtered.length === 0 ? 'block' : 'none';
}
</script>
