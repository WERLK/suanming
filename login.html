<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffd700">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="玄机算命">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>登录 - 玄机算命网</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/profile-compatible.css">
    <style>
        .auth-body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
            background: linear-gradient(135deg, rgba(26,26,46,0.95), rgba(22,33,62,0.95));
            border: 1px solid rgba(255,215,0,0.2);
            border-radius: 16px;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }
        .auth-title {
            text-align: center;
            color: #ffd700;
            font-size: 1.5rem;
            margin-bottom: 0.3rem;
        }
        .auth-subtitle {
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }
        .auth-msg {
            display: none;
            padding: 0.7rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            text-align: center;
        }
        .auth-msg.error {
            display: block;
            background: rgba(255,59,48,0.15);
            border: 1px solid rgba(255,59,48,0.3);
            color: #ff6b6b;
        }
        .auth-msg.success {
            display: block;
            background: rgba(76,217,100,0.15);
            border: 1px solid rgba(76,217,100,0.3);
            color: #4cd964;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
        }
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,215,0,0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        .form-input:focus {
            outline: none;
            border-color: rgba(255,215,0,0.5);
            background: rgba(255,255,255,0.08);
        }
        .form-input::placeholder {
            color: rgba(255,255,255,0.3);
        }
        .form-row {
            display: flex;
            gap: 0.5rem;
        }
        .form-row .form-input {
            flex: 1;
        }
        .btn {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ffd700, #ffc107);
            color: #000;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(255,215,0,0.3);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
            box-shadow: none;
        }
        .btn-sms {
            padding: 0.75rem 1rem;
            background: rgba(255,215,0,0.1);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 10px;
            color: #ffd700;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-sms:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .auth-links {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }
        .auth-links a {
            color: #ffd700;
            text-decoration: none;
            margin: 0 0.5rem;
        }
        .auth-links a:hover {
            text-decoration: underline;
        }
        .captcha-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .captcha-tab {
            flex: 1;
            text-align: center;
            padding: 0.5rem;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .captcha-tab.active {
            background: rgba(255,215,0,0.1);
            border-color: rgba(255,215,0,0.4);
            color: #ffd700;
        }
        .captcha-panel {
            display: none;
        }
        .captcha-panel.active {
            display: block;
        }
        .captcha-img-wrap {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .captcha-img {
            flex: 1;
            height: 45px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,215,0,0.15);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .captcha-img img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .captcha-refresh {
            font-size: 0.75rem;
            color: #ffd700;
            cursor: pointer;
            white-space: nowrap;
        }
        .slider-track {
            height: 45px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,215,0,0.15);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            user-select: none;
        }
        .slider-target {
            position: absolute;
            top: 0;
            width: 45px;
            height: 100%;
            background: repeating-linear-gradient(45deg, rgba(255,215,0,0.2) 0px, rgba(255,215,0,0.2) 2px, transparent 2px, transparent 6px);
            border-right: 2px solid rgba(255,215,0,0.5);
            pointer-events: none;
        }
        .slider-thumb {
            position: absolute;
            top: 0;
            width: 45px;
            height: 100%;
            background: linear-gradient(135deg, #ffd700, #ffc107);
            border-radius: 8px;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            z-index: 2;
        }
        .slider-thumb:active {
            cursor: grabbing;
        }
        .slider-hint {
            color: rgba(255,255,255,0.3);
            font-size: 0.7rem;
            text-align: center;
            padding-top: 0.3rem;
        }
        .remember-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .remember-row input {
            accent-color: #ffd700;
        }
        .remember-row label {
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="auth-body">
    <div class="auth-card">
        <h1 class="auth-title">🔮 玄机算命网</h1>
        <p class="auth-subtitle">欢迎回来，请登录你的账号</p>

        <div class="auth-msg" id="authMsg"></div>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label>用户名 / 手机号 / 邮箱</label>
                <input type="text" class="form-input" id="username" placeholder="请输入" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label>密码</label>
                <input type="password" class="form-input" id="password" placeholder="请输入密码" autocomplete="current-password" required>
            </div>

            <!-- 验证码类型切换 -->
            <label style="color:rgba(255,255,255,0.7);font-size:0.85rem;">安全验证</label>
            <div class="captcha-tabs">
                <div class="captcha-tab active" data-type="image" onclick="switchCaptcha('image')">图片验证码</div>
                <div class="captcha-tab" data-type="slider" onclick="switchCaptcha('slider')">滑块验证</div>
                <div class="captcha-tab" data-type="sms" onclick="switchCaptcha('sms')">短信验证码</div>
            </div>

            <!-- 图片验证码 -->
            <div class="captcha-panel active" id="panelImage">
                <div class="captcha-img-wrap">
                    <div class="captcha-img" id="captchaImage" onclick="loadImageCaptcha()">
                        <span style="color:rgba(255,255,255,0.3);">点击加载验证码</span>
                    </div>
                    <span class="captcha-refresh" onclick="loadImageCaptcha()">刷新</span>
                </div>
                <input type="text" class="form-input" id="captchaText" placeholder="请输入验证码" style="margin-top:0.5rem;" autocomplete="off">
            </div>

            <!-- 滑块验证 -->
            <div class="captcha-panel" id="panelSlider">
                <div class="slider-track" id="sliderTrack">
                    <div class="slider-target" id="sliderTarget"></div>
                    <div class="slider-thumb" id="sliderThumb">→</div>
                </div>
                <div class="slider-hint" id="sliderHint">请拖动滑块到目标位置</div>
            </div>

            <!-- 短信验证码 -->
            <div class="captcha-panel" id="panelSMS">
                <div class="form-row">
                    <input type="tel" class="form-input" id="smsPhone" placeholder="手机号" maxlength="11">
                    <button type="button" class="btn-sms" id="smsSendBtn" onclick="sendSMSCode()">发送验证码</button>
                </div>
                <input type="text" class="form-input" id="smsCode" placeholder="短信验证码" style="margin-top:0.5rem;" autocomplete="off">
            </div>

            <div class="remember-row">
                <input type="checkbox" id="rememberMe" checked>
                <label for="rememberMe">记住登录（30天内自动登录）</label>
            </div>

            <button type="submit" class="btn btn-primary" id="loginBtn">登录</button>
        </form>

        <div class="auth-links">
            <a href="/register.html">注册账号</a>
            <span style="color:rgba(255,255,255,0.3);">|</span>
            <a href="/forgot-password.html">忘记密码</a>
            <span style="color:rgba(255,255,255,0.3);">|</span>
            <a href="/">返回首页</a>
        </div>
    </div>
</div>

<script src="/js/main.js"></script>
<script>
(function() {
    'use strict';

    var captchaType = 'image';  // image | slider | sms
    var captchaId = '';
    var sliderId = '';
    var sliderTargetX = 0;
    var smsId = '';
    var smsTimer = 0;

    // DOM refs
    var $ = function(id) { return document.getElementById(id); };

    // Init
    document.addEventListener('DOMContentLoaded', function() {
        if (window.createStars) createStars();
        checkAutoLogin();
        loadImageCaptcha();
        initSlider();
    });

    // 自动登录检查
    async function checkAutoLogin() {
        var token = localStorage.getItem('token') || sessionStorage.getItem('token');
        if (!token) return;
        try {
            var resp = await fetch('/api/profile', { headers: { 'Authorization': 'Bearer ' + token } });
            var data = await resp.json();
            if (data.success) {
                window.location.replace('/');
            } else {
                localStorage.removeItem('token');
                sessionStorage.removeItem('token');
            }
        } catch (e) {}
    }

    // 切换验证码类型
    window.switchCaptcha = function(type) {
        captchaType = type;
        document.querySelectorAll('.captcha-tab').forEach(function(t) { t.classList.remove('active'); });
        document.querySelector('.captcha-tab[data-type="' + type + '"]').classList.add('active');
        document.querySelectorAll('.captcha-panel').forEach(function(p) { p.classList.remove('active'); });
        $('panel' + type.charAt(0).toUpperCase() + type.slice(1).toLowerCase().replace('ms', 'MS').replace('ms','MS')).classList.add('active');
        if (type === 'image') loadImageCaptcha();
        if (type === 'slider') initSlider();
    };

    // 图片验证码
    async function loadImageCaptcha() {
        try {
            var data = await Auth.generateCaptcha();
            if (data.success) {
                captchaId = data.captcha_id;
                $('captchaImage').innerHTML = '<img src="' + data.image + '" alt="验证码">';
            }
        } catch (e) {
            Auth.showMsg('authMsg', '验证码加载失败', true);
        }
    }

    // 滑块验证码
    function initSlider() {
        var track = $('sliderTrack');
        var thumb = $('sliderThumb');
        var target = $('sliderTarget');
        var hint = $('sliderHint');

        Auth.generateSlider().then(function(data) {
            if (!data.success) return;
            sliderId = data.slider_id;
            sliderTargetX = data.target_x;
            target.style.left = sliderTargetX + '%';
            hint.textContent = '请拖动滑块到目标位置';
            thumb.style.left = '0px';
        }).catch(function() {});

        var dragging = false, startX = 0, startLeft = 0;

        thumb.addEventListener('mousedown', onStart);
        thumb.addEventListener('touchstart', onStart, { passive: false });

        function onStart(e) {
            e.preventDefault();
            dragging = true;
            startX = (e.touches ? e.touches[0].clientX : e.clientX);
            startLeft = thumb.offsetLeft;
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('touchend', onEnd);
        }

        function onMove(e) {
            if (!dragging) return;
            var clientX = e.touches ? e.touches[0].clientX : e.clientX;
            var diff = clientX - startX;
            var maxLeft = track.offsetWidth - thumb.offsetWidth;
            var newLeft = Math.max(0, Math.min(maxLeft, startLeft + diff));
            thumb.style.left = newLeft + 'px';
        }

        function onEnd() {
            dragging = false;
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onEnd);
            document.removeEventListener('touchmove', onMove);
            document.removeEventListener('touchend', onEnd);

            var pct = (thumb.offsetLeft / (track.offsetWidth - thumb.offsetWidth)) * 100;
            if (Math.abs(pct - sliderTargetX) <= 5) {
                hint.textContent = '✓ 验证通过';
                hint.style.color = '#4cd964';
            } else {
                hint.textContent = '✗ 位置不对，请重试';
                hint.style.color = '#ff6b6b';
                thumb.style.left = '0px';
            }
        }
    }

    // 短信验证码
    window.sendSMSCode = async function() {
        var phone = $('smsPhone').value.trim();
        if (!phone || !/^1[3-9]\d{9}$/.test(phone)) {
            Auth.showMsg('authMsg', '请输入正确的手机号', true);
            return;
        }

        var btn = $('smsSendBtn');
        btn.disabled = true;
        btn.textContent = '发送中...';

        try {
            var data = await Auth.sendSMS(phone);
            if (data.success) {
                smsId = data.sms_id;
                Auth.showMsg('authMsg', '验证码已发送（演示模式）', false);

                // 倒计时
                var sec = 60;
                smsTimer = setInterval(function() {
                    sec--;
                    if (sec <= 0) {
                        clearInterval(smsTimer);
                        btn.disabled = false;
                        btn.textContent = '重新发送';
                    } else {
                        btn.textContent = sec + '秒后重发';
                    }
                }, 1000);
            } else {
                Auth.showMsg('authMsg', data.message || '发送失败', true);
                btn.disabled = false;
                btn.textContent = '发送验证码';
            }
        } catch (e) {
            Auth.showMsg('authMsg', '网络错误', true);
            btn.disabled = false;
            btn.textContent = '发送验证码';
        }
    };

    // 登录表单提交
    $('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        var btn = $('loginBtn');

        var username = $('username').value.trim();
        var password = $('password').value;
        var remember = $('rememberMe').checked;

        if (!username) { Auth.showMsg('authMsg', '请输入用户名', true); return; }
        if (!password) { Auth.showMsg('authMsg', '请输入密码', true); return; }

        // 验证码校验
        try {
            if (captchaType === 'image') {
                var captchaText = $('captchaText').value.trim();
                if (!captchaText) { Auth.showMsg('authMsg', '请输入验证码', true); return; }
                var v = await Auth.verifyCaptcha(captchaId, captchaText);
                if (!v.success) { Auth.showMsg('authMsg', v.message || '验证码错误', true); loadImageCaptcha(); return; }
            } else if (captchaType === 'slider') {
                var pct = (($('sliderThumb').offsetLeft / ($('sliderTrack').offsetWidth - $('sliderThumb').offsetWidth)) * 100);
                var v = await Auth.verifySlider(sliderId, pct);
                if (!v.success) { Auth.showMsg('authMsg', v.message || '滑块验证失败', true); initSlider(); return; }
            } else if (captchaType === 'sms') {
                var smsCodeVal = $('smsCode').value.trim();
                if (!smsId) { Auth.showMsg('authMsg', '请先发送验证码', true); return; }
                if (!smsCodeVal) { Auth.showMsg('authMsg', '请输入短信验证码', true); return; }
                var v = await Auth.verifySMS(smsId, smsCodeVal);
                if (!v.success) { Auth.showMsg('authMsg', v.message || '验证码错误', true); return; }
            }
        } catch (e) {
            Auth.showMsg('authMsg', '验证失败，请重试', true);
            return;
        }

        // 登录
        btn.disabled = true;
        btn.textContent = '登录中...';

        try {
            var result = await Auth.login(username, password, remember);
            if (result.success) {
                Auth.showMsg('authMsg', '登录成功，正在跳转...', false);
                setTimeout(function() { window.location.replace('/'); }, 600);
            } else {
                Auth.showMsg('authMsg', result.message || '登录失败', true);
                btn.disabled = false;
                btn.textContent = '登录';
                if (captchaType === 'image') loadImageCaptcha();
                if (captchaType === 'slider') initSlider();
            }
        } catch (e) {
            Auth.showMsg('authMsg', '网络错误，请重试', true);
            btn.disabled = false;
            btn.textContent = '登录';
        }
    });

})();
</script>
</body>
</html>
