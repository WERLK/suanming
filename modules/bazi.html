<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffd700">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>八字排盘 - 玄机算命网</title>
<link rel="stylesheet" href="/css/style.css">
<script src="/js/main.js"></script>
<script src="/js/fortune-api.js"></script>
<style>
/* ========== 页面基础 ========== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:0;background:#0f0c29;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:14px;line-height:1.5}
.page-header{display:flex;align-items:center;gap:1rem;padding:0.75rem 1rem;background:linear-gradient(180deg,rgba(15,12,41,0.98),rgba(26,26,46,0.95));border-bottom:1px solid rgba(255,215,0,0.15);position:sticky;top:0;z-index:100}
.back-btn{background:none;border:none;color:#ffd700;font-size:1.2rem;cursor:pointer;padding:0.5rem}
.page-header h1{font-size:1.1rem;color:#ffd700;font-weight:600;flex:1}
.content-area{padding:0;padding-bottom:80px}

/* ========== 表单 ========== */
.form-section{padding:1rem;background:linear-gradient(180deg,rgba(26,26,46,0.9),rgba(15,12,41,0.95))}
.form-group{margin-bottom:1rem}
.form-label{display:block;font-size:0.85rem;color:rgba(255,255,255,0.7);margin-bottom:0.35rem}
.form-input,.form-select{width:100%;padding:0.7rem 0.9rem;border-radius:8px;border:1px solid rgba(255,215,0,0.2);background:rgba(255,255,255,0.05);color:#fff;font-size:0.9rem;outline:none}
.form-input:focus,.form-select:focus{border-color:rgba(255,215,0,0.5)}
.form-row{display:flex;gap:0.75rem}
.form-row .form-group{flex:1}
.gender-group{display:flex;gap:0.5rem;margin-top:0.3rem}
.gender-btn{flex:1;padding:0.6rem;border:1px solid rgba(255,215,0,0.2);border-radius:8px;background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.6);font-size:0.85rem;cursor:pointer;text-align:center;transition:all 0.2s}
.gender-btn.active{background:linear-gradient(135deg,rgba(255,215,0,0.25),rgba(255,215,0,0.1));color:#ffd700;border-color:rgba(255,215,0,0.4);font-weight:600}
.submit-btn{width:100%;padding:0.85rem;border:none;border-radius:10px;background:linear-gradient(135deg,#d4a017,#ffd700);color:#1a1a2e;font-size:1rem;font-weight:700;cursor:pointer;margin-top:0.5rem;box-shadow:0 4px 15px rgba(255,215,0,0.2)}
.submit-btn:active{transform:scale(0.98)}

/* ========== 用户信息卡 ========== */
.user-info-card{background:linear-gradient(135deg,rgba(255,215,0,0.08),rgba(255,215,0,0.02));border-bottom:1px solid rgba(255,215,0,0.1);padding:1rem}
.user-header{display:flex;align-items:center;gap:0.75rem;margin-bottom:0.75rem}
.user-avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#d4a017,#ffd700);display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.user-title{flex:1}
.user-name{font-size:1.1rem;color:#ffd700;font-weight:700}
.user-meta{font-size:0.75rem;color:rgba(255,255,255,0.5);margin-top:0.15rem}
.user-action{padding:0.4rem 0.8rem;border:1px solid rgba(255,215,0,0.3);border-radius:6px;background:rgba(255,215,0,0.08);color:#ffd700;font-size:0.75rem;cursor:pointer}
.date-info{display:flex;flex-wrap:wrap;gap:0.5rem 1rem;font-size:0.8rem;color:rgba(255,255,255,0.7);margin-bottom:0.5rem}
.date-info span{display:flex;align-items:center;gap:0.3rem}
.date-info .label{color:rgba(255,215,0,0.7);font-size:0.75rem}
.solar-time-info{display:flex;align-items:center;gap:0.5rem;font-size:0.8rem;color:rgba(255,255,255,0.6);margin-bottom:0.5rem}
.jieqi-info{font-size:0.8rem;color:rgba(255,255,255,0.65);margin-bottom:0.5rem}
.jieqi-info .jieqi-tag{background:rgba(255,215,0,0.1);color:#ffd700;padding:0.1rem 0.4rem;border-radius:4px;font-size:0.75rem;margin-right:0.3rem}
.extra-info{display:flex;flex-wrap:wrap;gap:0.5rem;font-size:0.8rem}
.extra-info .tag{background:rgba(255,255,255,0.05);border:1px solid rgba(255,215,0,0.1);border-radius:6px;padding:0.25rem 0.6rem;color:rgba(255,255,255,0.7);font-size:0.75rem}
.extra-info .tag .label{color:rgba(255,215,0,0.6);margin-right:0.2rem}

/* ========== 模式切换 ========== */
.view-tabs{display:flex;border-bottom:1px solid rgba(255,255,255,0.05);background:rgba(255,255,255,0.02)}
.view-tab{flex:1;padding:0.7rem 0.5rem;border:none;background:none;color:rgba(255,255,255,0.5);font-size:0.85rem;cursor:pointer;text-align:center;position:relative;transition:all 0.2s}
.view-tab.active{color:#ffd700;font-weight:600}
.view-tab.active::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:2px;background:#ffd700;border-radius:1px}

/* ========== 细盘表格 ========== */
.bazi-table{width:100%;border-collapse:collapse;font-size:0.85rem}
.bazi-table th,.bazi-table td{padding:0.5rem 0.3rem;text-align:center;border:1px solid rgba(255,255,255,0.05);vertical-align:middle}
.bazi-table th{background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.5);font-weight:400;font-size:0.75rem;white-space:nowrap}
.bazi-table td{color:rgba(255,255,255,0.85)}
.bazi-table .row-label{background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.5);font-size:0.75rem;white-space:nowrap;width:3.5rem}
.bazi-table .gan-cell{font-size:1.1rem;font-weight:700}
.bazi-table .zhi-cell{font-size:1.1rem;font-weight:700}
.bazi-table .shishen-cell{font-size:0.75rem;color:rgba(255,255,255,0.5)}
.bazi-table .canggan-cell{font-size:0.7rem;line-height:1.6;color:rgba(255,255,255,0.6)}
.bazi-table .canggan-cell .cg-item{display:inline-block;margin:0 0.1rem}
.bazi-table .changshou-cell{font-size:0.7rem;color:rgba(255,255,255,0.5)}
.bazi-table .nayin-cell{font-size:0.7rem;color:rgba(255,255,255,0.4)}
.bazi-table .xunkong-cell{font-size:0.7rem;color:rgba(255,255,255,0.4)}
.bazi-table .highlight{background:rgba(255,215,0,0.05)}

/* 五行颜色 */
.wx-mu{color:#4caf50}
.wx-huo{color:#f44336}
.wx-tu{color:#ff9800}
.wx-jin{color:#ffd700}
.wx-shui{color:#2196f3}

/* ========== 大运区 ========== */
.dayun-section{padding:1rem;border-bottom:1px solid rgba(255,255,255,0.05)}
.dayun-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem}
.dayun-title{font-size:0.9rem;color:#ffd700;font-weight:600}
.dayun-qiyun{font-size:0.75rem;color:rgba(255,255,255,0.5)}
.dayun-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:0.3rem;text-align:center}
.dayun-col{padding:0.4rem 0.1rem;background:rgba(255,255,255,0.02);border-radius:4px;min-width:0}
.dayun-year{font-size:0.7rem;color:rgba(255,255,255,0.4);margin-bottom:0.15rem}
.dayun-ganzhi{font-size:0.8rem;color:rgba(255,255,255,0.8);font-weight:600}
.dayun-age{font-size:0.65rem;color:rgba(255,255,255,0.35);margin-top:0.1rem}
.dayun-shishen{font-size:0.65rem;color:rgba(255,255,255,0.4);margin-top:0.05rem}
.dayun-col.active{background:rgba(255,215,0,0.1);border:1px solid rgba(255,215,0,0.2)}
.dayun-col.active .dayun-year{color:#ffd700}

/* ========== 流年区 ========== */
.liunian-section{padding:1rem;border-bottom:1px solid rgba(255,255,255,0.05)}
.liunian-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem}
.liunian-title{font-size:0.9rem;color:#ffd700;font-weight:600}
.liunian-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:0.25rem;text-align:center}
.liunian-col{padding:0.35rem 0.1rem;background:rgba(255,255,255,0.02);border-radius:4px;min-width:0}
.liunian-year{font-size:0.65rem;color:rgba(255,255,255,0.4)}
.liunian-ganzhi{font-size:0.75rem;color:rgba(255,255,255,0.8)}
.liunian-shishen{font-size:0.6rem;color:rgba(255,255,255,0.35)}
.liunian-col.active{background:rgba(255,215,0,0.1);border:1px solid rgba(255,215,0,0.2)}
.liunian-col.active .liunian-year{color:#ffd700}

/* 节气对照 */
.jieqi-row{display:grid;grid-template-columns:repeat(12,1fr);gap:0.15rem;text-align:center;margin-top:0.5rem;padding-top:0.5rem;border-top:1px solid rgba(255,255,255,0.03)}
.jieqi-item{font-size:0.6rem;color:rgba(255,255,255,0.35);line-height:1.4}
.jieqi-item .jq-name{color:rgba(255,255,255,0.45)}
.jieqi-item .jq-date{font-size:0.55rem}
.jieqi-item .jq-gz{font-size:0.55rem;color:rgba(255,215,0,0.4)}
.jieqi-item.active .jq-name{color:#ffd700}

/* ========== 流日流时展开 ========== */
.expand-section{padding:1rem;text-align:center}
.expand-btn{background:none;border:none;color:rgba(255,215,0,0.6);font-size:0.85rem;cursor:pointer;padding:0.5rem 1rem}
.expand-btn:hover{color:#ffd700}
.liuri-section,.liushi-section{display:none;padding:1rem}
.liuri-section.show,.liushi-section.show{display:block}

/* ========== 命局分析区 ========== */
.analysis-section{padding:1rem;border-bottom:1px solid rgba(255,255,255,0.05)}
.analysis-title{font-size:0.9rem;color:#ffd700;font-weight:600;margin-bottom:0.75rem}
.analysis-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0.75rem}
.analysis-card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,215,0,0.08);border-radius:10px;padding:0.75rem}
.analysis-card h4{font-size:0.8rem;color:rgba(255,215,0,0.7);margin:0 0 0.4rem 0;font-weight:500}
.analysis-card p{font-size:0.8rem;color:rgba(255,255,255,0.7);margin:0.2rem 0;line-height:1.5}
.analysis-card .highlight{color:#ffd700;font-weight:600}

/* ========== 五行统计条 ========== */
.wuxing-stats{padding:1rem;border-bottom:1px solid rgba(255,255,255,0.05)}
.wuxing-bar-row{display:flex;align-items:center;margin-bottom:0.4rem}
.wuxing-bar-label{width:2.5rem;font-size:0.8rem;color:rgba(255,255,255,0.6)}
.wuxing-bar-track{flex:1;height:8px;background:rgba(255,255,255,0.05);border-radius:4px;margin:0 0.5rem;overflow:hidden}
.wuxing-bar-fill{height:100%;border-radius:4px;transition:width 0.5s ease}
.wuxing-bar-value{font-size:0.75rem;color:rgba(255,255,255,0.4);width:2rem;text-align:right}

/* ========== 知识百科 ========== */
.knowledge-section{padding:1rem}
.knowledge-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0.75rem}
.knowledge-card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,215,0,0.08);border-radius:10px;padding:0.85rem;cursor:pointer;transition:all 0.2s}
.knowledge-card:hover{background:rgba(255,215,0,0.05);transform:translateY(-2px)}
.knowledge-card h3{font-size:0.85rem;color:#ffd700;margin:0 0 0.3rem 0}
.knowledge-card p{font-size:0.75rem;color:rgba(255,255,255,0.55);margin:0;line-height:1.5}

/* ========== 详情弹窗 ========== */
.detail-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:200;overflow-y:auto}
.detail-modal.show{display:block}
.detail-content{background:linear-gradient(180deg,#1a1a2e,#16213e);min-height:100%;padding:1rem;padding-bottom:3rem}
.detail-header{display:flex;align-items:center;gap:0.75rem;margin-bottom:1rem;padding-bottom:0.75rem;border-bottom:1px solid rgba(255,215,0,0.1)}
.detail-close{width:32px;height:32px;border:none;border-radius:50%;background:rgba(255,255,255,0.1);color:#fff;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.detail-title{flex:1;font-size:1rem;color:#ffd700;font-weight:600}
.detail-body{font-size:0.85rem;color:rgba(255,255,255,0.8);line-height:1.7}
.detail-body h3{font-size:0.95rem;color:#ffd700;margin:1rem 0 0.5rem 0}
.detail-body p{margin:0.3rem 0}
.detail-body table{width:100%;border-collapse:collapse;margin:0.5rem 0;font-size:0.8rem}
.detail-body th,.detail-body td{padding:0.4rem;border:1px solid rgba(255,255,255,0.08);text-align:center}
.detail-body th{background:rgba(255,215,0,0.08);color:#ffd700}

/* ========== 新手模式 ========== */
.hidden{display:none !important}
.beginner-result{padding:1rem}
.beginner-card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,215,0,0.1);border-radius:12px;padding:1rem;margin-bottom:1rem}
.beginner-card h3{font-size:0.95rem;color:#ffd700;margin:0 0 0.5rem 0}
.beginner-card p{font-size:0.85rem;color:rgba(255,255,255,0.75);margin:0.3rem 0;line-height:1.6}

/* ========== 响应式 ========== */
@media (max-width:380px){
.bazi-table th,.bazi-table td{padding:0.35rem 0.15rem;font-size:0.75rem}
.bazi-table .gan-cell,.bazi-table .zhi-cell{font-size:0.95rem}
.dayun-grid{grid-template-columns:repeat(4,1fr)}
.liunian-grid{grid-template-columns:repeat(5,1fr)}
.analysis-grid{grid-template-columns:1fr}
}
@media (max-width:480px){
.bazi-table{font-size:0.8rem}
.bazi-table .canggan-cell{font-size:0.65rem}
.dayun-grid{grid-template-columns:repeat(4,1fr)}
.liunian-grid{grid-template-columns:repeat(5,1fr)}
}
@media (min-width:481px) and (max-width:767px){
.dayun-grid{grid-template-columns:repeat(4,1fr)}
.liunian-grid{grid-template-columns:repeat(10,1fr)}
}
@media (min-width:768px){
.content-area{max-width:720px;margin:0 auto}
.dayun-grid{grid-template-columns:repeat(8,1fr)}
}

/* ========== 视图内容区 ========== */
.view-content{display:none}
.view-content.active{display:block}
</style>
</head>
<body>
<div class="page-header">
<button class="back-btn" onclick="window.location.href='/'">&#8592;</button>
<h1>&#9775; 八字排盘</h1>
</div>

<div class="content-area">
<!-- 输入表单 -->
<div class="form-section" id="formSection">
<div class="form-group">
<div class="form-label">身份证号（可选，用于自动推算出生时间）</div>
<input type="text" class="form-input" id="idCard" placeholder="请输入18位身份证号" maxlength="18" oninput="parseIdCard()">
<div class="hint" id="idCardHint" style="font-size:0.75rem;color:rgba(255,215,0,0.7);margin-top:0.3rem;"></div>
</div>
<div class="form-group">
<div class="form-label">姓名</div>
<input type="text" class="form-input" id="baziName" placeholder="请输入姓名（可选）">
</div>
<div class="form-group">
<div class="form-label">性别</div>
<div class="gender-group">
<div class="gender-btn" data-value="male" onclick="selectGender(this)">&#9794; 男</div>
<div class="gender-btn" data-value="female" onclick="selectGender(this)">&#9792; 女</div>
</div>
</div>
<div class="form-row">
<div class="form-group">
<div class="form-label">出生日期</div>
<input type="date" class="form-input" id="baziDate">
</div>
<div class="form-group">
<div class="form-label">出生时辰</div>
<select class="form-select" id="baziTime">
<option value="">请选择</option>
<option value="子时">子时 (23:00-01:00)</option>
<option value="丑时">丑时 (01:00-03:00)</option>
<option value="寅时">寅时 (03:00-05:00)</option>
<option value="卯时">卯时 (05:00-07:00)</option>
<option value="辰时">辰时 (07:00-09:00)</option>
<option value="巳时">巳时 (09:00-11:00)</option>
<option value="午时">午时 (11:00-13:00)</option>
<option value="未时">未时 (13:00-15:00)</option>
<option value="申时">申时 (15:00-17:00)</option>
<option value="酉时">酉时 (17:00-19:00)</option>
<option value="戌时">戌时 (19:00-21:00)</option>
<option value="亥时">亥时 (21:00-23:00)</option>
</select>
</div>
</div>
<div class="form-group">
<div class="form-label">出生地区（用于太阳时校正）</div>
<select class="form-select" id="baziRegion">
<option value="120">北京时间（东经120度）</option>
<option value="116.4">北京（东经116.4度）</option>
<option value="121.5">上海（东经121.5度）</option>
<option value="113.3">广州（东经113.3度）</option>
<option value="114.1">深圳（东经114.1度）</option>
<option value="106.5">重庆（东经106.5度）</option>
<option value="104.1">成都（东经104.1度）</option>
<option value="108.9">西安（东经108.9度）</option>
<option value="120.2">杭州（东经120.2度）</option>
<option value="118.8">南京（东经118.8度）</option>
<option value="117.2">天津（东经117.2度）</option>
<option value="113.6">武汉（东经113.6度）</option>
<option value="112.9">长沙（东经112.9度）</option>
<option value="126.6">哈尔滨（东经126.6度）</option>
<option value="123.4">沈阳（东经123.4度）</option>
<option value="125.3">长春（东经125.3度）</option>
<option value="117">济南（东经117度）</option>
<option value="113.7">郑州（东经113.7度）</option>
<option value="108.3">南宁（东经108.3度）</option>
<option value="102.7">昆明（东经102.7度）</option>
<option value="106.7">贵阳（东经106.7度）</option>
<option value="119.3">福州（东经119.3度）</option>
<option value="115.9">南昌（东经115.9度）</option>
<option value="117.3">合肥（东经117.3度）</option>
<option value="120.6">台北（东经120.6度）</option>
<option value="114.2">香港（东经114.2度）</option>
<option value="113.5">澳门（东经113.5度）</option>
</select>
</div>
<div class="form-group">
<div class="form-label">排盘模式</div>
<select class="form-select" id="baziMode">
<option value="pro">专业模式（详细）</option>
<option value="simple">新手模式（简洁）</option>
</select>
</div>
<button class="submit-btn" onclick="calculateBazi()">&#9775; 开始排盘</button>
</div>

<!-- 结果区域 -->
<div id="resultArea" class="hidden">
<!-- 用户信息卡 -->
<div class="user-info-card" id="userInfoCard"></div>

<!-- 五行统计 -->
<div class="wuxing-stats" id="wuxingStats"></div>

<!-- 视图切换 -->
<div class="view-tabs">
<div class="view-tab active" onclick="switchView('xipan')" id="tab-xipan">细盘</div>
<div class="view-tab" onclick="switchView('hengban')" id="tab-hengban">横版</div>
<div class="view-tab" onclick="switchView('shuban')" id="tab-shuban">竖版</div>
<div class="view-tab" onclick="switchView('fenxi')" id="tab-fenxi">分析</div>
<div class="view-tab" onclick="switchView('zhishi')" id="tab-zhishi">知识</div>
</div>

<!-- 细盘 -->
<div class="view-content active" id="view-xipan"></div>

<!-- 横版 -->
<div class="view-content" id="view-hengban"></div>

<!-- 竖版 -->
<div class="view-content" id="view-shuban"></div>

<!-- 分析 -->
<div class="view-content" id="view-fenxi"></div>

<!-- 知识 -->
<div class="view-content" id="view-zhishi"></div>
</div>
</div>

<!-- 详情弹窗 -->
<div class="detail-modal" id="detailModal">
<div class="detail-content">
<div class="detail-header">
<button class="detail-close" onclick="closeDetail()">&#10005;</button>
<div class="detail-title" id="detailTitle">详情</div>
</div>
<div class="detail-body" id="detailBody"></div>
</div>
</div>

<script>

// ========== 十神计算 ==========
function getShishen(dayMaster,target){
  const dayWuxing=wuxingMap[dayMaster];
  const targetWuxing=wuxingMap[target];
  const wxList=['木','火','土','金','水'];
  const dayIdx=wxList.indexOf(dayWuxing);
  const targetIdx=wxList.indexOf(targetWuxing);
  const diff=(targetIdx-dayIdx+5)%5;
  const isSameYinYang=(tiangan.indexOf(dayMaster)%2)===(tiangan.indexOf(target)%2);
  const sMap={'同我':'比肩','克我':'七杀','我克':'正财','生我':'正印','我生':'伤官'};
  const relation=['同我','生我','我生','克我','我克'][diff];
  let name=sMap[relation];
  if(name==='比肩'&&!isSameYinYang)name='劫财';
  if(name==='七杀'&&isSameYinYang)name='正官';
  if(name==='正财'&&isSameYinYang)name='偏财';
  if(name==='正印'&&!isSameYinYang)name='偏印';
  if(name==='伤官'&&isSameYinYang)name='食神';
  return name;
}

// ========== 八字核心计算 ==========
function calcBaziFull(name,gender,birthDate,birthTime,regionLon){
  const date=new Date(birthDate+'T12:00:00');
  const year=date.getFullYear();
  const month=date.getMonth()+1;
  const day=date.getDate();

  // 太阳时校正
  const region=parseFloat(regionLon)||120;
  const solarOffset=(region-120)*4; // 每度4分钟，东经为正，西经为负
  const solarSign=solarOffset>=0?'+':'-';
  const solarHourAbs=Math.floor(Math.abs(solarOffset)/60);
  const solarMinAbs=Math.abs(solarOffset)%60;

  // 四柱
  const yearGan=tiangan[(year-4)%10];
  const yearZhi=dizhi[(year-4)%12];
  const yearPillar=yearGan+yearZhi;

  // 月柱（考虑立春）
  let monthYear=year,monthMonth=month;
  const lichun=solarTerms[year]&&solarTerms[year]['立春'];
  if(lichun&&(month<lichun[0]||(month===lichun[0]&&day<lichun[1]))){monthYear=year-1;monthMonth=month+12;}
  const monthGan=tiangan[((monthYear-4)%5*2+monthMonth+1)%10];
  const monthZhi=dizhi[(monthMonth+1)%12];
  const monthPillar=monthGan+monthZhi;

  // 日柱（简化算法）
  const baseDate=new Date(1900,0,31);
  const diffDays=Math.floor((date-baseDate)/(86400000));
  const dayGan=tiangan[diffDays%10];
  const dayZhi=dizhi[diffDays%12];
  const dayPillar=dayGan+dayZhi;

  // 时柱（五鼠遁）
  const timeChar=birthTime?birthTime.charAt(0):'子';
  const timeIdx=shichenIdx[timeChar]||0;
  const dayGanIdx=tiangan.indexOf(dayGan);
  const hourGanIdx=(dayGanIdx%5)*2+timeIdx;
  const hourGan=tiangan[hourGanIdx%10];
  const hourZhi=dizhi[timeIdx];
  const hourPillar=hourGan+hourZhi;

  const pillars={year:yearPillar,month:monthPillar,day:dayPillar,hour:hourPillar};

  // 十神
  const shishenMap={};
  const allStems=[yearGan,monthGan,dayGan,hourGan];
  const allZhis=[yearZhi,monthZhi,dayZhi,hourZhi];
  allStems.forEach((s,i)=>{shishenMap[s]=getShishen(dayGan,s);});

  // 胎元 = 月柱天干进一，地支进三
  const taiyuanGan=tiangan[(tiangan.indexOf(monthGan)+1)%10];
  const taiyuanZhi=dizhi[(dizhi.indexOf(monthZhi)+3)%12];
  const taiyuan=taiyuanGan+taiyuanZhi;

  // 命宫：从寅月顺数到生月，再从生时逆数到寅时
  const minggongStart=2; // 寅=2
  const monthOffset=(dizhi.indexOf(monthZhi)-minggongStart+12)%12;
  const minggongZhiIdx=(minggongStart+monthOffset-timeIdx+12)%12;
  const minggongZhi=dizhi[minggongZhiIdx];
  // 命宫天干：用年干五虎遁
  const minggongGan=tiangan[((year-4)%5*2+minggongZhiIdx)%10];
  const minggong=minggongGan+minggongZhi;

  // 身宫：从寅月顺数到生月，再从生时顺数到寅时
  const shengongZhiIdx=(minggongStart+monthOffset+timeIdx)%12;
  const shengongZhi=dizhi[shengongZhiIdx];
  const shengongGan=tiangan[((year-4)%5*2+shengongZhiIdx)%10];
  const shengong=shengongGan+shengongZhi;

  // 五行统计
  const wuxing={'金':0,'木':0,'水':0,'火':0,'土':0};
  const allChars=yearPillar+monthPillar+dayPillar+hourPillar;
  for(let c of allChars){if(wuxingMap[c])wuxing[wuxingMap[c]]++;}
  // 藏干五行也计入
  allZhis.forEach(z=>{dizhiCanggan[z].forEach(cg=>{if(wuxingMap[cg])wuxing[wuxingMap[cg]]+=0.5;});});

  // 纳音
  const nayin={year:nayinMap[yearPillar]||'',month:nayinMap[monthPillar]||'',day:nayinMap[dayPillar]||'',hour:nayinMap[hourPillar]||'',taiyuan:nayinMap[taiyuan]||'',minggong:nayinMap[minggong]||'',shengong:nayinMap[shengong]||''};

  // 长生十二宫
  const changsheng={};
  [yearZhi,monthZhi,dayZhi,hourZhi,dizhiCanggan[monthZhi][0],minggongZhi,shengongZhi].forEach((z,i)=>{
    const keys=['year','month','day','hour','taiyuan','minggong','shengong'];
    const map=changshengMap[dayGan]||{};
    changsheng[keys[i]]=map[z]||'';
  });

  // 空亡（旬空）
  const xunkong=[];
  const xunIdx=Math.floor(tiangan.indexOf(dayGan)/2);
  const xunKey=['甲子','甲戌','甲申','甲午','甲辰','甲寅'][xunIdx];
  if(xunkongMap[xunKey])xunkong.push(...xunkongMap[xunKey]);

  // 生肖、星座
  const zodiac=shengxiao[(year-4)%12];
  const constellationName=getConstellation(month,day);

  // 节气
  const jieqi=getSolarTerms(year,month,day);

  // 农历
  const lunar=getLunarDate(year,month,day);

  // 大运
  const dayun=calcDayun(year,month,day,gender,dayGan,monthPillar);

  // 流年
  const liunian=calcLiunian(year,month,day,dayGan);

  // 神煞
  const shensha=calcShensha(yearPillar,monthPillar,dayPillar,hourPillar,gender);

  // 喜用神
  const xiyong=calcXiyong(dayGan,wuxing,monthZhi);

  return{
    name:name||'未知',gender:gender||'unknown',
    pillars,gans:{year:yearGan,month:monthGan,day:dayGan,hour:hourGan},zhis:{year:yearZhi,month:monthZhi,day:dayZhi,hour:hourZhi},
    dayMaster:dayGan,dayMasterElement:wuxingMap[dayGan],shishenMap,wuxing,
    taiyuan,minggong,shengong,nayin,changsheng,xunkong,xiyong,
    zodiac,constellation:constellationName,jieqi,lunar,
    dayun,liunian,shensha,
    solarTime:{sign:solarSign,hour:solarHourAbs,min:solarMinAbs,region:region},
    birthInfo:{year,month,day,time:birthTime||'子时'}
  };
}

function getConstellation(month,day){
  if(day<constellationDates[month-1])return constellation[month-1];
  return constellation[month%12];
}

function getSolarTerms(year,month,day){
  const terms=solarTerms[year]||solarTerms[2006];
  let prev=null,next=null;
  const termList=['立春','雨水','惊蛰','春分','清明','谷雨','立夏','小满','芒种','夏至','小暑','大暑','立秋','处暑','白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至','小寒','大寒'];
  for(let i=0;i<termList.length;i++){
    const t=termList[i];
    const d=terms[t];
    if(!d)continue;
    if(d[0]<month||(d[0]===month&&d[1]<=day)){prev={name:t,month:d[0],day:d[1]};}
    else if(!next){next={name:t,month:d[0],day:d[1]};break;}
  }
  return{prev,next};
}

function getLunarDate(year,month,day){
  // 简化农历计算
  const lunarMonths=['正','二','三','四','五','六','七','八','九','十','冬','腊'];
  const lunarDays=['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
  // 简化：假设农历比公历晚约1-2个月
  let lMonth=month-1;if(lMonth<=0)lMonth+=12;
  let lDay=day;
  // 简化处理
  return{year:year,month:lunarMonths[lMonth-1]+'月',day:lunarDays[Math.min(lDay-1,29)]};
}

// ========== 大运计算 ==========
function calcDayun(year,month,day,gender,dayGan,monthPillar){
  const dayGanIdx=tiangan.indexOf(dayGan);
  const isYang=dayGanIdx%2===0;
  const isMale=gender==='male';
  const forward=(isYang&&isMale)||(!isYang&&!isMale);
  const monthGanIdx=tiangan.indexOf(monthPillar.charAt(0));
  const monthZhiIdx=dizhi.indexOf(monthPillar.charAt(1));
  const startYear=year+(forward?0:0);
  const result=[];
  for(let i=0;i<8;i++){
    let gi=forward?(monthGanIdx+i+1)%10:(monthGanIdx-i-1+10)%10;
    let zi=forward?(monthZhiIdx+i+1)%12:(monthZhiIdx-i-1+12)%12;
    const ganZhi=tiangan[gi]+dizhi[zi];
    result.push({year:startYear+i*10,age:i*10,ganzhi:ganZhi,shishen:getShishen(dayGan,tiangan[gi])});
  }
  return result;
}

// ========== 流年计算 ==========
function calcLiunian(year,month,day,dayGan){
  const currentYear=new Date().getFullYear();
  const result=[];
  for(let i=0;i<10;i++){
    const y=currentYear+i;
    const gan=tiangan[(y-4)%10];
    const zhi=dizhi[(y-4)%12];
    result.push({year:y,ganzhi:gan+zhi,shishen:getShishen(dayGan,gan)});
  }
  return result;
}

// ========== 神煞 ==========
function calcShensha(yearPillar,monthPillar,dayPillar,hourPillar,gender){
  const result=[];
  const dayGan=dayPillar.charAt(0),dayZhi=dayPillar.charAt(1);
  const yearZhi=yearPillar.charAt(1);
  // 天乙贵人
  const tianyirenMap={'甲':['丑','未'],'戊':['丑','未'],'庚':['丑','未'],'乙':['子','申'],'己':['子','申'],'丙':['亥','酉'],'丁':['亥','酉'],'壬':['卯','巳'],'癸':['卯','巳'],'辛':['寅','午']};
  if(tianyirenMap[dayGan]&&tianyirenMap[dayGan].includes(yearZhi))result.push('天乙贵人');
  // 文昌
  const wenchangMap={'甲':'巳','乙':'午','丙':'申','丁':'酉','戊':'申','己':'酉','庚':'亥','辛':'子','壬':'寅','癸':'卯'};
  if(wenchangMap[dayGan]===yearZhi)result.push('文昌贵人');
  // 桃花
  const taohuaMap={'申':'酉','子':'酉','辰':'酉','寅':'卯','午':'卯','戌':'卯','巳':'午','酉':'午','丑':'午','亥':'子','卯':'子','未':'子'};
  if(taohuaMap[yearZhi]===dayZhi)result.push('桃花');
  // 驿马
  const yimaMap={'申':'寅','子':'寅','辰':'寅','寅':'申','午':'申','戌':'申','巳':'亥','酉':'亥','丑':'亥','亥':'巳','卯':'巳','未':'巳'};
  if(yimaMap[yearZhi]===dayZhi)result.push('驿马');
  return result;
}

// ========== 喜用神 ==========
function calcXiyong(dayGan,wuxing,monthZhi){
  const dayWuxing=wuxingMap[dayGan];
  const seasonMap={'寅':'春','卯':'春','辰':'春','巳':'夏','午':'夏','未':'夏','申':'秋','酉':'秋','戌':'秋','亥':'冬','子':'冬','丑':'冬'};
  const season=seasonMap[monthZhi]||'春';
  let xiyong=[],jishen=[];
  if(dayWuxing==='木'){xiyong=['水','木'];jishen=['金','土'];}
  else if(dayWuxing==='火'){xiyong=['木','火'];jishen=['水','金'];}
  else if(dayWuxing==='土'){xiyong=['火','土'];jishen=['木','水'];}
  else if(dayWuxing==='金'){xiyong=['土','金'];jishen=['火','木'];}
  else{xiyong=['金','水'];jishen=['土','火'];}
  return{xiyong,jishen,season};
}

// ========== 身份证解析 ==========
function parseIdCard(){
  const idCard=document.getElementById('idCard').value.trim();
  const hint=document.getElementById('idCardHint');
  if(idCard.length<18&&idCard.length<15){
    hint.textContent='';
    return;
  }
  // 校验格式
  const idRegex=/^\d{17}[\dXx]$/;
  const idRegex15=/^\d{15}$/;
  if(!idRegex.test(idCard)&&!idRegex15.test(idCard)){
    hint.textContent='⚠️ 身份证号格式不正确';
    hint.style.color='#ff6b6b';
    return;
  }
  let year,month,day,genderCode;
  if(idCard.length===18){
    year=parseInt(idCard.substring(6,10));
    month=parseInt(idCard.substring(10,12));
    day=parseInt(idCard.substring(12,14));
    genderCode=parseInt(idCard.charAt(16));
  }else{
    // 15位身份证：年份前两位补19
    year=parseInt('19'+idCard.substring(6,8));
    month=parseInt(idCard.substring(8,10));
    day=parseInt(idCard.substring(10,12));
    genderCode=parseInt(idCard.charAt(14));
  }
  // 填充出生日期
  const dateStr=year+'-'+String(month).padStart(2,'0')+'-'+String(day).padStart(2,'0');
  document.getElementById('baziDate').value=dateStr;
  // 自动推算时辰（默认午时，并提示用户）
  if(!document.getElementById('baziTime').value){
    document.getElementById('baziTime').value='午时';
  }
  // 自动设置性别
  const gender=genderCode%2===1?'male':'female';
  document.querySelectorAll('.gender-btn').forEach(btn=>btn.classList.remove('active'));
  document.querySelector('.gender-btn[data-value="'+gender+'"]')?.classList.add('active');
  hint.innerHTML='✅ 已从身份证解析：'+year+'年'+month+'月'+day+'日，'+ (gender==='male'?'男':'女')+'<br><span style="color:rgba(255,255,255,0.5);font-size:0.7rem;">注：时辰无法从身份证获取，请手动选择或保持默认"午时"</span>';
  hint.style.color='#51cf66';
}

// ========== 数据格式适配 ==========
function normalizeBaziData(apiData){
  const d=apiData;

  // 解析出生日期
  let birthYear=0,birthMonth=0,birthDay=0;
  if(d.birth_date){
    const parts=d.birth_date.split('-');
    birthYear=parseInt(parts[0])||0;
    birthMonth=parseInt(parts[1])||0;
    birthDay=parseInt(parts[2])||0;
  }

  // 解析 pillars
  let pillars={},gans={},zhis={};
  if(d.pillars){
    if(Array.isArray(d.pillars)){
      const labelMap={'年柱':'year','月柱':'month','日柱':'day','时柱':'hour'};
      d.pillars.forEach(p=>{
        const key=labelMap[p.label]||p.label;
        pillars[key]=p.ganzhi;
        gans[key]=p.tg;
        zhis[key]=p.dz;
      });
    }else if(typeof d.pillars==='object'){
      pillars=d.pillars;
      for(const[key,val]of Object.entries(pillars)){
        if(val&&val.length>=2){
          gans[key]=val.charAt(0);
          zhis[key]=val.charAt(1);
        }
      }
    }
  }

  // 解析五行统计
  let wuxing={'金':0,'木':0,'水':0,'火':0,'土':0};
  if(d.wuxing_stats){
    if(Array.isArray(d.wuxing_stats)){
      d.wuxing_stats.forEach(w=>{wuxing[w.element||w.name]=w.count;});
    }else{Object.assign(wuxing,d.wuxing_stats);}
  }

  // 解析大运
  const dayun=(d.dayun||[]).map(dy=>({
    year:dy.year,age:dy.age,ganzhi:dy.ganzhi,shishen:dy.shishen
  }));

  // 解析流年
  const liunian=(d.liunian||[]).map(ln=>({
    year:ln.year,ganzhi:ln.ganzhi,shishen:ln.shishen
  }));

  // 解析十神
  let shishenMap={};
  if(d.shishen){
    if(Array.isArray(d.shishen)){
      d.shishen.forEach(s=>{shishenMap[s.stem||s.gan]=s.shishen||s.name;});
    }else{shishenMap=d.shishen;}
  }

  return{
    name:d.name||'未知',
    gender:d.gender||'unknown',
    pillars,gans,zhis,
    dayMaster:d.day_master,
    dayMasterElement:d.day_master_element,
    shishenMap,
    wuxing,
    taiyuan:d.taiyuan,
    minggong:d.minggong,
    shengong:d.shengong,
    nayin:d.nayin||{},
    changsheng:d.changsheng||{},
    xunkong:d.xunkong||[],
    xiyong:d.xiyong||{xiyong:[],jishen:[],season:''},
    zodiac:d.zodiac,
    constellation:d.constellation,
    jieqi:d.jieqi||{prev:null,next:null},
    lunar:d.lunar_date||{year:birthYear,month:'',day:''},
    dayun,liunian,
    shensha:d.shensha||[],
    solarTime:d.solar_time||{region:120,sign:'+',hour:0,min:0},
    birthInfo:{year:birthYear,month:birthMonth,day:birthDay,time:d.birth_time||''}
  };
}

// ========== 显示函数 ==========
async function calculateBazi(){
  const name=document.getElementById('baziName').value;
  const gender=document.querySelector('.gender-btn.active')?.dataset.value||'male';
  const birthDate=document.getElementById('baziDate').value;
  const birthTime=document.getElementById('baziTime').value;
  const region=parseFloat(document.getElementById('baziRegion').value)||120;
  const mode=document.getElementById('baziMode').value;
  if(!birthDate||!birthTime){alert('请选择出生日期和时辰');return;}

  // 显示loading
  showFortuneLoading('正在联网排盘...');

  // 先尝试API调用
  const apiResult=await fortuneAPI('bazi',{
    name,gender,birth_date:birthDate,birth_time:birthTime,region_lon:region
  },{showLoading:false});

  let data,apiSource;

  if(apiResult&&apiResult.success&&apiResult.data){
    // API成功，使用API数据
    data=normalizeBaziData(apiResult.data);
    apiSource=apiResult.meta?apiResult.meta.source:'realtime';
    hideFortuneLoading();
  }else{
    // API失败，降级到本地算法
    hideFortuneLoading();
    showToast('联网分析失败，已自动切换到本地计算');
    data=calcBaziFull(name,gender,birthDate,birthTime,region);
    apiSource='local_fallback';
  }

  window.baziData=data;
  document.getElementById('formSection').classList.add('hidden');
  document.getElementById('resultArea').classList.remove('hidden');

  // 显示数据来源标识
  showDataBadge(apiSource,'resultArea');

  // 根据模式渲染
  if(mode==='simple'){
    document.getElementById('tab-xipan').style.display='none';
    document.getElementById('tab-hengban').style.display='none';
    document.getElementById('tab-shuban').style.display='none';
    document.getElementById('tab-zhishi').style.display='none';
    document.getElementById('wuxingStats').style.display='block';
    renderUserInfo(data);
    renderWuxingStats(data);
    renderSimpleAnalysis(data);
    switchView('fenxi');
    document.getElementById('tab-fenxi').style.display='';
  }else{
    ['tab-xipan','tab-hengban','tab-shuban','tab-fenxi','tab-zhishi'].forEach(id=>{
      document.getElementById(id).style.display='';
    });
    document.getElementById('wuxingStats').style.display='block';
    renderUserInfo(data);
    renderWuxingStats(data);
    renderXipan(data);
    renderHengban(data);
    renderShuban(data);
    renderFenxi(data);
    renderZhishi(data);
    switchView('xipan');
  }
}

  html+=`<div class="analysis-card"><h4>喜用神</h4><p>喜用神：<strong class="highlight">${data.xiyong.xiyong.join('、')}</strong></p><p>忌神：<strong class="highlight">${data.xiyong.jishen.join('、')}</strong></p></div>`;
  html+=`<div class="analysis-card"><h4>十神分析</h4><p>年干${data.gans.year}为${data.shishenMap[data.gans.year]}，月干${data.gans.month}为${data.shishenMap[data.gans.month]}</p><p>时干${data.gans.hour}为${data.shishenMap[data.gans.hour]}</p></div>`;
  html+=`<div class="analysis-card"><h4>神煞</h4><p>${data.shensha.length>0?data.shensha.join('、'):'无明显神煞'}</p></div>`;
  html+=`<div class="analysis-card"><h4>空亡</h4><p>日柱旬空：<strong class="highlight">${data.xunkong.join('、')||'无'}</strong></p><p>空亡代表该柱所主之事有缺失或延迟之象</p></div>`;
  html+=`<div class="analysis-card"><h4>命宫胎元</h4><p>命宫${data.minggong}，主一生之归宿</p><p>胎元${data.taiyuan}，主先天之根基</p></div>`;
  html+='</div></div>';
  document.getElementById('view-fenxi').innerHTML=html;
}
