<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffd700">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="玄机算命">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="msapplication-TileImage" content="/icon-192.png">
<meta name="msapplication-TileColor" content="#ffd700">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>八字排盘 - 玄机算命网</title>
<link rel="stylesheet" href="/css/style.css">
<style>
/* 八字排盘页面特定样式 */
.back-btn {
    background: none;
    border: none;
    color: #ffd700;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 0.5rem;
}

.page-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem;
    background: linear-gradient(180deg, rgba(15,12,41,0.98), rgba(26,26,46,0.95));
    border-bottom: 1px solid rgba(255,215,0,0.15);
}

.page-header h1 {
    font-size: 1.2rem;
    color: #ffd700;
    font-weight: 600;
}

.content-area {
    padding: 1rem;
    padding-bottom: 80px;
}

.section {
    background: linear-gradient(135deg, rgba(255,215,0,0.05), rgba(255,215,0,0.02));
    border: 1px solid rgba(255,215,0,0.1);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
}

.section h2 {
    color: #ffd700;
    font-size: 1rem;
    margin-bottom: 0.8rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid rgba(255,215,0,0.1);
}

.section p {
    font-size: 0.85rem;
    line-height: 1.8;
    color: rgba(255,255,255,0.8);
    margin-bottom: 0.5rem;
}

.knowledge-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1rem;
    margin-top: 1rem;
}

.knowledge-card {
    background: linear-gradient(135deg, rgba(255,215,0,0.05), rgba(255,215,0,0.02));
    border: 1px solid rgba(255,215,0,0.1);
    border-radius: 12px;
    padding: 1rem;
    cursor: pointer;
    transition: all 0.3s;
}

.knowledge-card:hover {
    background: linear-gradient(135deg, rgba(255,215,0,0.1), rgba(255,215,0,0.03));
    transform: translateY(-2px);
}

.knowledge-card h3 {
    color: #ffd700;
    font-size: 0.9rem;
    margin-bottom: 0.5rem;
}

.knowledge-card p {
    font-size: 0.8rem;
    line-height: 1.6;
    color: rgba(255,255,255,0.7);
}

/* 表单样式 */
.form-container {
    max-width: 500px;
    margin: 0 auto;
}

.form-group {
    margin-bottom: 1.2rem;
}

.form-label {
    display: block;
    font-size: 0.9rem;
    color: rgba(255,255,255,0.9);
    margin-bottom: 0.5rem;
    font-weight: 500;
}

.form-input {
    width: 100%;
    padding: 0.8rem 1rem;
    border-radius: 8px;
    border: 1px solid rgba(255,215,0,0.2);
    background: rgba(255,255,255,0.05);
    color: #fff;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.3s;
}

.form-input:focus {
    border-color: rgba(255,215,0,0.5);
    background: rgba(255,255,255,0.08);
}

.form-select {
    width: 100%;
    padding: 0.8rem 1rem;
    border-radius: 8px;
    border: 1px solid rgba(255,215,0,0.2);
    background: rgba(255,255,255,0.05);
    color: #fff;
    font-size: 0.9rem;
    outline: none;
    cursor: pointer;
}

.form-select option {
    background: #1a1a2e;
    color: #fff;
}

.submit-btn {
    width: 100%;
    padding: 1rem;
    border-radius: 8px;
    border: none;
    background: linear-gradient(135deg, #ffd700, #ffed4e);
    color: #000;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 1.5rem;
    transition: transform 0.2s;
}

.submit-btn:hover {
    transform: scale(1.02);
}

.submit-btn:active {
    transform: scale(0.98);
}

/* 结果展示 */
.result-container {
    max-width: 600px;
    margin: 0 auto;
}

.result-section {
    background: linear-gradient(135deg, rgba(255,215,0,0.05), rgba(255,215,0,0.02));
    border: 1px solid rgba(255,215,0,0.1);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
    animation: fadeIn 0.5s ease-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.result-section h3 {
    color: #ffd700;
    font-size: 1rem;
    margin-bottom: 0.8rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid rgba(255,215,0,0.1);
}

.result-table {
    width: 100%;
    border-collapse: collapse;
    margin: 1rem 0;
}

.result-table th,
.result-table td {
    padding: 0.6rem;
    text-align: left;
    font-size: 0.85rem;
    border-bottom: 1px solid rgba(255,215,0,0.1);
}

.result-table th {
    color: #ffd700;
    font-weight: 600;
    background: rgba(255,215,0,0.05);
}

.result-table td {
    color: rgba(255,255,255,0.8);
}

/* 标签页 */
.tab-container {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
    border-bottom: 1px solid rgba(255,215,0,0.1);
}

.tab-btn {
    padding: 0.6rem 1rem;
    border: none;
    background: none;
    color: rgba(255,255,255,0.6);
    font-size: 0.85rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.3s;
}

.tab-btn.active {
    color: #ffd700;
    border-bottom-color: #ffd700;
}

.tab-content {
    display: none;
}

.tab-content.active {
    display: block;
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="app">
    <!-- 页面头部 -->
    <div class="page-header">
        <button type="button" class="back-btn" onclick="history.back()">←</button>
        <h1>☯ 八字排盘</h1>
    </div>

    <!-- 主内容区 -->
    <div class="content-area">
        <!-- 标签页导航 -->
        <div class="tab-container">
            <button type="button" class="tab-btn active" data-tab="form" onclick="switchTab('form', this)">排盘</button>
            <button type="button" class="tab-btn" data-tab="knowledge" onclick="switchTab('knowledge', this)">知识</button>
            <button type="button" class="tab-btn" data-tab="result" onclick="switchTab('result', this)">结果</button>
        </div>

        <!-- 排盘表单 -->
        <div class="tab-content active" id="formTab">
            <div class="form-container">
                <div class="form-group">
                    <label class="form-label">姓名</label>
                    <input type="text" class="form-input" id="nameInput" placeholder="请输入姓名">
                </div>
                
                <div class="form-group">
                    <label class="form-label">性别</label>
                    <select class="form-select" id="genderInput">
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">出生日期（公历）</label>
                    <input type="date" class="form-input" id="dateInput">
                </div>
                
                <div class="form-group">
                    <label class="form-label">出生时辰</label>
                    <select class="form-select" id="timeInput">
                        <option value="子时(23-1)">子时 (23:00-01:00)</option>
                        <option value="丑时(1-3)">丑时 (01:00-03:00)</option>
                        <option value="寅时(3-5)">寅时 (03:00-05:00)</option>
                        <option value="卯时(5-7)">卯时 (05:00-07:00)</option>
                        <option value="辰时(7-9)">辰时 (07:00-09:00)</option>
                        <option value="巳时(9-11)">巳时 (09:00-11:00)</option>
                        <option value="午时(11-13)">午时 (11:00-13:00)</option>
                        <option value="未时(13-15)">未时 (13:00-15:00)</option>
                        <option value="申时(15-17)">申时 (15:00-17:00)</option>
                        <option value="酉时(17-19)">酉时 (17:00-19:00)</option>
                        <option value="戌时(19-21)">戌时 (19:00-21:00)</option>
                        <option value="亥时(21-23)">亥时 (21:00-23:00)</option>
                    </select>
                </div>
                
                <button type="button" class="submit-btn" onclick="calculateBazi()">开始排盘</button>
            </div>
        </div>

        <!-- 知识内容 -->
        <div class="tab-content" id="knowledgeTab">
            <div class="knowledge-grid">
                <div class="knowledge-card" onclick="showKnowledgeDetail('basics')">
                    <h3>📖 八字基础知识</h3>
                    <p>了解天干地支、五行生克、十神关系等核心概念...</p>
                </div>
                
                <div class="knowledge-card" onclick="showKnowledgeDetail('fourpillars')">
                    <h3>🏛️ 四柱含义</h3>
                    <p>年柱、月柱、日柱、时柱分别代表的含义...</p>
                </div>
                
                <div class="knowledge-card" onclick="showKnowledgeDetail('tiangan')">
                    <h3>☀️ 十天干</h3>
                    <p>甲、乙、丙、丁、戊、己、庚、辛、壬、癸的详细解释...</p>
                </div>
                
                <div class="knowledge-card" onclick="showKnowledgeDetail('dizhi')">
                    <h3>🌙 十二地支</h3>
                    <p>子、丑、寅、卯、辰、巳、午、未、申、酉、戌、亥的含义...</p>
                </div>
                
                <div class="knowledge-card" onclick="showKnowledgeDetail('wuxing')">
                    <h3>⚖️ 五行生克</h3>
                    <p>金木水火土相生相克关系的详细解读...</p>
                </div>
                
                <div class="knowledge-card" onclick="showKnowledgeDetail('shishen')">
                    <h3>🎭 十神关系</h3>
                    <p>正官、七杀、正印、偏印、食神、伤官、比肩、劫财、正财、偏财...</p>
                </div>
                
                <div class="knowledge-card" onclick="showKnowledgeDetail('dayun')">
                    <h3>📅 大运流年</h3>
                    <p>十年大运和流年运势的分析方法...</p>
                </div>
                
                <div class="knowledge-card" onclick="showKnowledgeDetail('analyze')">
                    <h3>🔍 命局分析</h3>
                    <p>如何分析日主强弱、五行平衡、喜用神等...</p>
                </div>
            </div>
        </div>

        <!-- 结果显示 -->
        <div class="tab-content" id="resultTab">
            <div class="result-container" id="resultContainer">
                <div class="section">
                    <p style="text-align: center; color: rgba(255,255,255,0.5);">
                        请先填写信息进行排盘
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/main.js">
// 显示提示
function showToast(msg) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(255,215,0,0.9);color:#000;padding:0.8rem 1.5rem;border-radius:8px;z-index:9999;font-size:0.9rem;';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}
</script>
<script>
// ===== 标签页切换 =====
function switchTab(tabName, btnElement) {
    // 更新标签按钮状态
    const tabBtns = document.querySelectorAll('.tab-btn');
    tabBtns.forEach(btn => btn.classList.remove('active'));
    
    // 激活对应按钮（通过参数或 DOM 查找）
    if (btnElement) {
        btnElement.classList.add('active');
    } else {
        const targetBtn = document.querySelector('.tab-btn[data-tab="' + tabName + '"]');
        if (targetBtn) targetBtn.classList.add('active');
    }
    
    // 显示对应的内容
    const tabContents = document.querySelectorAll('.tab-content');
    tabContents.forEach(content => content.classList.remove('active'));
    
    document.getElementById(tabName + 'Tab').classList.add('active');
}

// ===== 计算八字 =====
function calculateBazi() {
    const name = document.getElementById('nameInput').value;
    const gender = document.getElementById('genderInput').value;
    const date = document.getElementById('dateInput').value;
    const time = document.getElementById('timeInput').value;
    
    if (!name || !date || !time) {
        showToast('请填写完整信息');
        return;
    }
    
    // 显示加载提示
    showToast('正在排盘...');
    
    // 模拟计算延迟
    setTimeout(() => {
        // 调用计算函数
        const result = calcBaziSimple(date, time.charAt(0));
        
        // 生成结果HTML
        const resultHTML = generateBaziResultHTML(result, name, gender, date, time);
        
        // 显示结果
        document.getElementById('resultContainer').innerHTML = resultHTML;
        
        // 切换到结果标签页
        switchTab('result');
        
        // 移除加载提示
        const toast = document.querySelector('.toast');
        if (toast) {
            toast.remove();
        }
    }, 1500);
}

// ===== 显示知识详情 =====
function showKnowledgeDetail(topic) {
    let content = '';
    
    switch(topic) {
        case 'basics':
            content = `
                <div class="section">
                    <h2>📖 八字基础知识</h2>
                    <p>八字排盘，又称四柱八字，是中国传统命理学的核心工具。它通过分析一个人出生的年、月、日、时四个时间点（称为"四柱"），每柱由一个天干和一个地支组成，共八个字，因此称为"八字"。</p>
                    
                    <h3>八字的核心要素</h3>
                    <ul>
                        <li><strong>四柱</strong>：年柱、月柱、日柱、时柱</li>
                        <li><strong>天干</strong>：甲、乙、丙、丁、戊、己、庚、辛、壬、癸</li>
                        <li><strong>地支</strong>：子、丑、寅、卯、辰、巳、午、未、申、酉、戌、亥</li>
                        <li><strong>五行</strong>：金、木、水、火、土</li>
                        <li><strong>十神</strong>：正官、七杀、正印、偏印、食神、伤官、比肩、劫财、正财、偏财</li>
                    </ul>
                    
                    <h3>八字的应用</h3>
                    <p>八字排盘可以用于：</p>
                    <ul>
                        <li>性格分析：了解自己的性格特点和优缺点</li>
                        <li>事业规划：选择适合自己的职业方向</li>
                        <li>婚姻匹配：通过八字合婚，判断两个人的婚姻是否和谐</li>
                        <li>健康预测：提前预防可能出现的健康问题</li>
                        <li>运势规划：在有利的年份积极行动，在不利的年份谨慎行事</li>
                    </ul>
                </div>
            `;
            break;
            
        case 'fourpillars':
            content = `
                <div class="section">
                    <h2>🏛️ 四柱含义详解</h2>
                    
                    <h3>年柱 - 家族背景与早年运势</h3>
                    <p>年柱代表一个人的家族背景、祖辈情况、童年环境和早年运势。它反映了一个人的先天条件和家庭影响。</p>
                    
                    <h3>月柱 - 成长环境与事业基础</h3>
                    <p>月柱代表一个人的父母宫、兄弟姐妹、成长环境、教育背景和事业发展基础。月柱在八字中非常重要，因为它代表了人生的学习和积累阶段。</p>
                    
                    <h3>日柱 - 个人性格与婚姻状况</h3>
                    <p>日柱是八字的核心，日干代表命主本人，日支代表配偶宫。日柱反映了一个人的性格特点、婚姻状况、中年运势等。</p>
                    
                    <h3>时柱 - 子女宫及晚年运势</h3>
                    <p>时柱代表一个人的子女情况、晚年运势、内心世界和潜意识。时柱反映了一个人晚年的生活质量和精神追求。</p>
                    
                    <table class="result-table">
                        <tr>
                            <th>四柱</th>
                            <th>代表年龄</th>
                            <th>核心领域</th>
                        </tr>
                        <tr>
                            <td>年柱</td>
                            <td>0-16岁</td>
                            <td>祖辈、父母、童年</td>
                        </tr>
                        <tr>
                            <td>月柱</td>
                            <td>17-32岁</td>
                            <td>父母、兄弟、学业、事业基础</td>
                        </tr>
                        <tr>
                            <td>日柱</td>
                            <td>33-48岁</td>
                            <td>本人、配偶、中年运势</td>
                        </tr>
                        <tr>
                            <td>时柱</td>
                            <td>49岁以后</td>
                            <td>子女、晚年、内心世界</td>
                        </tr>
                    </table>
                </div>
            `;
            break;
            
        case 'tiangan':
            content = `
                <div class="section">
                    <h2>☀️ 十天干详解</h2>
                    
                    <h3>天干的阴阳五行属性</h3>
                    <table class="result-table">
                        <tr>
                            <th>天干</th>
                            <th>阴阳</th>
                            <th>五行</th>
                            <th>含义</th>
                        </tr>
                        <tr>
                            <td>甲</td>
                            <td>阳</td>
                            <td>木</td>
                            <td>参天大树，阳刚、正直、进取</td>
                        </tr>
                        <tr>
                            <td>乙</td>
                            <td>阴</td>
                            <td>木</td>
                            <td>花草藤蔓，阴柔、婉转、韧性</td>
                        </tr>
                        <tr>
                            <td>丙</td>
                            <td>阳</td>
                            <td>火</td>
                            <td>太阳之火，光明、热情、开朗</td>
                        </tr>
                        <tr>
                            <td>丁</td>
                            <td>阴</td>
                            <td>火</td>
                            <td>灯烛之火，温和、细腻、内敛</td>
                        </tr>
                        <tr>
                            <td>戊</td>
                            <td>阳</td>
                            <td>土</td>
                            <td>高山之土，厚重、稳重、包容</td>
                        </tr>
                        <tr>
                            <td>己</td>
                            <td>阴</td>
                            <td>土</td>
                            <td>田园之土，柔和、孕育、滋养</td>
                        </tr>
                        <tr>
                            <td>庚</td>
                            <td>阳</td>
                            <td>金</td>
                            <td>宝剑之金，刚毅、果断、锐利</td>
                        </tr>
                        <tr>
                            <td>辛</td>
                            <td>阴</td>
                            <td>金</td>
                            <td>首饰之金，精致、柔美、敏感</td>
                        </tr>
                        <tr>
                            <td>壬</td>
                            <td>阳</td>
                            <td>水</td>
                            <td>江河之水，奔腾、智慧、流动</td>
                        </tr>
                        <tr>
                            <td>癸</td>
                            <td>阴</td>
                            <td>水</td>
                            <td>雨露之水，滋润、含蓄、内敛</td>
                        </tr>
                    </table>
                    
                    <h3>天干的应用</h3>
                    <p>天干在八字中主要用于：</p>
                    <ul>
                        <li>判断日主（命主）的五行属性</li>
                        <li>分析十神关系</li>
                        <li>判断命局的五行平衡</li>
                        <li>预测性格和命运趋势</li>
                    </ul>
                </div>
            `;
            break;
            
        // 可以继续添加其他主题的知识内容...
    }
    
    // 显示知识详情
    document.getElementById('resultContainer').innerHTML = content;
    switchTab('result');
}

// ===== 页面加载时初始化 =====
document.addEventListener('DOMContentLoaded', function() {
    createStars();
});
</script>

</body>
</html>
