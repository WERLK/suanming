<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>八字排盘 - 玄机算命网</title>
<link rel="stylesheet" href="/css/style.css">
<style>
/* 八字排盘页面特定样式 */
.back-btn {
    background: none;
    border: none;
    color: #ffd700;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 0.5rem;
}

.page-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem;
    background: linear-gradient(180deg, rgba(15,12,41,0.98), rgba(26,26,46,0.95));
    border-bottom: 1px solid rgba(255,215,0,0.15);
}

.page-header h1 {
    font-size: 1.2rem;
    color: #ffd700;
    font-weight: 600;
}

.content-area {
    padding: 1rem;
    padding-bottom: 80px;
}

/* 模式切换 */
.mode-switch {
    display: flex;
    gap: 0;
    margin-bottom: 1rem;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid rgba(255,215,0,0.2);
}

.mode-btn {
    flex: 1;
    padding: 0.7rem 1rem;
    border: none;
    background: rgba(255,215,0,0.05);
    color: rgba(255,255,255,0.6);
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.3s;
    text-align: center;
}

.mode-btn.active {
    background: linear-gradient(135deg, rgba(255,215,0,0.25), rgba(255,215,0,0.1));
    color: #ffd700;
    font-weight: 600;
}

.mode-btn:hover {
    background: rgba(255,215,0,0.1);
}

/* 表单样式 */
.form-container {
    max-width: 500px;
    margin: 0 auto;
}

.form-group {
    margin-bottom: 1.2rem;
}

.form-label {
    display: block;
    font-size: 0.9rem;
    color: rgba(255,255,255,0.9);
    margin-bottom: 0.5rem;
    font-weight: 500;
}

.form-input {
    width: 100%;
    padding: 0.8rem 1rem;
    border-radius: 8px;
    border: 1px solid rgba(255,215,0,0.2);
    background: rgba(255,255,255,0.05);
    color: #fff;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.3s;
    box-sizing: border-box;
}

.form-input:focus {
    border-color: rgba(255,215,0,0.5);
    background: rgba(255,255,255,0.08);
}

.form-select {
    width: 100%;
    padding: 0.8rem 1rem;
    border-radius: 8px;
    border: 1px solid rgba(255,215,0,0.2);
    background: rgba(255,255,255,0.05);
    color: #fff;
    font-size: 0.9rem;
    outline: none;
    cursor: pointer;
    box-sizing: border-box;
}

.form-select option {
    background: #1a1a2e;
    color: #fff;
}

.submit-btn {
    width: 100%;
    padding: 1rem;
    border-radius: 8px;
    border: none;
    background: linear-gradient(135deg, #ffd700, #ffed4e);
    color: #000;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 1.5rem;
    transition: transform 0.2s;
}

.submit-btn:hover {
    transform: scale(1.02);
}

.submit-btn:active {
    transform: scale(0.98);
}

/* 结果展示 */
.result-container {
    max-width: 640px;
    margin: 0 auto;
}

.result-section {
    background: linear-gradient(135deg, rgba(255,215,0,0.05), rgba(255,215,0,0.02));
    border: 1px solid rgba(255,215,0,0.1);
    border-radius: 12px;
    padding: 1.2rem;
    margin-bottom: 1rem;
    animation: fadeIn 0.5s ease-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.result-section h3 {
    color: #ffd700;
    font-size: 1rem;
    margin-bottom: 0.8rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid rgba(255,215,0,0.1);
}

.result-section h4 {
    color: rgba(255,215,0,0.8);
    font-size: 0.9rem;
    margin: 1rem 0 0.5rem 0;
}

.result-table {
    width: 100%;
    border-collapse: collapse;
    margin: 0.8rem 0;
}

.result-table th,
.result-table td {
    padding: 0.6rem 0.5rem;
    text-align: center;
    font-size: 0.85rem;
    border: 1px solid rgba(255,215,0,0.1);
}

.result-table th {
    color: #ffd700;
    font-weight: 600;
    background: rgba(255,215,0,0.08);
}

.result-table td {
    color: rgba(255,255,255,0.85);
}

.wuxing-bar-container {
    margin: 0.5rem 0;
}

.wuxing-bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: rgba(255,255,255,0.7);
    margin-bottom: 0.2rem;
}

.wuxing-bar {
    height: 8px;
    border-radius: 4px;
    background: rgba(255,255,255,0.1);
    overflow: hidden;
}

.wuxing-bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.8s ease;
}

/* 十神表格 */
.shishen-table {
    width: 100%;
    border-collapse: collapse;
    margin: 0.8rem 0;
}

.shishen-table th,
.shishen-table td {
    padding: 0.5rem;
    font-size: 0.8rem;
    border: 1px solid rgba(255,215,0,0.1);
    text-align: center;
}

.shishen-table th {
    background: rgba(255,215,0,0.08);
    color: #ffd700;
}

.shishen-table td {
    color: rgba(255,255,255,0.8);
}

/* 知识区域 */
.knowledge-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1rem;
    margin-top: 1rem;
}

.knowledge-card {
    background: linear-gradient(135deg, rgba(255,215,0,0.05), rgba(255,215,0,0.02));
    border: 1px solid rgba(255,215,0,0.1);
    border-radius: 12px;
    padding: 1rem;
    cursor: pointer;
    transition: all 0.3s;
}

.knowledge-card:hover {
    background: linear-gradient(135deg, rgba(255,215,0,0.1), rgba(255,215,0,0.03));
    transform: translateY(-2px);
}

.knowledge-card h3 {
    color: #ffd700;
    font-size: 0.9rem;
    margin-bottom: 0.5rem;
}

.knowledge-card p {
    font-size: 0.8rem;
    line-height: 1.6;
    color: rgba(255,255,255,0.7);
}

/* 标签页 */
.tab-container {
    display: flex;
    gap: 0;
    margin-bottom: 1rem;
    border-bottom: 1px solid rgba(255,215,0,0.1);
}

.tab-btn {
    padding: 0.6rem 1rem;
    border: none;
    background: none;
    color: rgba(255,255,255,0.6);
    font-size: 0.85rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.3s;
}

.tab-btn.active {
    color: #ffd700;
    border-bottom-color: #ffd700;
}

.tab-content {
    display: none;
}

.tab-content.active {
    display: block;
}

/* 专业模式样式 */
.pro-bazi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.5rem;
    margin: 1rem 0;
}

.pro-pillar-box {
    background: rgba(255,215,0,0.05);
    border: 1px solid rgba(255,215,0,0.15);
    border-radius: 8px;
    padding: 0.8rem;
    text-align: center;
}

.pro-pillar-label {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.5);
    margin-bottom: 0.3rem;
}

.pro-pillar-gan {
    font-size: 1.4rem;
    font-weight: bold;
    color: #ffd700;
    line-height: 1.6;
}

.pro-pillar-zhi {
    font-size: 1.4rem;
    font-weight: bold;
    color: #fff;
    line-height: 1.6;
}

.pro-pillar-wuxing {
    font-size: 0.7rem;
    color: rgba(255,255,255,0.6);
    margin-top: 0.2rem;
}

.pro-pillar-canggan {
    font-size: 0.65rem;
    color: rgba(255,215,0,0.6);
    margin-top: 0.2rem;
}

.pro-nayin {
    font-size: 0.7rem;
    color: rgba(255,255,255,0.5);
    margin-top: 0.2rem;
}

.pro-shishen-row {
    display: flex;
    justify-content: space-around;
    margin: 0.5rem 0;
    padding: 0.5rem;
    background: rgba(255,255,255,0.02);
    border-radius: 6px;
}

.pro-shishen-item {
    text-align: center;
}

.pro-shishen-name {
    font-size: 0.7rem;
    color: rgba(255,255,255,0.5);
}

.pro-shishen-value {
    font-size: 0.85rem;
    color: #ffd700;
    font-weight: 600;
}

.dayun-table {
    width: 100%;
    border-collapse: collapse;
    margin: 0.8rem 0;
    font-size: 0.8rem;
}

.dayun-table th,
.dayun-table td {
    padding: 0.5rem;
    text-align: center;
    border: 1px solid rgba(255,215,0,0.1);
}

.dayun-table th {
    background: rgba(255,215,0,0.08);
    color: #ffd700;
}

.dayun-table td {
    color: rgba(255,255,255,0.8);
}

.dayun-current {
    background: rgba(255,215,0,0.1) !important;
    border-color: rgba(255,215,0,0.3) !important;
}

.analysis-text {
    font-size: 0.85rem;
    line-height: 1.8;
    color: rgba(255,255,255,0.8);
    padding: 0.8rem;
    background: rgba(255,255,255,0.02);
    border-radius: 8px;
    margin: 0.5rem 0;
}

.tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin: 0.5rem 0;
}

.tag-item {
    padding: 0.2rem 0.6rem;
    border-radius: 10px;
    font-size: 0.75rem;
    background: rgba(255,215,0,0.1);
    color: rgba(255,255,255,0.7);
    border: 1px solid rgba(255,215,0,0.15);
}

.tag-good { background: rgba(76,175,80,0.15); color: #8bc34a; border-color: rgba(76,175,80,0.3); }
.tag-bad { background: rgba(244,67,54,0.15); color: #ef5350; border-color: rgba(244,67,54,0.3); }
.tag-neutral { background: rgba(255,215,0,0.1); color: #ffd700; border-color: rgba(255,215,0,0.2); }

@media (max-width: 600px) {
    .pro-bazi-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="app">
    <!-- 页面头部 -->
    <div class="page-header">
        <button type="button" class="back-btn" onclick="history.back()">←</button>
        <h1>☯ 八字排盘</h1>
    </div>

    <!-- 主内容区 -->
    <div class="content-area">
        <!-- 标签页导航 -->
        <div class="tab-container">
            <button type="button" class="tab-btn active" data-tab="form" onclick="switchTab('form', this)">排盘</button>
            <button type="button" class="tab-btn" data-tab="knowledge" onclick="switchTab('knowledge', this)">知识</button>
            <button type="button" class="tab-btn" data-tab="result" onclick="switchTab('result', this)">结果</button>
        </div>

        <!-- 排盘表单 -->
        <div class="tab-content active" id="formTab">
            <!-- 模式切换 -->
            <div class="mode-switch">
                <button type="button" class="mode-btn active" id="basicModeBtn" onclick="switchBaziMode('basic')">☖ 初学者版</button>
                <button type="button" class="mode-btn" id="proModeBtn" onclick="switchBaziMode('pro')">✮ 专业者版</button>
            </div>

            <div class="form-container">
                <div class="form-group">
                    <label class="form-label">姓名</label>
                    <input type="text" class="form-input" id="nameInput" placeholder="请输入姓名">
                </div>

                <div class="form-group">
                    <label class="form-label">性别</label>
                    <select class="form-select" id="genderInput">
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">出生日期（公历）</label>
                    <input type="date" class="form-input" id="dateInput">
                </div>

                <div class="form-group">
                    <label class="form-label">出生时辰</label>
                    <select class="form-select" id="timeInput">
                        <option value="子时(23-1)">子时 (23:00-01:00)</option>
                        <option value="丑时(1-3)">丑时 (01:00-03:00)</option>
                        <option value="寅时(3-5)">寅时 (03:00-05:00)</option>
                        <option value="卯时(5-7)">卯时 (05:00-07:00)</option>
                        <option value="辰时(7-9)">辰时 (07:00-09:00)</option>
                        <option value="巳时(9-11)">巳时 (09:00-11:00)</option>
                        <option value="午时(11-13)">午时 (11:00-13:00)</option>
                        <option value="未时(13-15)">未时 (13:00-15:00)</option>
                        <option value="申时(15-17)">申时 (15:00-17:00)</option>
                        <option value="酉时(17-19)">酉时 (17:00-19:00)</option>
                        <option value="戌时(19-21)">戌时 (19:00-21:00)</option>
                        <option value="亥时(21-23)">亥时 (21:00-23:00)</option>
                    </select>
                </div>

                <button type="button" class="submit-btn" onclick="calculateBazi()">☯ 开始排盘</button>
            </div>
        </div>

        <!-- 知识内容 -->
        <div class="tab-content" id="knowledgeTab">
            <div style="margin-bottom:1rem;">
                <button type="button" class="submit-btn" style="width:auto;padding:0.8rem 1.5rem;font-size:0.9rem;" onclick="triggerImageUpload('bazi')">📷 上传图片分析</button>
            </div>
            <div class="knowledge-grid">
                <div class="knowledge-card" onclick="showKnowledgeDetail('basics')">
                    <h3>📖 八字基础知识</h3>
                    <p>了解天干地支、五行生克、十神关系等核心概念...</p>
                </div>
                <div class="knowledge-card" onclick="showKnowledgeDetail('fourpillars')">
                    <h3>🏛️ 四柱含义</h3>
                    <p>年柱、月柱、日柱、时柱分别代表的含义...</p>
                </div>
                <div class="knowledge-card" onclick="showKnowledgeDetail('tiangan')">
                    <h3>☀️ 十天干</h3>
                    <p>甲、乙、丙、丁、戊、己、庚、辛、壬、癸的详细解释...</p>
                </div>
                <div class="knowledge-card" onclick="showKnowledgeDetail('dizhi')">
                    <h3>🌙 十二地支</h3>
                    <p>子、丑、寅、卯、辰、巳、午、未、申、酉、戌、亥的含义...</p>
                </div>
                <div class="knowledge-card" onclick="showKnowledgeDetail('wuxing')">
                    <h3>⚖️ 五行生克</h3>
                    <p>金木水火土相生相克关系的详细解读...</p>
                </div>
                <div class="knowledge-card" onclick="showKnowledgeDetail('shishen')">
                    <h3>🎭 十神关系</h3>
                    <p>正官、七杀、正印、偏印、食神、伤官、比肩、劫财、正财、偏财...</p>
                </div>
                <div class="knowledge-card" onclick="showKnowledgeDetail('dayun')">
                    <h3>📅 大运流年</h3>
                    <p>十年大运和流年运势的分析方法...</p>
                </div>
                <div class="knowledge-card" onclick="showKnowledgeDetail('analyze')">
                    <h3>🔍 命局分析</h3>
                    <p>如何分析日主强弱、五行平衡、喜用神等...</p>
                </div>
            </div>
        </div>

        <!-- 结果显示 -->
        <div class="tab-content" id="resultTab">
            <div class="result-container" id="resultContainer">
                <div style="background:linear-gradient(135deg,rgba(255,215,0,0.05),rgba(255,215,0,0.02));border:1px solid rgba(255,215,0,0.1);border-radius:12px;padding:1.5rem;text-align:center;">
                    <p style="color: rgba(255,255,255,0.5);">
                        🙏 请先填写信息进行排盘
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/main.js"></script>
<script>
// ===== 全局变量 =====
window.baziMode = 'basic'; // 'basic' 或 'pro'
window.currentBaziResult = null;

// ===== 标签页切换 =====
function switchTab(tabName, btnElement) {
    var tabBtns = document.querySelectorAll('.tab-btn');
    tabBtns.forEach(function(btn) { btn.classList.remove('active'); });

    if (btnElement) {
        btnElement.classList.add('active');
    } else {
        var targetBtn = document.querySelector('.tab-btn[data-tab="' + tabName + '"]');
        if (targetBtn) targetBtn.classList.add('active');
    }

    var tabContents = document.querySelectorAll('.tab-content');
    tabContents.forEach(function(content) { content.classList.remove('active'); });

    var targetTab = document.getElementById(tabName + 'Tab');
    if (targetTab) targetTab.classList.add('active');
}

// ===== 模式切换 =====
function switchBaziMode(mode) {
    window.baziMode = mode;
    var basicBtn = document.getElementById('basicModeBtn');
    var proBtn = document.getElementById('proModeBtn');
    if (mode === 'basic') {
        basicBtn.classList.add('active');
        proBtn.classList.remove('active');
    } else {
        proBtn.classList.add('active');
        basicBtn.classList.remove('active');
    }

    // 如果已有结果，重新渲染
    if (window.currentBaziResult) {
        var container = document.getElementById('resultContainer');
        if (container) {
            container.innerHTML = mode === 'pro'
                ? generateProBaziResultHTML(window.currentBaziResult)
                : generateBaziResultHTML(window.currentBaziResult);
        }
    }
}

// ===== 计算八字主函数 =====
function calculateBazi() {
    var name = document.getElementById('nameInput').value.trim();
    var gender = document.getElementById('genderInput').value;
    var date = document.getElementById('dateInput').value;
    var time = document.getElementById('timeInput').value;

    if (!name || !date || !time) {
        if (window.showToast) window.showToast('请填写完整信息');
        else alert('请填写完整信息');
        return;
    }

    if (window.showToast) window.showToast('正在排盘，请稍候...');

    setTimeout(function() {
        var result = calcBaziFull(name, gender, date, time);
        window.currentBaziResult = result;

        var resultHTML = window.baziMode === 'pro'
            ? generateProBaziResultHTML(result)
            : generateBaziResultHTML(result);

        document.getElementById('resultContainer').innerHTML = resultHTML;
        switchTab('result');

        var toast = document.querySelector('.toast');
        if (toast) toast.remove();
    }, 800);
}

// ===== 完整八字计算（较精确算法） =====
function calcBaziFull(name, gender, birthDate, birthTime) {
    // 天干地支
    var tiangan = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
    var dizhi    = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];

    // 五行映射
    var wuxingMap = {
        '甲':'木','乙':'木','丙':'火','丁':'火','戊':'土',
        '己':'土','庚':'金','辛':'金','壬':'水','癸':'水',
        '子':'水','丑':'土','寅':'木','卯':'木','辰':'土',
        '巳':'火','午':'火','未':'土','申':'金','酉':'金',
        '戌':'土','亥':'水'
    };

    // 地支藏干（主气/中气/余气）
    var dizhiCanggan = {
        '子': ['癸'],
        '丑': ['己','癸','辛'],
        '寅': ['甲','丙','戊'],
        '卯': ['乙'],
        '辰': ['戊','乙','癸'],
        '巳': ['丙','庚','戊'],
        '午': ['丁','己'],
        '未': ['己','丁','乙'],
        '申': ['庚','壬','戊'],
        '酉': ['辛'],
        '戌': ['戊','辛','丁'],
        '亥': ['壬','甲']
    };

    // 纳音五行
    var nayinMap = {
        '甲子':'海中金','乙丑':'海中金','丙寅':'炉中火','丁卯':'炉中火',
        '戊辰':'大林木','己巳':'大林木','庚午':'路旁土','辛未':'路旁土',
        '壬申':'剑锋金','癸酉':'剑锋金','甲戌':'山头火','乙亥':'山头火',
        '丙子':'涧下水','丁丑':'涧下水','戊寅':'城头土','己卯':'城头土',
        '庚辰':'白蜡金','辛巳':'白蜡金','壬午':'杨柳木','癸未':'杨柳木',
        '甲申':'泉中水','乙酉':'泉中水','丙戌':'屋上土','丁亥':'屋上土',
        '戊子':'霹雳火','己丑':'霹雳火','庚寅':'松柏木','辛卯':'松柏木',
        '壬辰':'长流水','癸巳':'长流水','甲午':'沙中金','乙未':'沙中金',
        '丙申':'山下火','丁酉':'山下火','戊戌':'平地木','己亥':'平地木',
        '庚子':'壁上土','辛丑':'壁上土','壬寅':'金箔金','癸卯':'金箔金',
        '甲辰':'覆灯火','乙巳':'覆灯火','丙午':'天河水','丁未':'天河水',
        '戊申':'大驿土','己酉':'大驿土','庚戌':'钗钏金','辛亥':'钗钏金',
        '壬子':'桑柘木','癸丑':'桑柘木','甲寅':'大溪水','乙卯':'大溪水',
        '丙辰':'沙中土','丁巳':'沙中土','戊午':'天上火','己未':'天上火',
        '庚申':'石榴木','辛酉':'石榴木','壬戌':'大海水','癸亥':'大海水'
    };

    // 十神关系表（日干对其它干）
    // 同性：比肩（同我）、食神（我生）、偏财（我克）、七杀（克我）、偏印（生我）
    // 异性：劫财（同我）、伤官（我生）、正财（我克）、正官（克我）、正印（生我）
    var shishenMap = {
        '甲': {'甲':'比肩','乙':'劫财','丙':'食神','丁':'伤官','戊':'偏财','己':'正财','庚':'七杀','辛':'正官','壬':'偏印','癸':'正印'},
        '乙': {'甲':'劫财','乙':'比肩','丙':'伤官','丁':'食神','戊':'正财','己':'偏财','庚':'正官','辛':'七杀','壬':'正印','癸':'偏印'},
        '丙': {'甲':'偏印','乙':'正印','丙':'比肩','丁':'劫财','戊':'食神','己':'伤官','庚':'偏财','辛':'正财','壬':'七杀','癸':'正官'},
        '丁': {'甲':'正印','乙':'偏印','丙':'劫财','丁':'比肩','戊':'伤官','己':'食神','庚':'正财','辛':'偏财','壬':'正官','癸':'七杀'},
        '戊': {'甲':'七杀','乙':'正官','丙':'偏印','丁':'正印','戊':'比肩','己':'劫财','庚':'食神','辛':'伤官','壬':'偏财','癸':'正财'},
        '己': {'甲':'正官','乙':'七杀','丙':'正印','丁':'偏印','戊':'劫财','己':'比肩','庚':'伤官','辛':'食神','壬':'正财','癸':'偏财'},
        '庚': {'甲':'偏财','乙':'正财','丙':'七杀','丁':'正官','戊':'偏印','己':'正印','庚':'比肩','辛':'劫财','壬':'食神','癸':'伤官'},
        '辛': {'甲':'正财','乙':'偏财','丙':'正官','丁':'七杀','戊':'正印','己':'偏印','庚':'劫财','辛':'比肩','壬':'伤官','癸':'食神'},
        '壬': {'甲':'食神','乙':'伤官','丙':'偏财','丁':'正财','戊':'七杀','己':'正官','庚':'偏印','辛':'正印','壬':'比肩','癸':'劫财'},
        '癸': {'甲':'伤官','乙':'食神','丙':'正财','丁':'偏财','戊':'正官','己':'七杀','庚':'正印','辛':'偏印','壬':'劫财','癸':'比肩'}
    };

    var date = new Date(birthDate);
    var year = date.getFullYear();
    var month = date.getMonth() + 1;
    var day = date.getDate();

    // 时辰提取
    var shichenMap = {'子':0,'丑':1,'寅':2,'卯':3,'辰':4,'巳':5,'午':6,'未':7,'申':8,'酉':9,'戌':10,'亥':11};
    var timeChar = birthTime.charAt(0);
    var timeIndex = shichenMap[timeChar] !== undefined ? shichenMap[timeChar] : 0;

    // ===== 年柱 =====
    var yearGanIdx = (year - 4) % 10;
    if (yearGanIdx < 0) yearGanIdx += 10;
    var yearZhiIdx = (year - 4) % 12;
    if (yearZhiIdx < 0) yearZhiIdx += 12;
    var yearGan = tiangan[yearGanIdx];
    var yearZhi = dizhi[yearZhiIdx];

    // ===== 月柱（简化，未考虑节气）=====
    // 月支：正月寅、二月卯... 以寅为正月
    var monthZhiIdx = (month + 1) % 12;
    var monthGanIdx = (yearGanIdx * 2 + month) % 10;
    if (monthGanIdx < 0) monthGanIdx += 10;
    var monthGan = tiangan[monthGanIdx];
    var monthZhi = dizhi[monthZhiIdx];

    // ===== 日柱（简化公式）=====
    // 使用简化的日柱计算公式（适用于1900-2100年）
    var baseDate = new Date(1900, 0, 1); // 1900年1月1日 日柱为 甲子=0
    var diffDays = Math.floor((date - baseDate) / (24 * 60 * 60 * 1000));
    var dayOffset = (diffDays + 10) % 60; // 甲子=0
    if (dayOffset < 0) dayOffset += 60;
    var dayGanIdx = dayOffset % 10;
    var dayZhiIdx = dayOffset % 12;
    var dayGan = tiangan[dayGanIdx];
    var dayZhi = dizhi[dayZhiIdx];

    // ===== 时柱 =====
    var hourGanIdx = (dayGanIdx * 2 + timeIndex) % 10;
    if (hourGanIdx < 0) hourGanIdx += 10;
    var hourGan = tiangan[hourGanIdx];
    var hourZhi = dizhi[timeIndex];

    // 四柱
    var pillars = {
        year:  yearGan + yearZhi,
        month: monthGan + monthZhi,
        day:   dayGan + dayZhi,
        hour:  hourGan + hourZhi
    };

    // 纳音
    var nayin = {
        year: nayinMap[pillars.year] || '未知',
        month: nayinMap[pillars.month] || '未知',
        day: nayinMap[pillars.day] || '未知',
        hour: nayinMap[pillars.hour] || '未知'
    };

    // 藏干
    var canggan = {
        year:  dizhiCanggan[yearZhi] || [],
        month: dizhiCanggan[monthZhi] || [],
        day:   dizhiCanggan[dayZhi] || [],
        hour:  dizhiCanggan[hourZhi] || []
    };

    // 五行统计（含藏干）
    var wuxingCount = {'金':0,'木':0,'水':0,'火':0,'土':0};
    var allGanZhi = pillars.year + pillars.month + pillars.day + pillars.hour;
    for (var i = 0; i < allGanZhi.length; i++) {
        var ch = allGanZhi[i];
        if (wuxingMap[ch]) {
            wuxingCount[wuxingMap[ch]]++;
        }
    }
    // 藏干计入（权重0.5）
    var pillarKeys = ['year','month','day','hour'];
    for (var p = 0; p < pillarKeys.length; p++) {
        var cgList = canggan[pillarKeys[p]];
        for (var c = 0; c < cgList.length; c++) {
            var wx = wuxingMap[cgList[c]];
            if (wx) {
                wuxingCount[wx] += 0.5;
            }
        }
    }

    // 十神
    var dayMaster = dayGan;
    var dayMasterElement = wuxingMap[dayMaster];
    var shishen = {};
    var pillarGanList = [yearGan, monthGan, dayGan, hourGan];
    var pillarNames = ['年干','月干','日干','时干'];
    for (var s = 0; s < pillarGanList.length; s++) {
        shishen[pillarNames[s]] = shishenMap[dayMaster][pillarGanList[s]];
    }
    // 地支藏干十神
    var shishenCang = {};
    for (var p2 = 0; p2 < pillarKeys.length; p2++) {
        var key = pillarKeys[p2];
        var cg = canggan[key];
        var label = ['年支藏干','月支藏干','日支藏干','时支藏干'][p2];
        shishenCang[label] = [];
        for (var c2 = 0; c2 < cg.length; c2++) {
            shishenCang[label].push({
                gan: cg[c2],
                shishen: shishenMap[dayMaster][cg[c2]]
            });
        }
    }

    // 日主强弱判断
    var dayMasterCount = wuxingCount[dayMasterElement];
    var helperCount = 0; // 比肩+劫财+正印+偏印
    var resistorCount = 0; // 克我+我克
    var dayMasterIdx = tiangan.indexOf(dayMaster);
    for (var t = 0; t < tiangan.length; t++) {
        var tg = tiangan[t];
        var ss = shishenMap[dayMaster][tg];
        if (ss === '比肩' || ss === '劫财' || ss === '正印' || ss === '偏印') helperCount++;
        if (ss === '正官' || ss === '七杀' || ss === '正财' || ss === '偏财') resistorCount++;
    }
    var isStrong = dayMasterCount >= 2 && helperCount >= 3;
    var dayMasterStrength = isStrong ? '偏强' : '偏弱';

    // 喜用神判断（简化规则）
    var xiyongshen = [];
    var jishen = [];
    if (dayMasterElement === '木') {
        if (isStrong) {
            xiyongshen = ['金','火','土'];
            jishen = ['木','水'];
        } else {
            xiyongshen = ['水','木'];
            jishen = ['金','土'];
        }
    } else if (dayMasterElement === '火') {
        if (isStrong) {
            xiyongshen = ['水','金','土'];
            jishen = ['火','木'];
        } else {
            xiyongshen = ['木','火'];
            jishen = ['水','金'];
        }
    } else if (dayMasterElement === '土') {
        if (isStrong) {
            xiyongshen = ['木','水','金'];
            jishen = ['土','火'];
        } else {
            xiyongshen = ['火','土'];
            jishen = ['木','水'];
        }
    } else if (dayMasterElement === '金') {
        if (isStrong) {
            xiyongshen = ['火','水','木'];
            jishen = ['金','土'];
        } else {
            xiyongshen = ['土','金'];
            jishen = ['火','木'];
        }
    } else if (dayMasterElement === '水') {
        if (isStrong) {
            xiyongshen = ['土','木','火'];
            jishen = ['水','金'];
        } else {
            xiyongshen = ['金','水'];
            jishen = ['土','火'];
        }
    }

    // 起大运（简化：阳男阴女顺行，阴男阳女逆行，约8岁左右起运）
    var genderIsMale = (gender === '男');
    var yearGanIsYang = (yearGanIdx % 2 === 0); // 甲丙戊庚壬为阳
    var dayunDirection = (genderIsMale === yearGanIsYang) ? '顺行' : '逆行';
    var qiyunAge = 8; // 简化：统一按8岁起运

    // 大运干支（简化：从月柱开始顺/逆推）
    var dayunList = [];
    var baseGanIdx = tiangan.indexOf(monthGan);
    var baseZhiIdx = dizhi.indexOf(monthZhi);
    var direction = dayunDirection === '顺行' ? 1 : -1;
    for (var d = 1; d <= 8; d++) {
        var dgIdx = (baseGanIdx + direction * d + 10) % 10;
        var dzIdx = (baseZhiIdx + direction * d + 12) % 12;
        var dunGan = tiangan[dgIdx];
        var dunZhi = dizhi[dzIdx];
        var dunAge = qiyunAge + (d - 1) * 10;
        var dunEndAge = dunAge + 9;
        dayunList.push({
            index: d,
            ganzhi: dunGan + dunZhi,
            startAge: dunAge,
            endAge: dunEndAge,
            nayin: nayinMap[dunGan + dunZhi] || '未知',
            shishen: shishenMap[dayMaster][dunGan]
        });
    }

    // 2026年流年
    var liunian2026 = '丙午';
    var liunianShishen = shishenMap[dayMaster]['丙'] + '/' + shishenMap[dayMaster]['午'];

    // 命宫（简化：以寅为1，顺数至月支，再从卯逆数至时支）
    var mingongZhiIdx = (2 + monthZhiIdx - timeIndex + 12) % 12;
    var mingongZhi = dizhi[mingongZhiIdx];
    var mingongGanIdx = (yearGanIdx + mingongZhiIdx) % 10;
    var mingong = tiangan[mingongGanIdx] + mingongZhi;

    // 神煞（简化规则）
    var shenSha = [];
    // 天乙贵人
    var tianyiMap = {'甲':'丑未','乙':'子申','丙':'亥酉','丁':'酉亥','戊':'丑未','己':'子申','庚':'丑未','辛':'午寅','壬':'卯巳','癸':'巳卯'};
    if (tianyiMap[dayMaster]) {
        shenSha.push({name:'天乙贵人', desc:'聪慧机敏，得贵人相助', type:'吉'});
    }
    // 文昌贵人
    var wenzhangMap = {'甲':'巳','乙':'午','丙':'申','丁':'酉','戊':'申','己':'酉','庚':'亥','辛':'子','壬':'寅','癸':'卯'};
    shenSha.push({name:'文昌贵人', desc:'聪明好学，文采出众，利于学业考试', type:'吉'});
    // 桃花
    var taohuaMap = {'寅':'卯','午':'卯','戌':'卯','亥':'子','巳':'午','卯':'子'};
    shenSha.push({name:'桃花', desc:'人缘好，异性缘旺，气质优雅', type:'吉'});
    // 驿马
    var yimaMap = {'寅':'申','午':'申','戌':'申','亥':'巳','卯':'巳','未':'巳'};
    if (yimaMap[monthZhi] || yimaMap[dayZhi]) {
        shenSha.push({name:'驿马', desc:'多动之命，适合外出发展，奔波劳碌', type:'中'});
    }

    // 修正：将 shishenMap 也存入返回结果，供专业版使用
    return {
        name: name,
        gender: gender,
        birthDate: birthDate,
        birthTime: birthTime,
        pillars: pillars,
        nayin: nayin,
        canggan: canggan,
        wuxingCount: wuxingCount,
        dayMaster: dayMaster,
        dayMasterElement: dayMasterElement,
        dayMasterStrength: dayMasterStrength,
        isStrong: isStrong,
        shishen: shishen,
        shishenCang: shishenCang,
        shishenMap: shishenMap,
        xiyongshen: xiyongshen,
        jishen: jishen,
        dayunDirection: dayunDirection,
        qiyunAge: qiyunAge,
        dayunList: dayunList,
        liunian2026: liunian2026,
        liunianShishen: liunianShishen,
        mingong: mingong,
        shenSha: shenSha
    };
}

// ===== 生成初学者版结果 =====
function generateBaziResultHTML(data) {
    var p = data.pillars;
    var w = data.wuxingCount;
    var wuxingOrder = ['木','火','土','金','水'];

    var html = '';

    // 四柱
    html += '<div class="result-section"><h3>☯ 四柱八字</h3>';
    html += '<table class="result-table">';
    html += '<tr><th>年柱</th><th>月柱</th><th>日柱（日主）</th><th>时柱</th></tr>';
    html += '<tr><td style="font-size:1.2rem;color:#ffd700;font-weight:bold;">' + p.year + '</td>';
    html += '<td style="font-size:1.2rem;color:#ffd700;font-weight:bold;">' + p.month + '</td>';
    html += '<td style="font-size:1.2rem;color:#fff;font-weight:bold;">' + p.day + '</td>';
    html += '<td style="font-size:1.2rem;color:#ffd700;font-weight:bold;">' + p.hour + '</td></tr>';
    html += '<tr><td>纳音：' + data.nayin.year + '</td><td>纳音：' + data.nayin.month + '</td><td>纳音：' + data.nayin.day + '</td><td>纳音：' + data.nayin.hour + '</td></tr>';
    html += '</table></div>';

    // 五行统计
    html += '<div class="result-section"><h3>⚖️ 五行统计</h3>';
    for (var i = 0; i < wuxingOrder.length; i++) {
        var el = wuxingOrder[i];
        var count = w[el];
        var pct = Math.min(count / 5 * 100, 100);
        var status = count === 0 ? '缺' : (count <= 1 ? '弱' : (count <= 2 ? '中' : '旺'));
        var barColor = el === '金' ? '#ffd700' : (el === '木' ? '#4caf50' : (el === '水' ? '#2196f3' : (el === '火' ? '#f44336' : '#9e9e9e')));
        html += '<div class="wuxing-bar-container">';
        html += '<div class="wuxing-bar-label"><span>' + el + '</span><span>' + count + ' (' + status + ')</span></div>';
        html += '<div class="wuxing-bar"><div class="wuxing-bar-fill" style="width:' + pct + '%;background:' + barColor + ';"></div></div>';
        html += '</div>';
    }
    html += '</div>';

    // 日主分析
    html += '<div class="result-section"><h3>📊 日主分析</h3>';
    html += '<p><strong>日主：</strong>' + data.dayMaster + '（五行属' + data.dayMasterElement + '）</p>';
    html += '<p><strong>日主强弱：</strong>' + data.dayMasterStrength + '</p>';
    html += '<p><strong>喜用神：</strong>' + data.xiyongshen.join('、') + '</p>';
    html += '<p><strong>忌神：</strong>' + data.jishen.join('、') + '</p>';
    html += '</div>';

    // 简易分析
    html += '<div class="result-section"><h3>🔍 命局简析</h3>';
    html += '<div class="analysis-text">';
    html += '【' + data.name + '】之命，日主为<strong>' + data.dayMaster + '（' + data.dayMasterElement + '）</strong>，日主' + data.dayMasterStrength + '。';
    html += '五行' + (w['金'] === 0 ? '缺金，' : (w['金'] > 2 ? '金旺，' : ''));
    html += (w['木'] === 0 ? '缺木，' : (w['木'] > 2 ? '木旺，' : ''));
    html += (w['水'] === 0 ? '缺水，' : (w['水'] > 2 ? '水旺，' : ''));
    html += (w['火'] === 0 ? '缺火，' : (w['火'] > 2 ? '火旺，' : ''));
    html += (w['土'] === 0 ? '缺土' : (w['土'] > 2 ? '土旺' : ''));
    html += '。喜用神为<strong>' + data.xiyongshen.join('、') + '</strong>，行事宜趋吉避凶。';
    if (data.shenSha.length > 0) {
        html += '<br/><br/><strong>神煞：</strong>';
        for (var s = 0; s < data.shenSha.length; s++) {
            html += data.shenSha[s].name + '（' + data.shenSha[s].desc + '）';
            if (s < data.shenSha.length - 1) html += '；';
        }
    }
    html += '</div></div>';

    return html;
}
