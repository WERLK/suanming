<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffd700">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="玄机算命">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="msapplication-TileImage" content="/icon-192.png">
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>风水布局 - 玄机算命网</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .page-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: linear-gradient(180deg, rgba(15,12,41,0.98), rgba(26,26,46,0.95));
            border-bottom: 1px solid rgba(255,215,0,0.15);
        }
        .page-header h1 {
            font-size: 1.2rem;
            color: #ffd700;
            font-weight: 600;
        }
        .back-btn {
            background: none;
            border: none;
            color: #ffd700;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.5rem;
        }
        .content-area {
            padding: 1rem;
            padding-bottom: 80px;
        }
        .fengshui-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .fengshui-card {
            background: linear-gradient(135deg, rgba(255,215,0,0.05), rgba(255,215,0,0.02));
            border: 1px solid rgba(255,215,0,0.1);
            border-radius: 12px;
            padding: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .fengshui-card:hover {
            background: linear-gradient(135deg, rgba(255,215,0,0.1), rgba(255,215,0,0.03));
            transform: translateY(-2px);
        }
        .fengshui-card h3 {
            color: #ffd700;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        .fengshui-card p {
            font-size: 0.8rem;
            line-height: 1.6;
            color: rgba(255,255,255,0.7);
        }
        .fengshui-detail {
            background: linear-gradient(135deg, rgba(255,215,0,0.05), rgba(255,215,0,0.02));
            border: 1px solid rgba(255,215,0,0.1);
            border-radius: 12px;
            padding: 1.2rem;
            margin-top: 1rem;
        }
        .fengshui-detail h2 {
            color: #ffd700;
            font-size: 1rem;
            margin-bottom: 0.8rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255,215,0,0.1);
        }
        .fengshui-detail ul {
            margin-left: 1.5rem;
            margin-bottom: 1rem;
        }
        .fengshui-detail li {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.8);
            margin-bottom: 0.5rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="app">
        <div class="page-header">
            <button type="button" class="back-btn" onclick="history.back()">←</button>
            <h1>🏠 风水布局</h1>
        </div>

        <div class="content-area">
                    <div style="margin-bottom:1rem;">
            <button type="button" class="submit-btn" style="width:auto;padding:0.8rem 1.5rem;font-size:0.9rem;" onclick="triggerImageUpload('fengshui')">📷 上传图片分析</button>
        </div>
<div class="section">
                <h2>风水布局指南</h2>
                <p style="color: rgba(255,255,255,0.6); font-size: 0.85rem; line-height: 1.8; margin-bottom: 1rem;">
                    风水是一门古老的学问，通过合理布局环境来改善运势、健康、财运等。
                </p>
            </div>

            <div class="fengshui-grid">
                <div class="fengshui-card" onclick="showFengshuiDetail('home')">
                    <h3>🏠 家居风水</h3>
                    <p>客厅、卧室、厨房、卫生间的风水布局要点...</p>
                </div>
                <div class="fengshui-card" onclick="showFengshuiDetail('office')">
                    <h3>🏢 办公室风水</h3>
                    <p>座位朝向、办公桌布局、催财方法...</p>
                </div>
                <div class="fengshui-card" onclick="showFengshuiDetail('taboo')">
                    <h3>⚠️ 风水禁忌</h3>
                    <p>横梁压顶、门冲、缺角等风水禁忌及化解...</p>
                </div>
            </div>

            <div class="fengshui-detail" id="fengshuiDetail">
                <!-- 风水详情将动态生成 -->
            </div>
        </div>
    </div>

    <script src="/js/main.js">
// 触发图片上传
function triggerImageUpload(moduleType) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = function() {
        const file = this.files[0];
        if (!file) return;
        window.showToast('正在分析图片...');
        const reader = new FileReader();
        reader.onload = function(e) {
            const base64 = e.target.result;
            fetch('/api/image-analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: base64, module_type: moduleType })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    window.showToast('分析完成！');
                    const area = document.getElementById('imageAnalysisArea');
                    const result = document.getElementById('imageAnalysisResult');
                    if (area) area.style.display = 'block';
                    if (result) result.textContent = data.analysis;
                } else {
                    window.showToast('分析失败：' + (data.message || '未知错误'));
                }
            })
            .catch(err => {
                window.showToast('分析失败，请检查网络');
                console.error('图片分析错误：', err);
            });
        };
        reader.readAsDataURL(file);
    };
    input.click();
}
</script>
    <script>
        function showFengshuiDetail(type) {
            let html = '';
            
            switch(type) {
                case 'home':
                    html = `
                        <h2>🏠 家居风水布局要点</h2>
                        
                        <h3>🛋️ 客厅风水</h3>
                        <ul>
                            <li><strong>位置</strong>：客厅应设在住宅中央位置，采光要充足</li>
                            <li><strong>布局</strong>：沙发应靠墙摆放，形成"背后有靠"的格局</li>
                            <li><strong>装饰</strong>：可摆放绿植（如发财树、富贵竹）催旺财运</li>
                            <li><strong>禁忌</strong>：避免横梁压顶、尖角冲射</li>
                        </ul>
                        
                        <h3>🛏️ 卧室风水</h3>
                        <ul>
                            <li><strong>床的朝向</strong>：头朝吉方（通常朝东、南、西），避免朝西</li>
                            <li><strong>镜子</strong>：镜子不宜对着床，会导致睡眠不安</li>
                            <li><strong>电器</strong>：电视、电脑等电器不宜放在卧室，辐射影响健康</li>
                            <li><strong>颜色</strong>：卧室颜色宜柔和（浅蓝、浅绿、米色），避免过于鲜艳</li>
                        </ul>
                        
                        <h3>🍳 厨房风水</h3>
                        <ul>
                            <li><strong>灶台位置</strong>：灶台不宜正对门或窗，也不宜与水槽太近</li>
                            <li><strong>冰箱</strong>：冰箱代表财库，应保持整洁、食物充足</li>
                            <li><strong>颜色</strong>：厨房属火，宜用白色、米色等淡雅颜色</li>
                        </ul>
                        
                        <h3>🚿 卫生间风水</h3>
                        <ul>
                            <li><strong>位置</strong>：卫生间不宜在住宅中央或正对大门</li>
                            <li><strong>通风</strong>：保持干燥通风，避免湿气积聚</li>
                            <li><strong>化解</strong>：可摆放绿植或盐灯化解卫生间阴气</li>
                        </ul>
                    `;
                    break;
                    
                case 'office':
                    html = `
                        <h2>🏢 办公室风水布局要点</h2>
                        
                        <h3>💺 座位朝向</h3>
                        <ul>
                            <li><strong>背后有靠</strong>：座位后方应有实墙或高柜，象征"背后有靠"</li>
                            <li><strong>前方开阔</strong>：座位前方应开阔，象征前途无量</li>
                            <li><strong>避免门冲</strong>：座位不宜正对门，会被气流直冲</li>
                            <li><strong>避免窗边</strong>：座位不宜正对窗户，会被光线和气流干扰</li>
                        </ul>
                        
                        <h3>🖥️ 办公桌布局</h3>
                        <ul>
                            <li><strong>左高右低</strong>：左侧可放较高的文件架，右侧宜低矮整洁</li>
                            <li><strong>保持整洁</strong>：桌面保持整洁，杂乱会阻碍财运和思路</li>
                            <li><strong>摆放开运物</strong>：可摆放水晶、文昌塔、马到成功等开运物</li>
                        </ul>
                        
                        <h3>💰 催财布局</h3>
                        <ul>
                            <li><strong>开门见红</strong>：办公室门旁可放红色地毯或装饰，催旺人气</li>
                            <li><strong>财位布局</strong>：办公室对角线位置为财位，可放发财树、鱼缸等</li>
                            <li><strong>水种植物</strong>：在财位放水生植物（如富贵竹），水生木，木生财</li>
                        </ul>
                    `;
                    break;
                    
                case 'taboo':
                    html = `
                        <h2>⚠️ 常见风水禁忌及化解</h2>
                        
                        <h3>📏 横梁压顶</h3>
                        <ul>
                            <li><strong>含义</strong>：横梁压在床、沙发、办公桌上方，会造成压迫感</li>
                            <li><strong>影响</strong>：影响健康、睡眠、事业运</li>
                            <li><strong>化解</strong>：安装天花板遮挡横梁，或在横梁两侧安装圆形灯具化解</li>
                        </ul>
                        
                        <h3>🚪 门冲</h3>
                        <ul>
                            <li><strong>含义</strong>：门正对门、窗、或走廊</li>
                            <li><strong>影响</strong>：气流直冲，导致气场不稳，财运流失</li>
                            <li><strong>化解</strong>：设置屏风、门帘，或在门旁放绿植缓冲气流</li>
                        </ul>
                        
                        <h3>📐 房屋缺角</h3>
                        <ul>
                            <li><strong>含义</strong>：房屋平面图形不规则，有缺角</li>
                            <li><strong>影响</strong>：缺角代表对应方位的家庭成员或运势受损</li>
                            <li><strong>化解</strong>：在缺角位置摆放对应五行的物品（如缺东角放绿色植物）</li>
                        </ul>
                        
                        <h3>🪞 镜子反射</h3>
                        <ul>
                            <li><strong>含义</strong>：镜子正对床、门、灶台等</li>
                            <li><strong>影响</strong>：镜子反射会扰乱气场，导致睡眠不安、财运不稳</li>
                            <li><strong>化解</strong>：移动镜子位置，或用布帘遮挡</li>
                        </ul>
                    `;
                    break;
            }
            
            document.getElementById('fengshuiDetail').innerHTML = html;
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            createStars();
        });
    </script>
</body>
</html>
