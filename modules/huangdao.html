<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffd700">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="玄机算命">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="msapplication-TileImage" content="/icon-192.png">
    <meta name="msapplication-TileColor" content="#ffd700">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>黄历吉日 - 玄机算命网</title>
    <style>
        /* ===== Reset & Base ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #0f0c29;
            color: rgba(255,255,255,0.85);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* ===== Stars Background (from main.js) ===== */
        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--dur) ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            from { opacity: 0.2; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1.2); }
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); color: #ffd700;
            padding: 0.6rem 1.5rem; border-radius: 8px; font-size: 0.85rem;
            z-index: 9999; opacity: 0; transition: opacity 0.3s;
            pointer-events: none; white-space: nowrap;
        }
        .toast.show { opacity: 1; }

        /* ===== Loading Overlay ===== */
        .fortune-loading-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15,12,41,0.85); z-index: 9998;
            display: flex; align-items: center; justify-content: center;
        }
        .fortune-loading-content { text-align: center; }
        .fortune-spinner {
            width: 44px; height: 44px; margin: 0 auto 1rem;
            border: 3px solid rgba(255,215,0,0.15);
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .fortune-loading-text { font-size: 0.9rem; color: rgba(255,255,255,0.7); }
        .fortune-loading-sub { font-size: 0.8rem; color: rgba(255,215,0,0.6); margin-top: 0.4rem; }
        .fortune-loading-hide { opacity: 0; transition: opacity 0.3s; }

        /* ===== page-header ===== */
        .page-header {
            display: flex; align-items: center; gap: 1rem;
            padding: 1rem 1.2rem;
            background: rgba(15,12,41,0.96);
            border-bottom: 1px solid rgba(255,215,0,0.12);
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(10px);
        }
        .page-header .back-btn {
            background: none; border: none; color: #ffd700;
            font-size: 1.3rem; cursor: pointer;
            padding: 0.3rem 0.6rem; border-radius: 6px;
            transition: background 0.2s;
        }
        .page-header .back-btn:hover { background: rgba(255,215,0,0.1); }
        .page-header h1 {
            font-size: 1.15rem; color: #ffd700;
            font-weight: 600; letter-spacing: 0.5px;
        }

        /* ===== content-area ===== */
        .content-area {
            position: relative; z-index: 1;
            padding: 1rem;
            padding-bottom: 80px;
        }

        /* ===== Date Controls ===== */
        .date-controls {
            display: flex; align-items: center; gap: 0.7rem;
            margin-bottom: 1.2rem; flex-wrap: wrap;
        }
        .date-controls input[type="date"] {
            flex: 1; min-width: 150px;
            padding: 0.65rem 0.9rem; border-radius: 8px;
            border: 1px solid rgba(255,215,0,0.25);
            background: rgba(15,12,41,0.7);
            color: #ffd700; font-size: 0.9rem; outline: none;
            transition: border-color 0.3s;
        }
        .date-controls input[type="date"]:focus {
            border-color: #ffd700;
        }
        .date-controls input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.8) sepia(1) saturate(5) hue-rotate(10deg);
            cursor: pointer;
        }
        .btn-today {
            padding: 0.65rem 1.2rem; border-radius: 8px;
            border: 1px solid rgba(255,215,0,0.35);
            background: rgba(255,215,0,0.08);
            color: #ffd700; font-size: 0.85rem;
            cursor: pointer; white-space: nowrap;
            transition: background 0.3s;
        }
        .btn-today:hover { background: rgba(255,215,0,0.18); }

        /* ===== Card ===== */
        .huangli-card {
            background: linear-gradient(135deg, rgba(255,215,0,0.06), rgba(255,215,0,0.02));
            border: 1px solid rgba(255,215,0,0.1);
            border-radius: 12px; padding: 1.4rem; margin-bottom: 1rem;
        }

        /* ===== Card Header ===== */
        .card-header { text-align: center; padding-bottom: 1rem; margin-bottom: 1rem; border-bottom: 1px solid rgba(255,215,0,0.08); }
        .date-big { font-size: 1.8rem; color: #ffd700; font-weight: 700; }
        .weekday { font-size: 0.85rem; color: rgba(255,255,255,0.5); margin-left: 0.4rem; }
        .lunar { font-size: 1rem; color: rgba(255,255,255,0.85); margin-top: 0.35rem; }
        .ganzhi { font-size: 0.85rem; color: rgba(255,215,0,0.75); margin-top: 0.2rem; }

        /* ===== Yi / Ji ===== */
        .yiji-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin-bottom: 0.8rem; }
        .yi-box, .ji-box { padding: 0.7rem; border-radius: 8px; background: rgba(0,0,0,0.2); }
        .yi-box h4, .ji-box h4 { font-size: 0.85rem; margin-bottom: 0.5rem; font-weight: 600; }
        .yi-box h4 { color: #4ade80; }
        .ji-box h4 { color: #f87171; }
        .tag-list { display: flex; flex-wrap: wrap; gap: 0.35rem; }
        .tag-yi {
            display: inline-block; padding: 0.2rem 0.55rem;
            border-radius: 4px; font-size: 0.78rem;
            background: rgba(74,222,128,0.12); color: #4ade80;
            border: 1px solid rgba(74,222,128,0.2);
        }
        .tag-ji {
            display: inline-block; padding: 0.2rem 0.55rem;
            border-radius: 4px; font-size: 0.78rem;
            background: rgba(248,113,113,0.12); color: #f87171;
            border: 1px solid rgba(248,113,113,0.2);
        }

        /* ===== Chongsha ===== */
        .chongsha-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem;
            padding: 0.7rem; border-radius: 8px;
            background: rgba(0,0,0,0.2); margin-bottom: 0.8rem;
        }
        .chongsha-item { text-align: center; }
        .chongsha-item .label { font-size: 0.72rem; color: rgba(255,255,255,0.45); margin-bottom: 0.15rem; }
        .chongsha-item .value { font-size: 0.9rem; color: #ffd700; font-weight: 600; }

        /* ===== Shen (吉神/凶神) ===== */
        .shen-section { margin-bottom: 0.6rem; }
        .shen-section .shen-title { font-size: 0.8rem; color: rgba(255,255,255,0.6); margin-bottom: 0.35rem; }
        .shen-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; }
        .shen-tag {
            font-size: 0.76rem; padding: 0.18rem 0.5rem; border-radius: 4px;
            background: rgba(255,215,0,0.08); color: rgba(255,255,255,0.7);
        }
        .shen-tag.ji { color: #4ade80; background: rgba(74,222,128,0.1); }
        .shen-tag.xiong { color: #f87171; background: rgba(248,113,113,0.1); }

        /* ===== 十二值日 ===== */
        .zhi-ri-bar {
            display: flex; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 0.8rem;
        }
        .zr-item {
            font-size: 0.73rem; padding: 0.2rem 0.5rem; border-radius: 4px;
            background: rgba(0,0,0,0.2); color: rgba(255,255,255,0.45);
            text-align: center; min-width: 36px; transition: all 0.2s;
        }
        .zr-item.active {
            background: rgba(255,215,0,0.18); color: #ffd700;
            font-weight: 600; border: 1px solid rgba(255,215,0,0.25);
        }
        .zr-item.zr-ji { color: rgba(74,222,128,0.55); }
        .zr-item.zr-ji.active { color: #4ade80; border-color: rgba(74,222,128,0.25); background: rgba(74,222,128,0.12); }
        .zr-item.zr-xiong { color: rgba(248,113,113,0.55); }
        .zr-item.zr-xiong.active { color: #f87171; border-color: rgba(248,113,113,0.25); background: rgba(248,113,113,0.12); }

        /* ===== Recommend ===== */
        .recommend-box {
            background: linear-gradient(135deg, rgba(255,215,0,0.04), rgba(255,215,0,0.01));
            border: 1px solid rgba(255,215,0,0.08);
            border-radius: 12px; padding: 1.1rem; margin-bottom: 1rem;
        }
        .recommend-box h3 { font-size: 0.95rem; color: #ffd700; margin-bottom: 0.6rem; }
        .rec-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .rec-tag {
            padding: 0.25rem 0.6rem; border-radius: 6px; font-size: 0.8rem;
            background: rgba(74,222,128,0.1); color: #4ade80;
            border: 1px solid rgba(74,222,128,0.18);
        }

        /* ===== Knowledge ===== */
        .knowledge-section {
            background: linear-gradient(135deg, rgba(255,215,0,0.04), rgba(255,215,0,0.01));
            border: 1px solid rgba(255,215,0,0.07);
            border-radius: 12px; padding: 1.1rem;
        }
        .knowledge-section h3 { font-size: 0.95rem; color: #ffd700; margin-bottom: 0.5rem; }
        .knowledge-section p {
            font-size: 0.8rem; line-height: 1.8; color: rgba(255,255,255,0.65);
        }
        .knowledge-tip {
            margin-top: 0.5rem; padding: 0.5rem 0.7rem; border-radius: 6px;
            background: rgba(255,215,0,0.06); color: rgba(255,215,0,0.75);
            font-size: 0.76rem;
        }

        /* ===== Three-state Management ===== */
        .loading-state {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 2.5rem 1rem;
        }
        .loading-spinner {
            width: 38px; height: 38px;
            border: 3px solid rgba(255,215,0,0.12);
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loading-text { margin-top: 0.8rem; font-size: 0.85rem; color: rgba(255,255,255,0.55); }

        .error-state { text-align: center; padding: 2rem 1rem; }
        .error-icon { font-size: 2.2rem; margin-bottom: 0.6rem; }
        .error-msg { color: rgba(255,255,255,0.65); font-size: 0.85rem; margin-bottom: 1rem; }
        .error-actions { display: flex; gap: 0.7rem; justify-content: center; flex-wrap: wrap; }
        .btn-retry {
            padding: 0.55rem 1.1rem; border-radius: 8px; font-size: 0.82rem;
            background: rgba(255,215,0,0.18); color: #ffd700;
            border: 1px solid rgba(255,215,0,0.25); cursor: pointer;
            transition: background 0.3s;
        }
        .btn-retry:hover { background: rgba(255,215,0,0.28); }
        .btn-fallback {
            padding: 0.55rem 1.1rem; border-radius: 8px; font-size: 0.82rem;
            background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.65);
            border: 1px solid rgba(255,255,255,0.12); cursor: pointer;
            transition: background 0.3s;
        }
        .btn-fallback:hover { background: rgba(255,255,255,0.15); }

        /* ===== Source Badge ===== */
        .source-badge {
            display: inline-block; font-size: 0.7rem; padding: 0.2rem 0.55rem;
            border-radius: 4px; margin-bottom: 0.8rem;
        }
        .source-badge.realtime { background: rgba(74,222,128,0.1); color: #4ade80; }
        .source-badge.cached { background: rgba(250,204,21,0.1); color: #facc15; }
        .source-badge.local { background: rgba(59,130,246,0.1); color: #3b82f6; }
        .source-badge.fallback,
        .source-badge.local_fallback { background: rgba(248,113,113,0.1); color: #f87171; }

        /* ===== Responsive ===== */
        @media (min-width: 768px) {
            .content-area { max-width: 720px; margin: 0 auto; padding: 1.5rem; padding-bottom: 80px; }
            .chongsha-grid { grid-template-columns: 1fr 1fr 1fr 1fr; }
            .page-header { padding: 1rem 2rem; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <!-- page-header: sticky -->
    <div class="page-header">
        <button type="button" class="back-btn" onclick="history.back()">&#8592;</button>
        <h1>&#x1F4C5; 黄历吉日</h1>
    </div>

    <!-- content-area -->
    <div class="content-area" id="contentArea">
        <!-- 日期选择区域 -->
        <div class="date-controls">
            <input type="date" id="datePicker" title="选择日期查询黄历" />
            <button type="button" class="btn-today" id="btnToday">回到今天</button>
        </div>

        <!-- 动态结果区域 -->
        <div id="resultContainer"></div>

        <!-- 黄历知识简介区 -->
        <div class="knowledge-section">
            <h3>&#x1F4D6; 关于黄历</h3>
            <p>
                黄历，又称皇历、通书，是中国传统历法的重要组成部分。它基于天干地支、阴阳五行理论，
                结合星宿运行和节令变化，推断每日的吉凶宜忌，为农业活动、民俗仪式和日常生活提供择日参考。吉日选得宜，趋吉避凶顺天时。
            </p>
            <div class="knowledge-tip">
                &#x1F4A1; 口诀：建满平收黑，除危定执黄，成开皆可用，闭破不相当。
            </div>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script src="/js/fortune-api.js"></script>
    <script>
    (function() {
        'use strict';

        // ===== 十二建星 =====
        var JIANS = ['建','除','满','平','定','执','破','危','成','收','开','闭'];
        var JIANS_JIXIONG = {
            '建':'平','除':'吉','满':'吉','平':'平',
            '定':'吉','执':'平','破':'凶','危':'凶',
            '成':'吉','收':'平','开':'吉','闭':'凶'
        };

        // ===== State =====
        var cachedData = null;
        var cachedDate = null;
        var currentDate = getTodayStr();

        // ===== DOM =====
        var datePicker, btnToday, resultContainer;

        // ===== Helpers =====
        function getTodayStr() {
            var d = new Date();
            return d.getFullYear() + '-' +
                String(d.getMonth() + 1).padStart(2, '0') + '-' +
                String(d.getDate()).padStart(2, '0');
        }

        function formatWeekday(wd) {
            var m = {'星期一':'周一','星期二':'周二','星期三':'周三','星期四':'周四','星期五':'周五','星期六':'周六','星期日':'周日'};
            return m[wd] || wd || '';
        }

        function esc(s) {
            if (!s) return '';
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        // ===== Compute jian star from date =====
        function computeJianStar(dateStr) {
            var base = new Date(Date.UTC(1900, 0, 1));
            var t = new Date(dateStr + 'T00:00:00+08:00');
            var diff = Math.floor((t.getTime() - base.getTime()) / 86400000);
            return JIANS[((diff % 12) + 12) % 12];
        }

        // ===== Render: Loading =====
        function showLoading() {
            resultContainer.innerHTML =
                '<div class="loading-state">' +
                '<div class="loading-spinner"></div>' +
                '<p class="loading-text">正在获取实时黄历数据&#x2026;</p>' +
                '</div>';
        }

        // ===== Render: Error =====
        function showError(msg) {
            resultContainer.innerHTML =
                '<div class="error-state">' +
                '<div class="error-icon">&#x26A0;&#xFE0F;</div>' +
                '<p class="error-msg">' + esc(msg || '数据获取失败，请检查网络') + '</p>' +
                '<div class="error-actions">' +
                '<button class="btn-retry" id="btnRetry">&#x1F504; 重新获取</button>' +
                '<button class="btn-fallback" id="btnFallback">&#x1F4E1; 使用本地计算</button>' +
                '</div></div>';
            document.getElementById('btnRetry').addEventListener('click', function() { load(currentDate); });
            document.getElementById('btnFallback').addEventListener('click', function() { renderLocal(currentDate); });
        }

        // ===== Render: Result =====
        function showResult(data, meta) {
            if (!data) { showError('返回数据为空'); return; }

            var yi = data.yi || [];
            var ji = data.ji || [];
            var jishen = data.jishen || [];
            var xiongshen = data.xiongshen || [];
            var activeJian = data.jian_star || '';
            var source = (meta && meta.source) || 'local';

            var sourceMap = {
                'realtime': '&#x1F7E2; 实时联网数据',
                'cached': '&#x1F7E1; 缓存数据',
                'local': '&#x1F535; 服务器计算',
                'local_fallback': '&#x1F534; 离线数据'
            };
            var badgeLabel = sourceMap[source] || sourceMap['local'];
            var now = new Date().toLocaleTimeString('zh-CN');

            var h = '';

            // Source badge
            h += '<div class="source-badge ' + esc(source) + '">' + badgeLabel + ' &#xB7; 更新于 ' + esc(now) + '</div>';

            // Main card
            h += '<div class="huangli-card">';

            // Card header
            h += '<div class="card-header">';
            h += '<span class="date-big">' + esc(data.date || currentDate) + '</span>';
            if (data.weekday) h += '<span class="weekday">' + esc(formatWeekday(data.weekday)) + '</span>';
            h += '<div class="lunar">' + esc(data.lunar_date || '') + '</div>';
            var gz = [];
            if (data.year_ganzhi) gz.push(esc(data.year_ganzhi) + '年' + (data.shengxiao ? '(' + esc(data.shengxiao) + ')' : ''));
            if (data.month_ganzhi) gz.push(esc(data.month_ganzhi) + '月');
            if (data.day_ganzhi) gz.push(esc(data.day_ganzhi) + '日');
            h += '<div class="ganzhi">' + gz.join(' ') + '</div>';
            h += '</div>';

            // Yi / Ji grid
            h += '<div class="yiji-grid">';
            h += '<div class="yi-box"><h4>&#x2705; 宜</h4><div class="tag-list">';
            if (yi.length === 0) h += '<span class="tag-yi">&mdash;</span>';
            for (var i = 0; i < yi.length; i++) h += '<span class="tag-yi">' + esc(yi[i]) + '</span>';
            h += '</div></div>';
            h += '<div class="ji-box"><h4>&#x274C; 忌</h4><div class="tag-list">';
            if (ji.length === 0) h += '<span class="tag-ji">&mdash;</span>';
            for (var j = 0; j < ji.length; j++) h += '<span class="tag-ji">' + esc(ji[j]) + '</span>';
            h += '</div></div></div>';

            // Chongsha
            h += '<div class="chongsha-grid">';
            h += '<div class="chongsha-item"><div class="label">冲生肖</div><div class="value">' + esc(data.chong_shengxiao || '&mdash;') + '</div></div>';
            h += '<div class="chongsha-item"><div class="label">煞方</div><div class="value">' + esc(data.sha_direction || '&mdash;') + '</div></div>';
            h += '<div class="chongsha-item"><div class="label">胎神</div><div class="value">' + esc(data.taishen || '&mdash;') + '</div></div>';
            h += '<div class="chongsha-item"><div class="label">彭祖</div><div class="value">' + esc(data.pengzu || '&mdash;') + '</div></div>';
            h += '</div>';

            // Jishen / Xiongshen
            h += '<div class="shen-section"><div class="shen-title">&#x1F31F; 吉神</div><div class="shen-tags">';
            if (jishen.length === 0) h += '<span class="shen-tag ji">&mdash;</span>';
            for (var k = 0; k < jishen.length; k++) h += '<span class="shen-tag ji">' + esc(jishen[k]) + '</span>';
            h += '</div></div>';

            h += '<div class="shen-section"><div class="shen-title">&#x2620; 凶神</div><div class="shen-tags">';
            if (xiongshen.length === 0) h += '<span class="shen-tag xiong">&mdash;</span>';
            for (var m = 0; m < xiongshen.length; m++) h += '<span class="shen-tag xiong">' + esc(xiongshen[m]) + '</span>';
            h += '</div></div>';

            // Twelve zhi ri
            h += renderJianStars(activeJian);

            // Recommend
            var recs = buildRecommend(data);
            if (recs.length) {
                h += '<div class="recommend-box"><h3>&#x1F31F; 今日宜办事</h3><div class="rec-tags">';
                for (var n = 0; n < recs.length; n++) h += '<span class="rec-tag">' + esc(recs[n]) + '</span>';
                h += '</div></div>';
            }

            h += '</div>'; // end card

            resultContainer.innerHTML = h;
        }

        function renderJianStars(active) {
            var h = '<div class="zhi-ri-bar">';
            for (var i = 0; i < JIANS.length; i++) {
                var s = JIANS[i];
                var jx = JIANS_JIXIONG[s] || '平';
                var cls = 'zr-item';
                if (s === active) cls += ' active';
                if (jx === '吉') cls += ' zr-ji';
                else if (jx === '凶') cls += ' zr-xiong';
                h += '<span class="' + cls + '" title="' + s + '：' + jx + '">' + s + '</span>';
            }
            h += '</div>';
            return h;
        }

        function buildRecommend(data) {
            var items = [];
            var yi = data.yi || [];
            var jian = data.jian_star || '';
            if (['成','开','除','定'].indexOf(jian) !== -1) {
                items.push('今日' + jian + '日，百事皆宜');
            }
            var priority = ['嫁娶','纳采','订盟','开业','开市','交易','立券','纳财',
                            '出行','移徙','入宅','安床','动土','修造','上梁','祈福',
                            '入学','栽种','牧养','会亲友'];
            var emojiMap = {
                '嫁娶':'&#x1F492;','纳采':'&#x1F48D;','订盟':'&#x1F91D;','开业':'&#x1F3EA;','开市':'&#x1F3EA;',
                '交易':'&#x1F4B0;','出行':'&#x1F9F3;','移徙':'&#x1F3E0;','入宅':'&#x1F3E1;','安床':'&#x1F6CF;',
                '动土':'&#x1F3D7;','修造':'&#x1F528;','祈福':'&#x1F64F;','入学':'&#x1F393;','纳财':'&#x1F4B8;'
            };
            for (var p = 0; p < priority.length && items.length < 5; p++) {
                var a = priority[p];
                if (yi.indexOf(a) !== -1) {
                    items.push((emojiMap[a] || '&#x2728;') + ' 适合' + a);
                }
            }
            return items;
        }

        // ===== Local fallback =====
        function renderLocal(dateStr) {
            var date = new Date(dateStr + 'T00:00:00+08:00');
            var weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
            var tg = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
            var dz = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
            var sx = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
            var lunarMonths = ['正月','二月','三月','四月','五月','六月','七月','八月','九月','十月','冬月','腊月'];
            var lunarDays = ['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
                             '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
                             '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];

            var y = date.getFullYear(), m = date.getMonth(), d = date.getDate();
            var yearGi = (y - 4) % 10, yearZi = (y - 4) % 12;
            var yearGz = tg[((yearGi % 10) + 10) % 10] + dz[((yearZi % 12) + 12) % 12];
            var wx = weekdays[date.getDay()];
            var lunarStr = lunarMonths[m] + lunarDays[(d - 1) % 30];
            var sxStr = sx[((yearZi % 12) + 12) % 12];

            var jian = computeJianStar(dateStr);
            var jx = JIANS_JIXIONG[jian];
            var yiAll = [], jiAll = [];
            if (jx === '吉') {
                yiAll = ['嫁娶','出行','开业','交易','修造','祈福','入学','纳财','安床','纳畜'];
            } else if (jx === '凶') {
                jiAll = ['嫁娶','出行','开业','动土','安葬','开市'];
            } else {
                yiAll = ['祭祀','会亲友','入学','裁衣','安床'];
                jiAll = ['出行','动土','修造'];
            }

            var chongIdx = ((yearZi + 6) % 12 + 12) % 12;
            var shaDirs = ['北','东北','东北','东','东南','南','西南','西','西北','北','东北','西南'];

            var localData = {
                date: dateStr,
                weekday: wx,
                lunar_date: '农历' + lunarStr,
                lunar_year: y + '年',
                year_ganzhi: yearGz,
                month_ganzhi: tg[((y * 2 + m) % 10 + 10) % 10] + dz[((m + 2) % 12 + 12) % 12],
                day_ganzhi: tg[((y * 5 + m * 3 + d) % 10 + 10) % 10] + dz[((y * 3 + m * 2 + d) % 12 + 12) % 12],
                yi: yiAll, ji: jiAll,
                chong_shengxiao: sx[chongIdx],
                sha_direction: shaDirs[chongIdx],
                jishen: jx === '吉' ? ['天德','月德','天喜','驿马'] : (jx === '平' ? ['天恩','月恩'] : []),
                xiongshen: jx === '凶' ? ['天罡','地煞'] : (jx === '平' ? ['小耗'] : []),
                jian_star: jian,
                shengxiao: sxStr,
                taishen: '厨灶',
                pengzu: '不远行'
            };

            showResult(localData, { source: 'local_fallback' });
        }

        // ===== Load =====
        async function load(dateStr) {
            showLoading();
            currentDate = dateStr;

            if (cachedDate === dateStr && cachedData && cachedData.success) {
                showResult(cachedData.data, cachedData.meta);
                return;
            }

            try {
                var result = await fortuneGetAPI('huangli', { date: dateStr });
                if (result && result.success) {
                    cachedData = result;
                    cachedDate = dateStr;
                    showResult(result.data, result.meta);
                } else {
                    renderLocal(dateStr);
                }
            } catch (e) {
                console.error('黄历API error:', e);
                showError('网络连接失败，请检查网络后重试');
            }
        }

        // ===== Init =====
        function init() {
            datePicker = document.getElementById('datePicker');
            btnToday = document.getElementById('btnToday');
            resultContainer = document.getElementById('resultContainer');

            datePicker.value = currentDate;

            datePicker.addEventListener('change', function() {
                var v = this.value;
                if (!v) return;
                load(v);
            });

            btnToday.addEventListener('click', function() {
                var today = getTodayStr();
                datePicker.value = today;
                load(today);
            });

            load(currentDate);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
