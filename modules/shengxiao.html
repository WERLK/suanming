    <script>
        // ===== 天干地支数据 =====
        const tiangan = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
        const dizhi = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
        const zodiacAnimals = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
        const zodiacEmoji = ['🐭','🐮','🐯','🐰','🐲','🐍','🐴','🐑','🐵','🐔','🐶','🐷'];
        
        // 五行
        const wuxingByTiangan = {'甲':'木','乙':'木','丙':'火','丁':'火','戊':'土','己':'土','庚':'金','辛':'金','壬':'水','癸':'水'};
        const wuxingByDizhi = {'子':'水','丑':'土','寅':'木','卯':'木','辰':'土','巳':'火','午':'火','未':'土','申':'金','酉':'金','戌':'土','亥':'水'};
        
        // 生肖关系矩阵
        // 六合: 子丑, 寅亥, 卯戌, 辰酉, 巳申, 午未
        const liuheMap = {'子':'丑','丑':'子','寅':'亥','亥':'寅','卯':'戌','戌':'卯','辰':'酉','酉':'辰','巳':'申','申':'巳','午':'未','未':'午'};
        // 三合: 申子辰, 亥卯未, 寅午戌, 巳酉丑
        const sanheGroups = [['申','子','辰'],['亥','卯','未'],['寅','午','戌'],['巳','酉','丑']];
        // 六冲: 子午, 丑未, 寅申, 卯酉, 辰戌, 巳亥
        const chongMap = {'子':'午','午':'子','丑':'未','未':'丑','寅':'申','申':'寅','卯':'酉','酉':'卯','辰':'戌','戌':'辰','巳':'亥','亥':'巳'};
        // 六害: 子未, 丑午, 寅巳, 卯辰, 申亥, 酉戌
        const haiMap = {'子':'未','未':'子','丑':'午','午':'丑','寅':'巳','巳':'寅','卯':'辰','辰':'卯','申':'亥','亥':'申','酉':'戌','戌':'酉'};
        
        function getYearGanZhi(year) {
            const ganIdx = (year - 4) % 10;
            const zhiIdx = (year - 4) % 12;
            return { gan: tiangan[ganIdx], zhi: dizhi[zhiIdx], zodiac: zodiacAnimals[zhiIdx], emoji: zodiacEmoji[zhiIdx] };
        }
        
        function getSanheGroup(zhi) {
            for (const g of sanheGroups) {
                if (g.includes(zhi)) return g;
            }
            return [];
        }
        
        function getRelation(userZodiac, yearZhi) {
            const userZhi = dizhi[zodiacAnimals.indexOf(userZodiac)];
            // 同生肖
            if (userZhi === yearZhi) return {type:'值太岁',level:'low',desc:'本命年，值太岁，运势起伏较大，需谨慎行事'};
            // 六冲
            if (chongMap[userZhi] === yearZhi) return {type:'冲太岁',level:'low',desc:'与流年相冲，变动较多，宜静不宜动'};
            // 六害
            if (haiMap[userZhi] === yearZhi) return {type:'害太岁',level:'low',desc:'与流年相害，人际关系易出问题，谨防小人'};
            // 六合
            if (liuheMap[userZhi] === yearZhi) return {type:'六合贵人',level:'top',desc:'与流年六合，贵人运极佳，诸事顺遂'};
            // 三合
            const group = getSanheGroup(userZhi);
            if (group.includes(yearZhi)) return {type:'三合贵人',level:'top',desc:'与流年三合，运势旺盛，多有助力'};
            // 一般
            return {type:'平稳',level:'mid',desc:'与流年关系平和，运势平稳，按部就班即可'};
        }
        
        // ===== 动态生成运势 =====
        function generateDynamicFortune(zodiac, year, month, day) {
            const gz = getYearGanZhi(year);
            const userZhi = dizhi[zodiacAnimals.indexOf(zodiac)];
            const rel = getRelation(zodiac, gz.zhi);
            const yearWx = wuxingByDizhi[gz.zhi];
            const userWx = wuxingByDizhi[userZhi];
            
            // 排名：根据关系类型
            const rankMap = {
                '六合贵人': {rank:1, text:'大吉', cls:'rank-top'},
                '三合贵人': {rank:2, text:'大吉', cls:'rank-top'},
                '平稳': {rank:6, text:'中等', cls:'rank-mid'},
                '值太岁': {rank:10, text:'需谨慎', cls:'rank-low'},
                '冲太岁': {rank:11, text:'需谨慎', cls:'rank-low'},
                '害太岁': {rank:9, text:'较差', cls:'rank-low'}
            };
            const rankInfo = rankMap[rel.type] || {rank:7, text:'中等', cls:'rank-mid'};
            
            // 根据五行关系生成运势文字
            const wxInteract = yearWx + userWx;
            let career, wealth, love, health, advice;
            
            if (rel.type === '六合贵人' || rel.type === '三合贵人') {
                career = year + '年贵人星高照，事业发展顺遂。有升职加薪的机会，大胆展示自己的能力，容易获得上级赏识。合作项目进展顺利，可以积极拓展人脉。';
                wealth = '财运亨通，正财偏财皆有收获。适合稳健投资，但也要注意节制消费。上半年财运渐入佳境，下半年收获颇丰。';
                love = '桃花运旺盛，单身者有机会遇到心仪对象。有伴侣者感情甜蜜，适合谈婚论嫁。';
                health = '整体健康状况良好，精力充沛。注意饮食规律，适当锻炼身体。';
                advice = '把握机遇，乘势而上，但也要保持谦逊，不可得意忘形。';
            } else if (rel.type === '值太岁') {
                career = '本命年值太岁，事业上容易遇到波折和挑战。建议稳扎稳打，不宜冒进或跳槽。遇到困难多与长辈沟通，可获得指点。';
                wealth = '财运起伏较大，有破财风险。不建议大额投资或借贷，开源节流为上策。';
                love = '感情波动较多，容易产生误会和矛盾。多沟通、多包容，避免因小事争执。';
                health = '注意身体健康，尤其心脏和循环系统。避免过度劳累，保持良好作息。';

                wealth = '财运不稳，注意破财和意外开销。避免高风险投资，理财要保守。';
                love = '感情方面易生变数，有伴侣者注意沟通方式，单身的耐心等待时机。';

            } else if (rel.type === '害太岁') {
                career = '害太岁之年，职场人际关系复杂，容易与同事产生误会。注意言行举止，避免卷入是非之争。';

                health = '压力较大，注意调节情绪。小毛病较多，及时就医不要拖延。';
                advice = '谨言慎行，远离是非。适当独处反思，提升自我修养。';

            // 根据月份微调
            const seasonTips = {
                1: '新年伊始，万象更新，宜制定年度计划。',

                4: '春末夏初，精力旺盛，适合推进重要事项。',
                5: '盛夏将至，运势达到高峰，抓住机遇。',
                6: '年中时节，回顾调整，为下半年蓄力。',
                7: '盛夏炎炎，注意劳逸结合，避免过劳。',
                8: '秋意渐浓，收获在望，前期努力见成效。',
                9: '金秋时节，适合总结和规划，财运渐好。',
                10: '秋末冬初，宜保守行事，关注健康。',
                11: '冬季来临，运势趋稳，适合内省和规划。',
                12: '岁末年终，总结过往，为新年做好准备。'
            };
            
            const tags = (function() {
                const t = [];
                if (rel.type !== '平稳') t.push(rel.type);
                t.push(yearWx + userWx + '相生');
                if (year === 2026) t.push('丙午');
                if (year === 2027) t.push('丁未');
                if (year === 2028) t.push('戊申');
                if (year === 2029) t.push('己酉');
                if (year === 2030) t.push('庚戌');
                return t.slice(0, 4);
            })();
            
            return {
                rank: rankInfo.rank,
                rankText: rankInfo.text,
                rankClass: rankInfo.cls,
                summary: gz.gan + gz.zhi + '年（' + gz.zodiac + '年），' + rel.desc,
                career: career,
                wealth: wealth,
                love: love,
                health: health,
                advice: advice,
                tags: tags,
                yearName: gz.gan + gz.zhi + '年',
                yearZodiac: gz.zodiac,
                yearEmoji: gz.emoji,
                monthTip: seasonTips[month] || '',
                relationType: rel.type
            };
        }
        
        // 当前选择
        let currentYear = 2026, currentMonth = 5, currentDay = 27, currentZodiac = null;
        
        function initDateSelectors() {
            const yearSelect = document.getElementById('yearSelect');
            for (let y = 2024; y <= 2032; y++) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y + '年 ' + getYearGanZhi(y).gan + getYearGanZhi(y).zhi + '年(' + getYearGanZhi(y).zodiac + ')';
                if (y === currentYear) opt.selected = true;
                yearSelect.appendChild(opt);
            }
            
            document.getElementById('monthSelect').value = currentMonth;
            updateDaySelect(currentYear, currentMonth);
            document.getElementById('daySelect').value = currentDay;
            updateDateBadge();
        }
        
        function updateDaySelect(year, month) {
            const daySelect = document.getElementById('daySelect');
            const daysInMonth = new Date(year, month, 0).getDate();
            const oldVal = daySelect.value;
            daySelect.innerHTML = '';
            for (let d = 1; d <= daysInMonth; d++) {
                const opt = document.createElement('option');
                opt.value = d;
                opt.textContent = d + '日';
                daySelect.appendChild(opt);
            }
            const newVal = Math.min(oldVal || currentDay, daysInMonth);
            daySelect.value = newVal;
            currentDay = newVal;
        }
        
        function updateDateBadge() {
            const gz = getYearGanZhi(currentYear);
            document.getElementById('dateBadge').textContent = currentYear + '年 ' + gz.gan + gz.zhi + '年(' + gz.zodiac + ') ' + currentMonth + '月' + currentDay + '日';
            document.getElementById('queryHint').textContent = '查看' + currentYear + '年（' + gz.gan + gz.zhi + '年）你的生肖运势详解';
        }
        
        function onYearChange() {
            currentYear = parseInt(document.getElementById('yearSelect').value);
            updateDaySelect(currentYear, currentMonth);
            updateDateBadge();
            if (currentZodiac) selectZodiac(currentZodiac);
        }
        
        function onMonthChange() {
            currentMonth = parseInt(document.getElementById('monthSelect').value);
            updateDaySelect(currentYear, currentMonth);
            updateDateBadge();
            if (currentZodiac) selectZodiac(currentZodiac);
        }
        
        function onDayChange() {
            currentDay = parseInt(document.getElementById('daySelect').value);
            updateDateBadge();
            if (currentZodiac) selectZodiac(currentZodiac);
        }
        
        function selectZodiac(zodiac) {
            currentZodiac = zodiac;
            // 更新卡片状态
            document.querySelectorAll('.zodiac-card').forEach(card => {
                card.classList.remove('active');
                if (card.dataset.zodiac === zodiac) card.classList.add('active');
            });
            showFortune(zodiac);
        }
        
        // API降级回退函数
        function showFortuneFallback(zodiac) {
            const data = generateDynamicFortune(zodiac, currentYear, currentMonth, currentDay);
            renderLocalFortune(data, zodiac);
            showDataBadge('local_fallback', 'fortuneResult');
        }

        // 渲染本地算法生成的数据（原有渲染逻辑）
        function renderLocalFortune(data, zodiac) {
            var mode = ModeToggle.getMode();

            if (mode === 'simple') {
                var simpleHtml = '<div class="beginner-result">';
                simpleHtml += '<div class="beginner-card"><h3>' + zodiac + '运势分析</h3><p>' + (data.summary || '生肖运势分析完成') + '</p></div>';
                simpleHtml += '</div>';
                document.getElementById('fortuneResult').innerHTML = simpleHtml;
                document.getElementById('fortuneResult').style.display = 'block';
                return;
            }

            let html = '<div class="fortune-year">📅 ' + data.yearName + '（' + data.yearZodiac + '年）' + zodiac + '运势</div>';
            html += '<div class="fortune-rank ' + data.rankClass + '">排名：第' + data.rank + '名 | ' + data.rankText + ' | ' + data.relationType + '</div>';
            
            html += '<div class="fortune-section"><h3>📊 综合运势</h3><p>' + data.summary + '</p></div>';
            html += '<div class="fortune-section"><h3>💼 事业运</h3><p>' + data.career + '</p></div>';
            html += '<div class="fortune-section"><h3>💰 财运</h3><p>' + data.wealth + '</p></div>';
            html += '<div class="fortune-section"><h3>💕 感情运</h3><p>' + data.love + '</p></div>';
            html += '<div class="fortune-section"><h3>🏥 健康运</h3><p>' + data.health + '</p></div>';
            
            if (data.monthTip) {
                html += '<div class="fortune-section"><h3>📌 ' + currentMonth + '月运势提示</h3><p>' + data.monthTip + ' 当前' + data.yearZodiac + '年' + currentMonth + '月，流月运势' + (data.rank <= 3 ? '良好' : data.rank <= 7 ? '平稳' : '需留意') + '。</p></div>';
            }
            
            html += '<div class="fortune-section"><h3>💡 建议</h3><p><strong>' + data.advice + '</strong></p></div>';
            
            html += '<div class="fortune-tags">';
            data.tags.forEach(tag => { html += '<span class="fortune-tag">' + tag + '</span>'; });
            html += '</div>';
            
            document.getElementById('fortuneResult').innerHTML = html;
            document.getElementById('fortuneResult').style.display = 'block';
            
            document.getElementById('fortuneResult').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // 渲染API返回的数据
        function renderFortuneAPI(apiData, zodiac) {
            var mode = ModeToggle.getMode();
            const d = apiData;

            if (mode === 'simple') {
                var simpleHtml = '<div class="beginner-result">';
                simpleHtml += '<div class="beginner-card"><h3>' + zodiac + '运势分析</h3><p>' + (d.description || d.summary || '生肖运势分析完成') + '</p></div>';
                simpleHtml += '</div>';
                document.getElementById('fortuneResult').innerHTML = simpleHtml;
                document.getElementById('fortuneResult').style.display = 'block';
                return;
            }

            const yearName = d.year_ganzhi || (d.year + '年');
            const scores = d.scores || {};
            const relation = d.relation || {};
            
            let html = '';
            
            // 年份和生肖标题
            html += '<div class="fortune-year">📅 ' + yearName + ' ' + zodiac + '运势</div>';
            
            // 关系标识
            if (relation.type) {
                const relLevel = relation.level || 'mid';
                const relCls = relLevel === 'top' ? 'rank-top' : relLevel === 'low' ? 'rank-low' : 'rank-mid';
                html += '<div class="fortune-rank ' + relCls + '">' + relation.type + ' | ' + (relation.desc || '') + '</div>';
            }
            
            // 各维度评分
            if (Object.keys(scores).length > 0) {
                html += '<div class="fortune-section"><h3>📊 维度评分</h3>';
                html += '<div class="fortune-tags">';
                const scoreLabels = { career: '事业', wealth: '财运', love: '感情', health: '健康', overall: '综合' };
                for (const key in scores) {
                    const label = scoreLabels[key] || key;
                    const score = scores[key];
                    const stars = '★'.repeat(Math.round(score / 20)) + '☆'.repeat(5 - Math.round(score / 20));
                    html += '<span class="fortune-tag">' + label + ' ' + stars + ' (' + score + '分)</span>';
                }
                html += '</div></div>';
            }
            
            // 综合描述
            if (d.description) {
                html += '<div class="fortune-section"><h3>📊 综合运势</h3><p>' + d.description + '</p></div>';
            }
            
            // 月度运势
            if (d.monthly_fortune) {
                html += '<div class="fortune-section"><h3>📌 ' + currentMonth + '月运势</h3><p>' + d.monthly_fortune + '</p></div>';
            }
            
            // 幸运元素
            const hasLuckyItems = d.lucky_numbers || d.lucky_colors || d.lucky_directions;
            if (hasLuckyItems) {
                html += '<div class="fortune-section"><h3>🍀 幸运元素</h3>';
                html += '<div class="fortune-tags">';
                if (d.lucky_numbers && d.lucky_numbers.length) {
                    html += '<span class="fortune-tag">🔢 幸运数字：' + d.lucky_numbers.join('、') + '</span>';
                }
                if (d.lucky_colors && d.lucky_colors.length) {
                    html += '<span class="fortune-tag">🎨 幸运颜色：' + d.lucky_colors.join('、') + '</span>';
                }
                if (d.lucky_directions && d.lucky_directions.length) {
                    html += '<span class="fortune-tag">🧭 幸运方位：' + d.lucky_directions.join('、') + '</span>';
                }
                html += '</div></div>';
            }
            
            document.getElementById('fortuneResult').innerHTML = html;
            document.getElementById('fortuneResult').style.display = 'block';
            
            document.getElementById('fortuneResult').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        async function showFortune(zodiac) {
            // 显示 Loading
            showFortuneLoading('正在联网分析生肖运势...');
            
            // 创建降级回退闭包
            const fallbackFn = function() { showFortuneFallback(zodiac); };
            
            const result = await fortuneAPI('shengxiao', {
                zodiac: zodiac,
                year: currentYear,
                month: currentMonth,
                day: currentDay
            }, { showLoading: false });
            
            if (result && result.success) {
                // 渲染API数据
                renderFortuneAPI(result.data, zodiac);
                // 显示数据来源标识
                const source = (result.meta && result.meta.source) ? result.meta.source : 'realtime';
                showDataBadge(source, 'fortuneResult');
            } else {
                // API失败，显示错误和降级选项
                const errMsg = result ? '分析失败，请重试' : '网络连接失败，请检查网络后重试';
                showFortuneError('fortuneResult', errMsg, 
                    function() { showFortune(zodiac); },
                    fallbackFn
                );
                document.getElementById('fortuneResult').style.display = 'block';
            }
        }
        
        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            createStars();
            initDateSelectors();
            ModeToggle.injectUI(
                document.querySelector('.mode-toggle-wrapper') || document.body,
                { label: '排盘模式', proLabel: '专业模式', simpleLabel: '新手模式' }
            );
        });
    </script>
</body>
</html>
