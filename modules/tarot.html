<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffd700">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="玄机算命">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="msapplication-TileImage" content="/icon-192.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>塔罗牌 - 玄机算命网</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/mode-toggle.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, #0f0c29, #1a1a2e 30%, #16213e 70%, #0a0a1a);
            color: #fff;
            min-height: 100vh;
        }

        .page-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.2rem;
            background: linear-gradient(180deg, rgba(15,12,41,0.95), rgba(26,26,46,0.85));
            border-bottom: 1px solid rgba(255,215,0,0.15);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .back-btn {
            background: none;
            border: none;
            color: #ffd700;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 0.4rem 0.6rem;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .back-btn:hover { background: rgba(255,215,0,0.1); }
        .page-header h1 {
            font-size: 1.2rem;
            color: #ffd700;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .content-area {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.2rem;
            padding-bottom: 100px;
        }

        /* ===== 引导区 ===== */
        .guidance-area {
            text-align: center;
            padding: 2rem 1.5rem;
            margin-bottom: 1.5rem;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(255,215,0,0.06), rgba(138,43,226,0.06));
            border: 1px solid rgba(255,215,0,0.1);
        }
        .guidance-area .icon-mystic {
            font-size: 2.5rem;
            margin-bottom: 0.8rem;
            display: block;
        }
        .guidance-area p {
            font-size: 0.92rem;
            color: rgba(255,255,255,0.82);
            line-height: 1.8;
            margin-bottom: 0.3rem;
        }
        .guidance-area .sub-hint {
            font-size: 0.78rem;
            color: rgba(255,255,255,0.45);
            margin-top: 0.5rem;
        }

        /* ===== 抽牌按钮区 ===== */
        .draw-section {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .btn-draw {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.9rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: #1a1040;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 24px rgba(255,215,0,0.35);
            transition: all 0.3s ease;
            letter-spacing: 0.06em;
        }
        .btn-draw:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 32px rgba(255,215,0,0.5);
        }
        .btn-draw:active {
            transform: scale(0.96);
        }
        .btn-draw:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ===== 牌面展示区 ===== */
        .cards-stage {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.2rem;
            flex-wrap: wrap;
            min-height: 280px;
            margin-bottom: 1.5rem;
        }

        .tarot-card-container {
            perspective: 800px;
            width: 150px;
            aspect-ratio: 3/4;
            cursor: pointer;
        }

        .tarot-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .tarot-card-inner.flipped {
            transform: rotateY(180deg);
        }

        .tarot-card-front,
        .tarot-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
        }

        .tarot-card-front {
            background: linear-gradient(145deg, #1a1040, #0f0c29);
            border: 2px solid rgba(255,215,0,0.4);
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .card-front-inner {
            width: 85%;
            height: 85%;
            border: 1.5px solid rgba(255,215,0,0.25);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(255,215,0,0.06), rgba(255,215,0,0.02));
            gap: 0.4rem;
        }
        .card-front-inner .mystic-symbol {
            font-size: 2.5rem;
            opacity: 0.8;
        }
        .card-front-inner .flip-text {
            font-size: 0.72rem;
            color: rgba(255,215,0,0.6);
            letter-spacing: 0.05em;
        }
        .card-position-label {
            position: absolute;
            bottom: 10px;
            font-size: 0.62rem;
            color: rgba(255,255,255,0.35);
            letter-spacing: 0.04em;
        }

        .tarot-card-back {
            transform: rotateY(180deg);
            background: linear-gradient(145deg, #1a1040, #0f0c29);
            border: 2px solid rgba(255,215,0,0.5);
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 0.3rem;
        }
        .card-name {
            font-size: 0.82rem;
            font-weight: 600;
            color: #ffd700;
            line-height: 1.3;
        }
        .card-type-tag {
            font-size: 0.6rem;
            color: rgba(255,255,255,0.45);
            padding: 0.12rem 0.5rem;
            border: 1px solid rgba(255,215,0,0.18);
            border-radius: 10px;
        }
        .card-direction {
            font-size: 0.65rem;
            color: rgba(255,215,0,0.7);
        }

        /* 洗牌动画 */
        @keyframes shuffle {
            0%   { transform: translateX(0) rotate(0deg) scale(1); opacity: 1; }
            15%  { transform: translateX(80px) rotate(18deg) scale(0.85); opacity: 0.5; }
            30%  { transform: translateX(-60px) rotate(-12deg) scale(0.9); opacity: 0.7; }
            45%  { transform: translateX(40px) rotate(10deg) scale(0.85); opacity: 0.6; }
            60%  { transform: translateX(-30px) rotate(-7deg) scale(0.95); opacity: 0.8; }
            75%  { transform: translateX(15px) rotate(5deg) scale(0.9); opacity: 0.75; }
            100% { transform: translateX(0) rotate(0deg) scale(1); opacity: 1; }
        }
        .shuffling .tarot-card-container {
            animation: shuffle 0.8s ease-in-out;
        }

        /* ===== 操作按钮区 ===== */
        .actions-row {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }
        .btn-redraw {
            padding: 0.6rem 1.5rem;
            font-size: 0.85rem;
            color: #ffd700;
            background: rgba(255,215,0,0.08);
            border: 1px solid rgba(255,215,0,0.25);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.25s;
        }
        .btn-redraw:hover {
            background: rgba(255,215,0,0.18);
            border-color: rgba(255,215,0,0.4);
        }

        /* ===== 数据来源标识（全局 badge 样式补充） ===== */
        .data-source-badge-container {
            text-align: center;
            padding: 0.4rem;
            margin-bottom: 1rem;
        }
        .data-source-badge-container .badge-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            margin-right: 0.35rem;
            vertical-align: middle;
        }
        .badge-dot.realtime { background: #4caf50; box-shadow: 0 0 6px rgba(76,175,80,0.5); }
        .badge-dot.cached   { background: #ffb300; box-shadow: 0 0 6px rgba(255,179,0,0.5); }
        .badge-dot.local    { background: #2196f3; box-shadow: 0 0 6px rgba(33,150,243,0.5); }
        .badge-text {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            vertical-align: middle;
        }

        /* ===== 牌面解读区 ===== */
        .reading-section {
            margin-bottom: 1.5rem;
        }
        .reading-cards {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }
        .reading-card {
            background: linear-gradient(135deg, rgba(15,12,41,0.92), rgba(26,26,46,0.85));
            border: 1px solid rgba(255,215,0,0.18);
            border-radius: 14px;
            padding: 1.2rem;
            position: relative;
            overflow: hidden;
        }
        .reading-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
        }
        .reading-card .card-header-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.8rem;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid rgba(255,215,0,0.1);
        }
        .reading-card .pos-label {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.5);
            padding: 0.12rem 0.5rem;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            white-space: nowrap;
        }
        .reading-card .card-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #ffd700;
            flex: 1;
        }
        .reading-card .card-type {
            font-size: 0.62rem;
            color: rgba(255,255,255,0.42);
        }
        .reading-card .toggle-dir {
            display: inline-flex;
            border: 1px solid rgba(255,215,0,0.2);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }
        .reading-card .toggle-dir button {
            padding: 0.3rem 0.8rem;
            font-size: 0.7rem;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.55);
            cursor: pointer;
            transition: all 0.2s;
        }
        .reading-card .toggle-dir button.active {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a1040;
            font-weight: 600;
        }
        .reading-card .meaning-label {
            font-size: 0.72rem;
            font-weight: 600;
            color: rgba(255,215,0,0.72);
            margin-bottom: 0.35rem;
        }
        .reading-card .meaning-text {
            font-size: 0.82rem;
            color: rgba(255,255,255,0.78);
            line-height: 1.75;
        }
        .reading-card .desc-text {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.52);
            line-height: 1.65;
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        /* ===== 三态：Loading / Error / Result ===== */
        .loading-state {
            text-align: center;
            padding: 3rem 1rem;
            color: rgba(255,255,255,0.5);
        }
        .loading-state .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,215,0,0.12);
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-state {
            text-align: center;
            padding: 3rem 1rem;
            color: rgba(255,255,255,0.5);
        }
        .error-state .err-icon { font-size: 2.5rem; margin-bottom: 0.6rem; }
        .error-state .err-msg  { font-size: 0.88rem; margin-bottom: 1rem; color: rgba(255,255,255,0.55); }
        .error-state button {
            padding: 0.5rem 1.3rem;
            background: rgba(255,215,0,0.12);
            color: #ffd700;
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        .error-state button:hover { background: rgba(255,215,0,0.2); }

        /* ===== 综合解读 ===== */
        .overall-reading {
            background: linear-gradient(135deg, rgba(255,215,0,0.08), rgba(138,43,226,0.05));
            border: 1px solid rgba(255,215,0,0.15);
            border-radius: 14px;
            padding: 1.2rem;
            margin-top: 1rem;
            text-align: center;
        }
        .overall-reading h3 {
            color: #ffd700;
            font-size: 0.92rem;
            margin-bottom: 0.6rem;
        }
        .overall-reading p {
            font-size: 0.82rem;
            color: rgba(255,255,255,0.7);
            line-height: 1.8;
        }

        /* ===== 塔罗基础知识区 ===== */
        .knowledge-section {
            margin-bottom: 1.5rem;
        }
        .knowledge-section h2 {
            color: #ffd700;
            font-size: 1rem;
            margin-bottom: 0.8rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid rgba(255,215,0,0.15);
        }
        .knowledge-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 0.8rem;
        }
        .knowledge-card {
            background: linear-gradient(135deg, rgba(255,215,0,0.06), rgba(138,43,226,0.04));
            border: 1px solid rgba(255,215,0,0.1);
            border-radius: 12px;
            padding: 1rem;
        }
        .knowledge-card h3 {
            color: #ffd700;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }
        .knowledge-card p {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.6);
            line-height: 1.7;
        }

        /* ===== 响应式 ===== */
        /* 平板 */
        @media (min-width: 768px) {
            .tarot-card-container {
                width: 160px;
            }
            .reading-cards {
                grid-template-columns: repeat(3, 1fr);
            }
            .cards-stage {
                gap: 1.5rem;
                min-height: 320px;
            }
        }
        /* 桌面 */
        @media (min-width: 1024px) {
            .tarot-card-container {
                width: 170px;
            }
            .content-area {
                padding: 1.5rem 2rem;
                padding-bottom: 100px;
            }
            .cards-stage {
                gap: 2rem;
                min-height: 340px;
            }
        }
        /* 小屏手机 */
        @media (max-width: 480px) {
            .tarot-card-container {
                width: 120px;
            }
            .cards-stage {
                gap: 0.6rem;
                min-height: 220px;
            }
            .card-name { font-size: 0.7rem; }
        }

        /* 淡入动画 */
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* 星星背景 */
        .star {
            position: fixed;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--dur) ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes twinkle {
            from { opacity: 0.3; }
            to   { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <!-- ===== Sticky Header ===== -->
    <div class="page-header">
        <button class="back-btn" onclick="history.back()" aria-label="返回">&#8592;</button>
        <h1>🃏 塔罗牌占卜</h1>
    </div>

    <div class="content-area">

        <!-- ===== 占卜引导区 ===== -->
        <div class="guidance-area fade-in">
            <span class="icon-mystic">🔮</span>
            <p>请集中精神，默念你的问题...</p>
            <p class="sub-hint">心诚则灵 · 塔罗牌将为你揭示命运的线索</p>
        </div>

        <!-- ===== 抽牌按钮 ===== -->
        <!-- 专业/初学模式切换 -->
        <div class="mode-toggle-wrapper" style="max-width:500px;margin:0.8rem auto;">
            <span class="mode-toggle-label">排盘模式</span>
            <div class="mode-toggle-pill">
                <div class="mode-toggle-option active" data-mode="pro">专业模式</div>
                <div class="mode-toggle-option" data-mode="simple">新手模式</div>
            </div>
        </div>
        <div class="draw-section" id="drawSection">
            <button class="btn-draw" id="btnDraw" onclick="handleDraw()">🔮 开始抽牌</button>
        </div>

        <!-- ===== 三张牌翻牌展示区 ===== -->
        <div class="cards-stage" id="cardsStage"></div>

        <!-- ===== 操作按钮 ===== -->
        <div class="actions-row" id="actionsRow" style="display:none;">
            <button class="btn-redraw" onclick="handleRedraw()">🔄 重新抽牌</button>
        </div>

        <!-- ===== 数据来源标识 ===== -->
        <div class="data-source-badge-container" id="dataSourceBadge" style="display:none;"></div>

        <!-- ===== 牌面解读区 ===== -->
        <div class="reading-section" id="readingSection"></div>

        <!-- ===== 塔罗基础知识 ===== -->
        <div class="knowledge-section">
            <h2>📜 塔罗牌基础知识</h2>
            <div class="knowledge-grid">
                <div class="knowledge-card">
                    <h3>🂧 大阿卡纳（Major Arcana）— 22张</h3>
                    <p>代表人生重大主题和灵性课题，象征人生旅程中的重要阶段。从"愚者"到"世界"，描绘了一条完整的灵性成长之路，如：愚者、魔术师、女祭司、皇后、皇帝等。</p>
                </div>
                <div class="knowledge-card">
                    <h3>🂱 小阿卡纳（Minor Arcana）— 56张</h3>
                    <p>代表日常生活中的具体情况和事件，分为四个花色：<br>🏆 <b>圣杯</b>（水元素·情感关系）<br>🔥 <b>权杖</b>（火元素·行动事业）<br>⚔️ <b>宝剑</b>（风元素·思维沟通）<br>💰 <b>星币</b>（土元素·物质财富）</p>
                </div>
            </div>
        </div>

    </div>

    <!-- ===== Scripts ===== -->
    <script src="/js/main.js"></script>
    <script src="/js/fortune-api.js"></script>
    <script src="/js/mode-toggle.js"></script>
    <script>
    'use strict';

    // ===== 页面状态 =====
    var STATE = {
        cards: [],                          // API 返回牌数据
        flipped: [false, false, false],     // 各牌是否已翻转
        directions: [1, 1, 1],             // 1=正位, -1=逆位
        metaSource: 'local',
        loading: false
    };

    var POSITIONS = ['🕰 过去', '🌟 现在', '🔮 未来'];

    // ===== 初始化 =====
    document.addEventListener('DOMContentLoaded', function() {
        if (window.createStars) window.createStars();
        ModeToggle.injectUI(
            document.querySelector('.mode-toggle-wrapper') || document.body,
            { label: '排盘模式', proLabel: '专业模式', simpleLabel: '新手模式' }
        );
    });

    // ===== 抽牌入口 =====
    async function handleDraw() {
        if (STATE.loading) return;
        STATE.loading = true;

        var btn = document.getElementById('btnDraw');
        btn.disabled = true;

        // 阶段1：洗牌动画
        btn.innerHTML = '🌀 洗牌中...';
        showShuffleAnimation();

        // 等待洗牌动画 + 调用API
        var data = await fortuneGetAPI('tarot/draw', { n: 3 });

        if (!data || !data.success || !data.data || !data.data.cards) {
            STATE.loading = false;
            btn.disabled = false;
            btn.innerHTML = '🔮 重新抽牌';
            showError('占卜未果，请静心后再试');
            return;
        }

        // 阶段2：数据就绪，显示牌背
        STATE.cards = data.data.cards;
        STATE.flipped = [false, false, false];
        STATE.directions = [
            Math.random() > 0.5 ? 1 : -1,
            Math.random() > 0.5 ? 1 : -1,
            Math.random() > 0.5 ? 1 : -1
        ];
        STATE.metaSource = (data.meta && data.meta.source) ? data.meta.source : 'local';
        STATE.meta = data.meta || null;
        STATE.loading = false;

        // 延迟一点让用户看到洗牌效果结束
        setTimeout(function() {
            renderCardStage();
            document.getElementById('actionsRow').style.display = 'flex';
            showDataSourceBadge();
            btn.innerHTML = '✨ 已抽牌 — 点击牌面翻开';
        }, 900);
    }

    // ===== 洗牌动画 =====
    function showShuffleAnimation() {
        var stage = document.getElementById('cardsStage');
        var html = '<div class="shuffling" style="display:flex;gap:1.2rem;justify-content:center;">';
        for (var i = 0; i < 3; i++) {
            var delay = (i * 0.18) + 's';
            html +=
                '<div class="tarot-card-container" style="animation-delay:' + delay + '">' +
                '<div class="tarot-card-inner">' +
                '<div class="tarot-card-front">' +
                '<div class="card-front-inner">' +
                '<span class="mystic-symbol">🂠</span>' +
                '</div>' +
                '</div>' +
                '</div>' +
                '</div>';
        }
        html += '</div>';
        stage.innerHTML = html;
    }

    // ===== 渲染牌面（背面朝上，等待点击翻转） =====
    function renderCardStage() {
        var stage = document.getElementById('cardsStage');
        var html = '';

        for (var i = 0; i < STATE.cards.length; i++) {
            var card = STATE.cards[i];
            var flipped = STATE.flipped[i];
            var dir = STATE.directions[i];
            var dirLabel = dir === 1 ? '正位 ↑' : '逆位 ↓';

            html +=
                '<div class="tarot-card-container" id="cardContainer' + i + '" onclick="handleFlip(' + i + ')">' +
                '<div class="tarot-card-inner' + (flipped ? ' flipped' : '') + '" id="cardInner' + i + '">' +
                // 正面（背面朝外，用户看到的初始面）
                '<div class="tarot-card-front">' +
                '<div class="card-front-inner">' +
                '<span class="mystic-symbol">⭐🌙</span>' +
                '<span class="flip-text">点击翻开</span>' +
                '</div>' +
                '<span class="card-position-label">' + POSITIONS[i] + '</span>' +
                '</div>' +
                // 背面（翻转后的牌面信息）
                '<div class="tarot-card-back">' +
                '<div class="card-name">' + escHtml(card.name) + '</div>' +
                '<span class="card-type-tag">' + escHtml(card.type || '') + '</span>' +
                '<span class="card-direction">' + dirLabel + '</span>' +
                '</div>' +
                '</div>' +
                '</div>';
        }
        stage.innerHTML = html;
    }

    // ===== 翻转单张牌 =====
    function handleFlip(index) {
        if (STATE.flipped[index]) return;

        STATE.flipped[index] = true;
        var inner = document.getElementById('cardInner' + index);
        if (inner) {
            inner.classList.add('flipped');
        }

        // 检测是否全部翻开
        var allDone = STATE.flipped.every(function(v) { return v; });
        if (allDone) {
            setTimeout(function() {
                renderReading();
            }, 900);
        }
    }

    // ===== 渲染解读区 =====
    function renderReading() {
        var mode = ModeToggle.getMode();
        var section = document.getElementById('readingSection');

        if (mode === 'simple') {
            var simpleHtml = '<div class="beginner-result">';
            simpleHtml += '<div class="beginner-card"><h3>塔罗牌占卜结果</h3><p>您抽取了三张塔罗牌：' + STATE.cards.map(function(c) { return c.name; }).join('、') + '</p>';
            simpleHtml += '<p>请切换到专业模式查看详细牌义解读。</p>';
            simpleHtml += '</div></div>';
            section.innerHTML = simpleHtml;
            section.scrollIntoView({ behavior: 'smooth', block: 'start' });
            return;
        }

        var html = '<div class="reading-cards fade-in">';

        for (var i = 0; i < STATE.cards.length; i++) {
            var card = STATE.cards[i];
            var dir = STATE.directions[i];
            var isUp = dir === 1;
            var meaning = isUp ? (card.meaning_up || '暂无正位释义') : (card.meaning_rev || '暂无逆位释义');
            var meaningLabel = isUp ? '☀ 正位含义' : '🌙 逆位含义';

            html +=
                '<div class="reading-card" id="readingCard' + i + '">' +
                '<div class="card-header-row">' +
                '<span class="pos-label">' + POSITIONS[i] + '</span>' +
                '<span class="card-title">' + escHtml(card.name) + '</span>' +
                '<span class="card-type">' + escHtml(card.type || '') + '</span>' +
                '</div>' +
                '<div class="toggle-dir">' +
                '<button id="btnUp' + i + '" class="' + (isUp ? 'active' : '') + '" onclick="switchDir(' + i + ', 1)">正位</button>' +
                '<button id="btnRev' + i + '" class="' + (isUp ? '' : 'active') + '" onclick="switchDir(' + i + ', -1)">逆位</button>' +
                '</div>' +
                '<div class="meaning-label" id="meaningLabel' + i + '">' + meaningLabel + '</div>' +
                '<div class="meaning-text" id="meaningText' + i + '">' + escHtml(meaning) + '</div>' +
                (card.desc ? '<div class="desc-text">' + escHtml(card.desc) + '</div>' : '') +
                '</div>';
        }
        html += '</div>';

        // 综合解读
        html +=
            '<div class="overall-reading fade-in">' +
            '<h3>🔮 综合解读</h3>' +
            '<p>三张牌分别代表你的<b>过去</b>、<b>现在</b>与<b>未来</b>。' +
            '<br>过去的「' + escHtml(STATE.cards[0].name) + '」揭示了你经历过的课题；' +
            '现在的「' + escHtml(STATE.cards[1].name) + '」映照你当下的状态；' +
            '未来的「' + escHtml(STATE.cards[2].name) + '」则指引前行方向。' +
            '<br>请结合各牌释义及正逆位，静心感悟命运传递的信息。</p>' +
            '</div>';

        section.innerHTML = html;
        section.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ===== 正位/逆位切换 =====
    function switchDir(index, dir) {
        STATE.directions[index] = dir;
        var card = STATE.cards[index];
        var isUp = dir === 1;
        var meaning = isUp ? (card.meaning_up || '暂无正位释义') : (card.meaning_rev || '暂无逆位释义');

        // 按钮
        var btnUp = document.getElementById('btnUp' + index);
        var btnRev = document.getElementById('btnRev' + index);
        if (btnUp) btnUp.className = isUp ? 'active' : '';
        if (btnRev) btnRev.className = isUp ? '' : 'active';

        // 含义标签
        var label = document.getElementById('meaningLabel' + index);
        if (label) label.innerHTML = isUp ? '☀ 正位含义' : '🌙 逆位含义';

        // 含义文本
        var text = document.getElementById('meaningText' + index);
        if (text) text.textContent = meaning;
    }

    // ===== 重新抽牌 =====
    function handleRedraw() {
        STATE.cards = [];
        STATE.flipped = [false, false, false];
        STATE.directions = [1, 1, 1];

        document.getElementById('cardsStage').innerHTML = '';
        document.getElementById('readingSection').innerHTML = '';
        document.getElementById('actionsRow').style.display = 'none';
        document.getElementById('dataSourceBadge').style.display = 'none';

        var btn = document.getElementById('btnDraw');
        btn.disabled = false;
        btn.innerHTML = '🔮 开始抽牌';

        handleDraw();
    }

    // ===== 错误状态 =====
    function showError(msg) {
        document.getElementById('cardsStage').innerHTML = '';
        document.getElementById('readingSection').innerHTML =
            '<div class="error-state">' +
            '<div class="err-icon">⚠️</div>' +
            '<p class="err-msg">' + escHtml(msg || '数据获取失败') + '</p>' +
            '<button onclick="handleDraw()">🔄 重试</button>' +
            '</div>';
    }

    // ===== 数据来源标识 =====
    function showDataSourceBadge() {
        var badge = document.getElementById('dataSourceBadge');
        var map = {
            'realtime': { dot: 'realtime', label: '实时联网数据' },
            'cached':   { dot: 'cached',   label: '缓存数据' },
            'local':    { dot: 'local',    label: '服务器计算' }
        };
        var info = map[STATE.metaSource] || map['local'];
        badge.innerHTML =
            '<span class="badge-dot ' + info.dot + '"></span>' +
            '<span class="badge-text">' + info.label + ' · <span class="live-time-placeholder" data-server-time="' + (STATE.meta && STATE.meta.generated_at ? STATE.meta.generated_at : '') + '"></span></span>';
        badge.style.display = 'block';
        activateLiveClocks(badge);

        // 同步使用 showDataBadge (fortune-api.js)
        if (window.showDataBadge) {
            window.showDataBadge(STATE.metaSource, 'dataSourceBadge');
        }
    }

    // ===== HTML 转义 =====
    function escHtml(str) {
        if (!str) return '';
        var d = document.createElement('div');
        d.appendChild(document.createTextNode(str));
        return d.innerHTML;
    }

    // ===== 全局导出 =====
    window.handleDraw = handleDraw;
    window.handleFlip = handleFlip;
    window.switchDir = switchDir;
    window.handleRedraw = handleRedraw;
    </script>
</body>
</html>
