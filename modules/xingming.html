<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#e8b84b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="玄机算命">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="msapplication-TileImage" content="/icon-192.png">
<meta name="msapplication-TileColor" content="#e8b84b">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>姓名测试 - 玄机算命网</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/mode-toggle.css">
    <style>
        .page-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: linear-gradient(180deg, rgba(10,14,31,0.98), rgba(16,24,40,0.95));
            border-bottom: 1px solid rgba(232,184,75,0.15);
        }
        .page-header h1 {
            font-size: 1.2rem;
            color: #e8b84b;
            font-weight: 600;
        }
        .back-btn {
            background: none;
            border: none;
            color: #e8b84b;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.5rem;
        }
        .content-area {
            padding: 1rem;
            padding-bottom: 80px;
        }
        .form-container {
            max-width: 500px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-label {
            display: block;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.9);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        .form-input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            border: 1px solid rgba(232,184,75,0.2);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-input:focus {
            border-color: rgba(232,184,75,0.5);
            background: rgba(255,255,255,0.08);
        }
        .submit-btn {
            width: 100%;
            padding: 1rem;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #e8b84b, #f0d78c);
            color: #000;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: transform 0.2s;
        }
        .submit-btn:hover {
            transform: scale(1.02);
        }
        .result-container {
            max-width: 600px;
            margin: 0 auto;
        }
        .wuge-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }
        .wuge-table th,
        .wuge-table td {
            padding: 0.8rem;
            text-align: center;
            border: 1px solid rgba(232,184,75,0.2);
        }
        .wuge-table th {
            background: rgba(232,184,75,0.1);
            color: #e8b84b;
            font-weight: 600;
        }
        .wuge-table td {
            color: rgba(255,255,255,0.9);
        }
        .score-display {
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, rgba(232,184,75,0.1), rgba(232,184,75,0.03));
            border-radius: 12px;
            margin: 1rem 0;
        }
        .score-number {
            font-size: 3rem;
            font-weight: 700;
            color: #e8b84b;
            margin-bottom: 0.5rem;
        }
        .score-text {
            font-size: 1rem;
            color: rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="app">
        <div class="page-header">
            <button type="button" class="back-btn" onclick="history.back()">←</button>
            <h1>📝 姓名测试</h1>
        </div>

        <div class="content-area">
                    <div style="margin-bottom:1rem;">
            <button type="button" class="submit-btn" style="width:auto;padding:0.8rem 1.5rem;font-size:0.9rem;" onclick="triggerImageUpload('xingming')">📷 上传图片分析</button>
        </div>
<div class="section">
                <h2>五格剖象法</h2>
                <p style="color: rgba(255,255,255,0.7); font-size: 0.85rem; line-height: 1.8; margin-bottom: 1rem;">
                    姓名测试采用传统的"五格剖象法"，通过分析姓名的三才配置、五格数理，
                    来判断姓名的吉凶和运势影响。
                </p>
            </div>

            <div class="form-container" id="formArea">
                <div class="form-group">
                    <label class="form-label">请输入姓名</label>
                    <input type="text" class="form-input" id="nameInput" placeholder="例如：张三" maxlength="4">
                </div>
                
                <!-- 专业/初学模式切换 -->
                <div class="mode-toggle-wrapper" style="max-width:500px;margin:0.8rem auto;">
                    <span class="mode-toggle-label">排盘模式</span>
                    <div class="mode-toggle-pill">
                        <div class="mode-toggle-option active" data-mode="pro">专业模式</div>
                        <div class="mode-toggle-option" data-mode="simple">新手模式</div>
                    </div>
                </div>
                
                <button type="button" class="submit-btn" onclick="analyzeName()">开始测试</button>
            </div>

            <div class="result-container" id="resultArea" style="display: none;">
                <!-- 结果将动态生成 -->
            </div>
        </div>
    </div>

    <script src="/js/main.js"></script>
<script>
// 显示提示
function showToast(msg) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(232,184,75,0.9);color:#000;padding:0.8rem 1.5rem;border-radius:8px;z-index:9999;font-size:0.9rem;';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

// 触发图片上传
function triggerImageUpload(moduleType) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = function() {
        const file = this.files[0];
        if (!file) return;
        window.showToast('正在分析图片...');
        window.compressImageFortune(file, 800, 800, 0.8).then(function(base64) {
            fetch('/api/image-analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: base64, module_type: moduleType })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    window.showToast('分析完成！');
                    const area = document.getElementById('imageAnalysisArea');
                    const result = document.getElementById('imageAnalysisResult');
                    if (area) area.style.display = 'block';
                    if (result) result.textContent = data.analysis;
                } else {
                    window.showToast('分析失败：' + (data.message || '未知错误'));
                }
            })
            .catch(err => {
                window.showToast('分析失败，请检查网络');
                console.error('图片分析错误：', err);
            });
        }).catch(function(err) {
            window.showToast('图片处理失败');
        });
    };
    input.click();
}
</script>
    <script src="/js/fortune-api.js"></script>
    <script src="/js/mode-toggle.js"></script>
    <script>
        // ===== 本地降级算法 =====
        function localAnalyzeName(name) {
            var strokes = [];
            for (var i = 0; i < name.length; i++) {
                strokes.push((name.charCodeAt(i) % 30) + 1);
            }
            
            var tiange = strokes.length > 0 ? strokes[0] + 1 : 1;
            var renge = strokes.length > 1 ? strokes[0] + strokes[1] : strokes[0] || 1;
            var dige = strokes.length > 1 ? strokes[1] + 1 : strokes[0] || 1;
            var waige = strokes.length > 1 ? strokes[strokes.length - 1] + 1 : strokes[0] || 1;
            var zongge = strokes.reduce(function(a, b) { return a + b; }, 0);
            
            var total = tiange + renge + dige + waige + zongge;
            var score = Math.min(95, Math.max(50, Math.floor((total / 5) * 2)));
            var label = score >= 90 ? '大吉' : score >= 80 ? '吉' : score >= 70 ? '中吉' : '一般';
            
            return {
                data: {
                    name: name,
                    strokes: {},
                    grids: {},
                    tiange: tiange, renge: renge, dige: dige, waige: waige, zongge: zongge,
                    tiange_jx: '平', renge_jx: '平', dige_jx: '平', waige_jx: '平', zongge_jx: '平',
                    tiange_wx: '—', renge_wx: '—', dige_wx: '—', waige_wx: '—', zongge_wx: '—',
                    score: score,
                    score_label: label,
                    summary: '此结果为本地简化算法计算结果，仅供参考。',
                    analysis: '（本地离线模式）\n五格笔画分别为：天格' + tiange + '、人格' + renge + '、地格' + dige + '、外格' + waige + '、总格' + zongge + '。\n\n此为本地降级算法的粗略估算，准确度有限。如需精确姓名分析，请连接网络后重试。',
                    sancai: {},
                    wuxing_balance: [],
                    name_meanings: [],
                    career: '（本地模式无法提供详细事业分析，请联网重试）',
                    relationships: '（本地模式无法提供详细人际分析，请联网重试）',
                    health: '（本地模式无法提供详细健康分析，请联网重试）',
                    advice: '如需精确分析，请确保网络连接后重试联网版本。'
                },
                meta: { source: 'local_fallback' }
            };
        }

        // ===== 吉凶判断辅助 =====
        function getJixiong(val) {
            if (!val && val !== 0) return '—';
            const lucky = [1,3,5,6,7,8,11,13,15,16,17,18,21,23,24,25,29,31,32,33,35,37,39,41,45,47,48,52,57,61,63,65,67,68,81];
            return lucky.includes(val) ? '吉' : '凶';
        }

        async function analyzeName() {
            const name = document.getElementById('nameInput').value.trim();
            
            if (!name) {
                window.showToast('请输入姓名');
                return;
            }

            // 调用后端 API
            const response = await fortuneAPI('xingming', {name: name}, {
                showLoading: true,
                loadingMsg: '正在联网分析姓名数据...'
            });

            if (response && response.success) {
                showResult(response.data, response.meta);
            } else {
                // API 失败，显示错误状态并提供降级
                document.getElementById('formArea').style.display = 'none';
                document.getElementById('resultArea').style.display = 'block';

                const retryFn = function() {
                    document.getElementById('formArea').style.display = 'block';
                    document.getElementById('resultArea').style.display = 'none';
                    analyzeName();
                };
                const fallbackFn = function() {
                    const fallbackResult = localAnalyzeName(name);
                    showResult(fallbackResult.data, fallbackResult.meta);
                };

                showFortuneError('resultArea', '大数据分析服务暂时不可用，请重试或使用本地计算', retryFn, fallbackFn);
            }
        }

        function showResult(data, meta) {
            var mode = ModeToggle.getMode();
            if (mode === 'simple') {
                var simpleHtml = '<div class="beginner-result">';
                simpleHtml += '<div class="beginner-card"><h3>📝 ' + data.name + ' 分析结果</h3>';
                simpleHtml += '<p style="font-size:2rem;font-weight:bold;color:#e8b84b;margin:0.5rem 0;">' + (data.score || '--') + '分</p>';
                simpleHtml += '<p>' + (data.summary || '分析完成，切换到专业模式可查看完整详情。') + '</p>';
                simpleHtml += '</div></div>';
                document.getElementById('formArea').style.display = 'none';
                document.getElementById('resultArea').innerHTML = simpleHtml;
                document.getElementById('resultArea').style.display = 'block';
                if (meta && meta.source) showDataBadge(meta.source, 'resultArea', meta);
                return;
            }

            var score = data.score || 0;
            var scoreLabel = data.score_label || (score >= 90 ? '大吉' : score >= 80 ? '吉' : score >= 70 ? '中吉' : '一般');
            var grids = data.grids || {};
            var sancai = data.sancai || {};

            // 五格数据：优先使用扁平字段，其次从grids中提取
            var getGridNum = function(gname) {
                if (grids[gname] && grids[gname].num) return grids[gname].num;
                return data[gname.toLowerCase().replace('格','ge')] || '—';
            };
            var getGridJX = function(gname) {
                if (grids[gname] && grids[gname].jixiong) return grids[gname].jixiong[0];
                return data[gname.toLowerCase().replace('格','ge') + '_jx'] || '—';
            };
            var getGridWX = function(gname) {
                if (grids[gname] && grids[gname].wuxing) return grids[gname].wuxing;
                return data[gname.toLowerCase().replace('格','ge') + '_wx'] || '—';
            };

            var jxColor = function(jx) {
                if (jx === '大吉') return '#00e676';
                if (jx === '吉') return '#76ff03';
                if (jx === '凶') return '#ff5252';
                if (jx === '大凶') return '#ff1744';
                return '#ffd740';
            };

            var html = '<div class="section fade-in" style="text-align:center;"><h3 style="font-size:1.5rem;color:#e8b84b;">📝 ' + data.name + '</h3></div>';

            // 综合评分
            html += '<div class="score-display fade-in">';
            html += '<div class="score-number" style="color:' + (score >= 80 ? '#e8b84b' : score >= 60 ? '#ffd740' : '#ff5252') + ';">' + score + '分</div>';
            html += '<div class="score-text" style="color:' + jxColor(scoreLabel) + ';">' + scoreLabel + '</div>';
            if (data.summary) {
                html += '<p style="font-size:0.8rem;color:rgba(255,255,255,0.6);margin-top:0.5rem;">' + data.summary + '</p>';
            }
            html += '</div>';

            // 五格数理表
            html += '<div class="section fade-in">';
            html += '<h3>📊 五格数理</h3>';
            html += '<table class="wuge-table">';
            html += '<tr><th>格局</th><th>数理</th><th>五行</th><th>吉凶</th><th>含义</th></tr>';

            var gridOrder = ['天格', '人格', '地格', '外格', '总格'];
            for (var i = 0; i < gridOrder.length; i++) {
                var gn = gridOrder[i];
                var num = getGridNum(gn);
                var wx = getGridWX(gn);
                var jx = getGridJX(gn);
                var gd = grids[gn];
                var desc = (gd && gd.desc) ? gd.desc : '';
                html += '<tr>';
                html += '<td style="color:#e8b84b;font-weight:600;">' + gn + '</td>';
                html += '<td>' + num + '</td>';
                html += '<td style="color:rgba(255,255,255,0.7);">' + wx + '</td>';
                html += '<td style="color:' + jxColor(jx) + ';font-weight:600;">' + jx + '</td>';
                html += '<td style="font-size:0.75rem;color:rgba(255,255,255,0.55);text-align:left;">' + desc.replace(/^[^，]+，/, '') + '</td>';
                html += '</tr>';
            }
            html += '</table></div>';

            // 三才配置
            if (sancai.config) {
                html += '<div class="section fade-in">';
                html += '<h3>⚖️ 三才配置</h3>';
                html += '<div style="background:rgba(232,184,75,0.04);border:1px solid rgba(232,184,75,0.12);border-radius:10px;padding:1rem;">';
                html += '<p style="font-size:1rem;margin-bottom:0.5rem;"><strong>配置：</strong><span style="color:#e8b84b;">' + sancai.config + '</span> — <span style="color:' + jxColor(sancai.result) + ';">' + (sancai.result || '—') + '</span></p>';
                if (sancai.desc) {
                    html += '<p style="font-size:0.85rem;color:rgba(255,255,255,0.75);line-height:1.8;">' + sancai.desc + '</p>';
                }
                html += '</div></div>';
            }

            // 五行分布
            if (data.wuxing_balance && data.wuxing_balance.length) {
                html += '<div class="section fade-in">';
                html += '<h3>🌿 五行分布</h3>';
                html += '<div style="display:flex;gap:0.5rem;flex-wrap:wrap;justify-content:center;">';
                var wxColors = {'木': '#4caf50', '火': '#f44336', '土': '#ff9800', '金': '#e8b84b', '水': '#2196f3'};
                for (var w = 0; w < data.wuxing_balance.length; w++) {
                    var item = data.wuxing_balance[w];
                    var wxName = item.charAt(0);
                    var isBad = item.indexOf('缺失') >= 0 || item.indexOf('过旺') >= 0;
                    html += '<span style="display:inline-block;padding:0.4rem 0.8rem;border-radius:20px;font-size:0.8rem;';
                    html += 'background:' + (wxColors[wxName] || '#555') + '33;';
                    html += 'border:1px solid ' + (wxColors[wxName] || '#555') + '55;';
                    html += 'color:' + (isBad ? '#ff8a80' : '#fff') + ';">' + item + '</span>';
                }
                html += '</div></div>';
            }

            // 字义解析
            if (data.name_meanings && data.name_meanings.length) {
                html += '<div class="section fade-in">';
                html += '<h3>📖 字义解析</h3>';
                for (var n = 0; n < data.name_meanings.length; n++) {
                    html += '<p style="font-size:0.85rem;color:rgba(255,255,255,0.75);line-height:1.8;padding:0.5rem 0;border-bottom:1px solid rgba(255,255,255,0.05);">' + data.name_meanings[n] + '</p>';
                }
                html += '</div>';
            }

            // 综合分析
            if (data.analysis) {
                var analysisLines = data.analysis.split('\n');
                html += '<div class="section fade-in">';
                html += '<h3>💡 综合分析</h3>';
                html += '<div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:1.2rem;">';
                html += '<pre style="white-space:pre-wrap;font-family:inherit;font-size:0.85rem;color:rgba(255,255,255,0.8);line-height:1.9;margin:0;">' + data.analysis + '</pre>';
                html += '</div></div>';
            }

            // 事业/健康/社交/建议
            var extraCards = '';
            if (data.career) {
                extraCards += '<div style="background:rgba(33,150,243,0.06);border:1px solid rgba(33,150,243,0.15);border-radius:10px;padding:0.8rem 1rem;flex:1;min-width:200px;">';
                extraCards += '<h4 style="color:#42a5f5;margin-bottom:0.4rem;font-size:0.85rem;">💼 事业运势</h4>';
                extraCards += '<p style="font-size:0.8rem;color:rgba(255,255,255,0.7);line-height:1.7;">' + data.career + '</p></div>';
            }
            if (data.relationships) {
                extraCards += '<div style="background:rgba(156,39,176,0.06);border:1px solid rgba(156,39,176,0.15);border-radius:10px;padding:0.8rem 1rem;flex:1;min-width:200px;">';
                extraCards += '<h4 style="color:#ab47bc;margin-bottom:0.4rem;font-size:0.85rem;">🤝 人际关系</h4>';
                extraCards += '<p style="font-size:0.8rem;color:rgba(255,255,255,0.7);line-height:1.7;">' + data.relationships + '</p></div>';
            }
            if (data.health) {
                extraCards += '<div style="background:rgba(76,175,80,0.06);border:1px solid rgba(76,175,80,0.15);border-radius:10px;padding:0.8rem 1rem;flex:1;min-width:200px;">';
                extraCards += '<h4 style="color:#66bb6a;margin-bottom:0.4rem;font-size:0.85rem;">🏥 健康提示</h4>';
                extraCards += '<p style="font-size:0.8rem;color:rgba(255,255,255,0.7);line-height:1.7;">' + data.health + '</p></div>';
            }
            if (data.advice) {
                extraCards += '<div style="background:rgba(255,152,0,0.06);border:1px solid rgba(255,152,0,0.15);border-radius:10px;padding:0.8rem 1rem;flex:1;min-width:200px;">';
                extraCards += '<h4 style="color:#ffa726;margin-bottom:0.4rem;font-size:0.85rem;">🌟 改善建议</h4>';
                extraCards += '<p style="font-size:0.8rem;color:rgba(255,255,255,0.7);line-height:1.7;">' + data.advice + '</p></div>';
            }
            if (extraCards) {
                html += '<div class="section fade-in"><div style="display:flex;flex-wrap:wrap;gap:0.8rem;">' + extraCards + '</div></div>';
            }

            // 重新测试按钮
            html += '<div style="text-align: center; margin-top: 2rem; margin-bottom: 2rem;">';
            html += '<button type="button" class="submit-btn" style="display: inline-block; width: auto; padding: 0.8rem 2rem;" onclick="resetForm()">🔄 重新测试</button>';
            html += '</div>';

            document.getElementById('formArea').style.display = 'none';
            document.getElementById('resultArea').innerHTML = html;
            document.getElementById('resultArea').style.display = 'block';

            // 显示数据来源标识
            if (meta && meta.source) {
                showDataBadge(meta.source, 'resultArea', meta);
            }
        }

        function resetForm() {
            document.getElementById('formArea').style.display = 'block';
            document.getElementById('resultArea').style.display = 'none';
            document.getElementById('nameInput').value = '';
        }

        document.addEventListener('DOMContentLoaded', function() {
            createStars();
            ModeToggle.injectUI(
                document.querySelector('.mode-toggle-wrapper') || document.body,
                { label: '排盘模式', proLabel: '专业模式', simpleLabel: '新手模式' }
            );
        });
    </script>
</body>
</html>
