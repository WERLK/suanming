<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffd700">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="玄机算命">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="msapplication-TileImage" content="/icon-192.png">
<meta name="msapplication-TileColor" content="#ffd700">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>姓名测试 - 玄机算命网</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/mode-toggle.css">
    <style>
        .page-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: linear-gradient(180deg, rgba(15,12,41,0.98), rgba(26,26,46,0.95));
            border-bottom: 1px solid rgba(255,215,0,0.15);
        }
        .page-header h1 {
            font-size: 1.2rem;
            color: #ffd700;
            font-weight: 600;
        }
        .back-btn {
            background: none;
            border: none;
            color: #ffd700;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.5rem;
        }
        .content-area {
            padding: 1rem;
            padding-bottom: 80px;
        }
        .form-container {
            max-width: 500px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-label {
            display: block;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.9);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        .form-input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            border: 1px solid rgba(255,215,0,0.2);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-input:focus {
            border-color: rgba(255,215,0,0.5);
            background: rgba(255,255,255,0.08);
        }
        .submit-btn {
            width: 100%;
            padding: 1rem;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #000;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: transform 0.2s;
        }
        .submit-btn:hover {
            transform: scale(1.02);
        }
        .result-container {
            max-width: 600px;
            margin: 0 auto;
        }
        .wuge-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }
        .wuge-table th,
        .wuge-table td {
            padding: 0.8rem;
            text-align: center;
            border: 1px solid rgba(255,215,0,0.2);
        }
        .wuge-table th {
            background: rgba(255,215,0,0.1);
            color: #ffd700;
            font-weight: 600;
        }
        .wuge-table td {
            color: rgba(255,255,255,0.9);
        }
        .score-display {
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, rgba(255,215,0,0.1), rgba(255,215,0,0.03));
            border-radius: 12px;
            margin: 1rem 0;
        }
        .score-number {
            font-size: 3rem;
            font-weight: 700;
            color: #ffd700;
            margin-bottom: 0.5rem;
        }
        .score-text {
            font-size: 1rem;
            color: rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="app">
        <div class="page-header">
            <button type="button" class="back-btn" onclick="history.back()">←</button>
            <h1>📝 姓名测试</h1>
        </div>

        <div class="content-area">
                    <div style="margin-bottom:1rem;">
            <button type="button" class="submit-btn" style="width:auto;padding:0.8rem 1.5rem;font-size:0.9rem;" onclick="triggerImageUpload('xingming')">📷 上传图片分析</button>
        </div>
<div class="section">
                <h2>五格剖象法</h2>
                <p style="color: rgba(255,255,255,0.7); font-size: 0.85rem; line-height: 1.8; margin-bottom: 1rem;">
                    姓名测试采用传统的"五格剖象法"，通过分析姓名的三才配置、五格数理，
                    来判断姓名的吉凶和运势影响。
                </p>
            </div>

            <div class="form-container" id="formArea">
                <div class="form-group">
                    <label class="form-label">请输入姓名</label>
                    <input type="text" class="form-input" id="nameInput" placeholder="例如：张三" maxlength="4">
                </div>
                
                <!-- 专业/初学模式切换 -->
                <div class="mode-toggle-wrapper" style="max-width:500px;margin:0.8rem auto;">
                    <span class="mode-toggle-label">排盘模式</span>
                    <div class="mode-toggle-pill">
                        <div class="mode-toggle-option active" data-mode="pro">专业模式</div>
                        <div class="mode-toggle-option" data-mode="simple">新手模式</div>
                    </div>
                </div>
                
                <button type="button" class="submit-btn" onclick="analyzeName()">开始测试</button>
            </div>

            <div class="result-container" id="resultArea" style="display: none;">
                <!-- 结果将动态生成 -->
            </div>
        </div>
    </div>

    <script src="/js/main.js"></script>
<script>
// 显示提示
function showToast(msg) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(255,215,0,0.9);color:#000;padding:0.8rem 1.5rem;border-radius:8px;z-index:9999;font-size:0.9rem;';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

// 触发图片上传
function triggerImageUpload(moduleType) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = function() {
        const file = this.files[0];
        if (!file) return;
        window.showToast('正在分析图片...');
        const reader = new FileReader();
        reader.onload = function(e) {
            const base64 = e.target.result;
            fetch('/api/image-analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: base64, module_type: moduleType })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    window.showToast('分析完成！');
                    const area = document.getElementById('imageAnalysisArea');
                    const result = document.getElementById('imageAnalysisResult');
                    if (area) area.style.display = 'block';
                    if (result) result.textContent = data.analysis;
                } else {
                    window.showToast('分析失败：' + (data.message || '未知错误'));
                }
            })
            .catch(err => {
                window.showToast('分析失败，请检查网络');
                console.error('图片分析错误：', err);
            });
        };
        reader.readAsDataURL(file);
    };
    input.click();
}
</script>
    <script src="/js/fortune-api.js"></script>
    <script src="/js/mode-toggle.js"></script>
    <script>
        // ===== 本地降级算法 =====
        function localAnalyzeName(name) {
            const strokes = [];
            for (let i = 0; i < name.length; i++) {
                strokes.push((name.charCodeAt(i) % 30) + 1);
            }
            
            const tiange = strokes.length > 0 ? strokes[0] + 1 : 1;
            const renge = strokes.length > 1 ? strokes[0] + strokes[1] : strokes[0] || 1;
            const dige = strokes.length > 1 ? strokes[1] + 1 : strokes[0] || 1;
            const waige = strokes.length > 1 ? strokes[strokes.length - 1] + 1 : strokes[0] || 1;
            const zongge = strokes.reduce((a, b) => a + b, 0);
            
            const total = tiange + renge + dige + waige + zongge;
            const score = Math.min(95, Math.max(50, Math.floor((total / 5) * 2)));
            const label = score >= 90 ? '大吉' : score >= 80 ? '吉' : score >= 70 ? '中吉' : '一般';
            
            return {
                data: {
                    name: name,
                    strokes: strokes,
                    grids: { tiange, renge, dige, waige, zongge },
                    score: score,
                    summary: '三才配置' + label + '（本地简化计算）',
                    analysis: '此结果为本地简化算法通过五格剖象法计算，仅供参考。如需精确分析，请检查网络后重试联网版本。'
                },
                meta: { source: 'local_fallback' }
            };
        }

        // ===== 吉凶判断辅助 =====
        function getJixiong(val) {
            if (!val && val !== 0) return '—';
            const lucky = [1,3,5,6,7,8,11,13,15,16,17,18,21,23,24,25,29,31,32,33,35,37,39,41,45,47,48,52,57,61,63,65,67,68,81];
            return lucky.includes(val) ? '吉' : '凶';
        }

        async function analyzeName() {
            const name = document.getElementById('nameInput').value.trim();
            
            if (!name) {
                window.showToast('请输入姓名');
                return;
            }

            // 调用后端 API
            const response = await fortuneAPI('xingming', {name: name}, {
                showLoading: true,
                loadingMsg: '正在联网分析姓名数据...'
            });

            if (response && response.success) {
                showResult(response.data, response.meta);
            } else {
                // API 失败，显示错误状态并提供降级
                document.getElementById('formArea').style.display = 'none';
                document.getElementById('resultArea').style.display = 'block';

                const retryFn = function() {
                    document.getElementById('formArea').style.display = 'block';
                    document.getElementById('resultArea').style.display = 'none';
                    analyzeName();
                };
                const fallbackFn = function() {
                    const fallbackResult = localAnalyzeName(name);
                    showResult(fallbackResult.data, fallbackResult.meta);
                };

                showFortuneError('resultArea', '大数据分析服务暂时不可用，请重试或使用本地计算', retryFn, fallbackFn);
            }
        }

        function showResult(data, meta) {
            var mode = ModeToggle.getMode();
            if (mode === 'simple') {
                var simpleHtml = '<div class="beginner-result">';
                simpleHtml += '<div class="beginner-card"><h3>分析结果</h3><p>' + (data.summary || data.prediction || '分析完成，切换到专业模式可查看完整详情。') + '</p></div>';
                simpleHtml += '</div>';
                document.getElementById('formArea').style.display = 'none';
                document.getElementById('resultArea').innerHTML = simpleHtml;
                document.getElementById('resultArea').style.display = 'block';
                return;
            }
            const score = data.score || 0;
            const scoreLabel = score >= 90 ? '大吉' : score >= 80 ? '吉' : score >= 70 ? '中吉' : '一般';
            const grids = data.grids || {};
            
            let html = `
                <div class="section fade-in">
                    <h3>📝 姓名：${data.name}</h3>
                </div>

                <div class="score-display fade-in">
                    <div class="score-number">${score}分</div>
                    <div class="score-text">${scoreLabel}</div>
                </div>

                <div class="section fade-in">
                    <h3>📊 五格数理</h3>
                    <table class="wuge-table">
                        <tr>
                            <th>格局</th>
                            <th>数理</th>
                            <th>吉凶</th>
                        </tr>
                        <tr>
                            <td>天格</td>
                            <td>${grids.tiange || '—'}</td>
                            <td>${getJixiong(grids.tiange)}</td>
                        </tr>
                        <tr>
                            <td>人格</td>
                            <td>${grids.renge || '—'}</td>
                            <td>${getJixiong(grids.renge)}</td>
                        </tr>
                        <tr>
                            <td>地格</td>
                            <td>${grids.dige || '—'}</td>
                            <td>${getJixiong(grids.dige)}</td>
                        </tr>
                        <tr>
                            <td>外格</td>
                            <td>${grids.waige || '—'}</td>
                            <td>${getJixiong(grids.waige)}</td>
                        </tr>
                        <tr>
                            <td>总格</td>
                            <td>${grids.zongge || '—'}</td>
                            <td>${getJixiong(grids.zongge)}</td>
                        </tr>
                    </table>
                </div>

                <div class="section fade-in">
                    <h3>⚖️ 三才配置</h3>
                    <p style="font-size: 0.9rem; color: rgba(255,255,255,0.8); line-height: 1.8;">
                        ${data.summary || '暂无三才配置信息'}
                    </p>
                </div>

                <div class="section fade-in">
                    <h3>💡 综合分析</h3>
                    <p style="font-size: 0.85rem; color: rgba(255,255,255,0.8); line-height: 1.8;">
                        ${data.analysis || '暂无分析结果'}
                    </p>
                </div>

                <div style="text-align: center; margin-top: 2rem; margin-bottom: 2rem;">
                    <button type="button" class="submit-btn" style="display: inline-block; width: auto; padding: 0.8rem 2rem;" onclick="resetForm()">重新测试</button>
                </div>
            `;

            document.getElementById('formArea').style.display = 'none';
            document.getElementById('resultArea').innerHTML = html;
            document.getElementById('resultArea').style.display = 'block';

            // 显示数据来源标识
            if (meta && meta.source) {
                showDataBadge(meta.source, 'resultArea');
            }
        }

        function resetForm() {
            document.getElementById('formArea').style.display = 'block';
            document.getElementById('resultArea').style.display = 'none';
            document.getElementById('nameInput').value = '';
        }

        document.addEventListener('DOMContentLoaded', function() {
            createStars();
            ModeToggle.injectUI(
                document.querySelector('.mode-toggle-wrapper') || document.body,
                { label: '排盘模式', proLabel: '专业模式', simpleLabel: '新手模式' }
            );
        });
    </script>
</body>
</html>
