<script>
// ===== 标签页切换 =====
function switchTab(tabName, btnElement) {
    const tabBtns = document.querySelectorAll('.tab-btn');
    tabBtns.forEach(btn => btn.classList.remove('active'));
    if (btnElement) {
        btnElement.classList.add('active');
    } else {
        const targetBtn = document.querySelector('.tab-btn[data-tab="' + tabName + '"]');
        if (targetBtn) targetBtn.classList.add('active');
    }
    const tabContents = document.querySelectorAll('.tab-content');
    tabContents.forEach(content => content.classList.remove('active'));
    const targetTab = document.getElementById(tabName + 'Tab');
    if (targetTab) targetTab.classList.add('active');
}

// ===== 十四主星列表 =====
const ZIWEI_MAJOR_STARS = [
    '紫微','天机','太阳','武曲','天同','廉贞',
    '天府','太阴','贪狼','巨门','天相','天梁','七杀','破军'
];

// 四化映射（简化：按年干决定哪颗星化禄/权/科/忌）
const HUA_MAP = {
    '甲': {禄:'廉贞',权:'破军',科:'武曲',忌:'太阳'},
    '乙': {禄:'天机',权:'天梁',科:'紫微',忌:'太阴'},
    '丙': {禄:'天同',权:'天机',科:'文昌',忌:'廉贞'},
    '丁': {禄:'太阴',权:'天同',科:'天机',忌:'巨门'},
    '戊': {禄:'贪狼',权:'太阴',科:'右弼',忌:'天机'},
    '己': {禄:'武曲',权:'贪狼',科:'天梁',忌:'文曲'},
    '庚': {禄:'太阳',权:'武曲',科:'太阴',忌:'天同'},
    '辛': {禄:'巨门',权:'太阳',科:'文曲',忌:'文昌'},
    '壬': {禄:'天梁',权:'紫微',科:'左辅',忌:'武曲'},
    '癸': {禄:'破军',权:'巨门',科:'太阳',忌:'贪狼'}
};

// 时辰 -> 地支（用于命宫计算）
const SHICHEN_TO_ZHI = {
    '子':0,'丑':1,'寅':2,'卯':3,'辰':4,'巳':5,
    '午':6,'未':7,'申':8,'酉':9,'戌':10,'亥':11
};

// 十二宫位顺序（从命宫开始逆时针）
const PALACES = ['命宫','兄弟宫','夫妻宫','子女宫','财帛宫','疾厄宫','迁移宫','交友宫','官禄宫','田宅宫','福德宫','父母宫'];

// ===== 计算命宫地支 =====
function calcMingGongZhi(month, hourZhiIndex) {
    // 命宫公式：命宫 = (寅宫起始 + 月份 - 时辰索引) % 12
    // 简化处理：以寅宫为1，顺数到生月，逆数到生时
    let mg = (2 + month - hourZhiIndex + 12) % 12;
    if (mg === 0) mg = 12;
    return (mg - 1 + 12) % 12; // 转为0-11索引
}

// ===== 简易紫微斗数排盘 =====
function calcZiweiSimple(birthDate, birthTime, gender) {
    const date = new Date(birthDate);
    const year = date.getFullYear();
    const month = date.getMonth() + 1;
    const day = date.getDate();

    // 年干索引（用于四化）
    const tiangan = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
    const yearGanIndex = (year - 4) % 10;
    const yearGan = tiangan[yearGanIndex];

    // 时辰地支索引
    const hourZhiChar = birthTime.charAt(0);
    const hourZhiIndex = SHICHEN_TO_ZHI[hourZhiChar] || 0;

    // 命宫地支索引
    const mingGongIndex = calcMingGongZhi(month, hourZhiIndex);

    // 十二宫位地支分配（命宫起始，逆时针排列）
    const dizhiList = ['寅','卯','辰','巳','午','未','申','酉','戌','亥','子','丑'];
    const palaceZhi = [];
    for (let i = 0; i < 12; i++) {
        palaceZhi.push(dizhiList[(mingGongIndex + i) % 12]);
    }

    // 主星排入十二宫（简化算法：用出生信息做伪随机分布）
    const starDistribution = {};
    for (let i = 0; i < 12; i++) {
        starDistribution[i] = [];
    }

    // 用出生年月日做种子，分配14主星
    let seed = year * 10000 + month * 100 + day;
    function seededRandom() {
        seed = (seed * 9301 + 49297) % 233280;
        return seed / 233280;
    }

    // 紫微星位置（以年干支为参考）
    let ziweiPos = (yearGanIndex + month) % 12;
    starDistribution[ziweiPos].push('紫微');

    // 天机星（紫微星顺数3位）
    starDistribution[(ziweiPos + 3) % 12].push('天机');

    // 其他主星随机分布（简化）
    const otherStars = ['太阳','武曲','天同','廉贞','天府','太阴','贪狼','巨门','天相','天梁','七杀','破军'];
    otherStars.forEach((star, idx) => {
        const pos = Math.floor(seededRandom() * 12);
        starDistribution[pos].push(star);
    });

    // 四化
    const hua = HUA_MAP[yearGan] || HUA_MAP['甲'];

    // 生年化禄/权/科/忌所在宫位（简化：随机）
    const huaPositions = {};
    ['禄','权','科','忌'].forEach(h => {
        huaPositions[h] = Math.floor(seededRandom() * 12);
    });

    // 组装命盘
    const chart = [];
    for (let i = 0; i < 12; i++) {
        chart.push({
            palace: PALACES[i],
            zhi: palaceZhi[i],
            stars: starDistribution[i],
            hua: Object.keys(huaPositions).filter(h => huaPositions[h] === i).map(h => {
                const starName = hua[h];
                return { type: h, star: starName };
            })
        });
    }

    // 命宫主星（用于命局分析）
    const mingGongStars = starDistribution[0];

    // 身宫（简化：与命宫同宫或对宫）
    const shenGongIndex = (mingGongIndex + 6) % 12;

    return {
        yearGan: yearGan,
        yearGanIndex: yearGanIndex,
        mingGongIndex: mingGongIndex,
        shenGongIndex: shenGongIndex,
        chart: chart,
        mingGongStars: mingGongStars,
        hua: hua,
        palaceZhi: palaceZhi,
        gender: gender
    };
}

// ===== 生成命盘 HTML =====
function generateZiweiResultHTML(data, name, gender, date, time) {
    const { chart, mingGongStars, hua, yearGan } = data;

    // 命盘表格 HTML
    let chartHTML = '<table class="chart-table"><tr>';
    chart.forEach(p => {
        chartHTML += '<th>' + p.palace + '<br><small style="color:rgba(255,255,255,0.5);">' + p.zhi + '宫</small></th>';
    });
    chartHTML += '</tr><tr>';
    chart.forEach(p => {
        let cell = '';
        p.stars.forEach(s => {
            // 检查是否有四化
            const huaInfo = p.hua.find(h => h.star === s);
            let cls = 'major-star';
            if (huaInfo) {
                const huaClass = {'禄':'hua-lu','权':'hua-quan','科':'hua-ke','忌':'hua-ji'};
                cls = huaClass[huaInfo.type] || 'major-star';
            }
            cell += '<div class="' + cls + '">' + s + '</div>';
        });
        if (cell === '') cell = '<span style="color:rgba(255,255,255,0.2);">空宫</span>';
        chartHTML += '<td>' + cell + '</td>';
    });
    chartHTML += '</tr></table>';

    // 命局分析
    let analysisHTML = '<p><strong>命宫主星：</strong>' + (mingGongStars.length > 0 ? mingGongStars.join('、') : '无主星（空宫）') + '</p>';
    analysisHTML += '<p><strong>生年四化：</strong>';
    analysisHTML += '禄→' + hua['禄'] + '　权→' + hua['权'] + '　科→' + hua['科'] + '　忌→' + hua['忌'];
    analysisHTML += '</p>';

    // 性格分析（根据命宫主星）
    let personality = '';
    if (mingGongStars.includes('紫微')) personality += '尊贵自信，有领导气质，注重尊严与地位。';
    else if (mingGongStars.includes('天机')) personality += '聪明机智，思维敏捷，善于策划与谋略。';
    else if (mingGongStars.includes('太阳')) personality += '热情开朗，光明磊落，注重名誉与事业。';
    else if (mingGongStars.includes('武曲')) personality += '刚毅果断，重信守义，具有商业头脑。';
    else if (mingGongStars.includes('天同')) personality += '温和善良，注重享受，性格随和乐天。';
    else if (mingGongStars.includes('廉贞')) personality += '耿直忠贞，重感情，但易陷入是非纠结。';
    else if (mingGongStars.length === 0) personality += '命宫无主星，性格较为随和，易受环境与他人影响。';
    else personality += '性格综合，需结合全盘分析。';

    analysisHTML += '<p><strong>性格特点：</strong>' + personality + '</p>';

    // 事业/感情/财运简述
    const careerStars = chart[8] ? chart[8].stars : [];
    const wealthStars = chart[4] ? chart[4].stars : [];
    analysisHTML += '<p><strong>事业宫主星：</strong>' + (careerStars.length > 0 ? careerStars.join('、') : '空宫') + '</p>';
    analysisHTML += '<p><strong>财帛宫主星：</strong>' + (wealthStars.length > 0 ? wealthStars.join('、') : '空宫') + '</p>';

    let html = '';
    html += '<div class="result-section fade-in"><h3>⭐ ' + (name || '命主') + ' 的紫微命盘</h3>';
    html += '<p style="font-size:0.85rem;color:rgba(255,255,255,0.6);">生年天干：' + yearGan + '｜性别：' + (gender || '未填') + '｜出生：' + date + ' ' + time + '</p>';
    html += '</div>';

    html += '<div class="result-section fade-in"><h3>📊 十二宫命盘</h3>' + chartHTML + '</div>';

    html += '<div class="result-section fade-in"><h3>📖 命局分析</h3>' + analysisHTML + '</div>';

    html += '<div class="result-section fade-in"><h3>💡 综合建议</h3>';
    html += '<p>紫微斗数命盘是一门精深的学问，以上为简易排盘结果，仅供参考。</p>';
    html += '<p>如需深入分析，建议结合大运、流年、四化飞星叠加等因素综合判断。</p>';
    html += '</div>';

    return html;
}

// ===== 开始排盘（API版 + 本地降级） =====
async function calculateZiwei() {
    const name = document.getElementById('nameInput').value.trim();
    const gender = document.getElementById('genderInput').value;
    const date = document.getElementById('dateInput').value;
    const time = document.getElementById('timeInput').value;

    if (!name || !date || !time) {
        window.showToast('请填写完整信息');
        return;
    }

    // 尝试调用后端API
    try {
        const apiResult = await window.fortuneAPI('ziwei', {
            name: name,
            birth_date: date,
            birth_time: time,
            gender: gender
        }, { loadingMsg: '正在联网排盘，请稍候...' });

        if (apiResult && apiResult.data) {
            renderZiweiAPIResult(apiResult.data, apiResult.meta);
            switchTab('result');
            return;
        }
    } catch (e) {
        console.error('紫微斗数API调用异常:', e);
    }

    // API 失败，降级到本地计算
    console.log('API调用失败，使用本地计算');
    showFortuneError('resultContainer', '联网获取失败，是否使用本地计算？',
        calculateZiwei, // 重试 = 重新调用API
        function() {    // 降级到本地计算
            const result = calcZiweiSimple(date, time, gender);
            const resultHTML = generateZiweiResultHTML(result, name, gender, date, time);
            document.getElementById('resultContainer').innerHTML = resultHTML;
            showDataBadge('local_fallback', 'resultContainer');
        }
    );
    switchTab('result');
}

// ===== 渲染API返回的紫微斗数结果 =====
function renderZiweiAPIResult(data, meta) {
    var mode = ModeToggle.getMode();
    const container = document.getElementById('resultContainer');

    if (mode === 'simple') {
        var simpleHtml = '<div class="beginner-result">';
        simpleHtml += '<div class="beginner-card"><h3>分析结果</h3><p>' + (data.summary || data.overview || '紫微斗数排盘分析完成') + '</p></div>';
        simpleHtml += '</div>';
        container.innerHTML = simpleHtml;
        return;
    }

    let html = '';

    // 命盘总览
    if (data.overview || data.summary) {
        html += '<div class="result-section fade-in"><h3>⭐ 命盘总览</h3>';
        html += '<p style="color:rgba(255,255,255,0.85);line-height:1.8;white-space:pre-wrap;">';
        html += (data.overview || data.summary) + '</p></div>';
    }

    // 十二宫命盘（表格形式）
    const palacesSource = (data.chart_data && data.chart_data.palaces) || data.palaces;
    if (palacesSource && palacesSource.length > 0) {
        html += '<div class="result-section fade-in"><h3>📊 十二宫命盘</h3>';
        html += '<table class="chart-table"><tr>';
        palacesSource.forEach(p => {
            html += '<th>' + (p.name || p.palace || '') + '<br><small style="color:rgba(255,255,255,0.5);">' + (p.zhi || '') + '宫</small></th>';
        });
        html += '</tr><tr>';
        palacesSource.forEach(p => {
            let cell = '';
            if (p.stars && p.stars.length > 0) {
                p.stars.forEach(s => {
                    const starName = typeof s === 'string' ? s : (s.name || s);
                    const hua = typeof s === 'object' ? s.hua : null;
                    let cls = 'major-star';
                    if (hua) {
                        const huaMap = { '禄':'hua-lu', '权':'hua-quan', '科':'hua-ke', '忌':'hua-ji' };
                        cls = huaMap[hua] || 'major-star';
                    }
                    cell += '<div class="' + cls + '">' + starName + '</div>';
                });
            }
            if (!cell) cell = '<span style="color:rgba(255,255,255,0.2);">空宫</span>';
            html += '<td>' + cell + '</td>';
        });
        html += '</tr></table></div>';
    }

    // 命局分析
    if (data.analysis || data.detail) {
        html += '<div class="result-section fade-in"><h3>📖 命局分析</h3>';
        html += '<div style="color:rgba(255,255,255,0.85);line-height:1.8;white-space:pre-wrap;">';
        html += (data.analysis || data.detail) + '</div></div>';
    }

    // 十二宫详细解读
    if (data.palace_details) {
        html += '<div class="result-section fade-in"><h3>🏛️ 十二宫详解</h3>';
        html += '<div style="color:rgba(255,255,255,0.85);line-height:1.8;white-space:pre-wrap;">';
        html += (typeof data.palace_details === 'string' ? data.palace_details : JSON.stringify(data.palace_details, null, 2));
        html += '</div></div>';
    }

    // 四化分析
    if (data.sihua || data.four_transformations) {
        html += '<div class="result-section fade-in"><h3>✨ 四化飞星</h3>';
        html += '<div style="color:rgba(255,255,255,0.85);line-height:1.8;white-space:pre-wrap;">';
        html += (typeof data.sihua === 'string' ? data.sihua : JSON.stringify(data.sihua || data.four_transformations, null, 2));
        html += '</div></div>';
    }

    // 综合建议
    if (data.suggestions || data.advice) {
        html += '<div class="result-section fade-in"><h3>💡 综合建议</h3>';
        html += '<div style="color:rgba(255,255,255,0.85);line-height:1.8;white-space:pre-wrap;">';
        html += (data.suggestions || data.advice) + '</div></div>';
    }

    // 兜底：如果以上字段都不存在，展示原始数据
    if (!html) {
        html = '<div class="result-section fade-in"><h3>⭐ 排盘结果</h3>';
        html += '<pre style="color:rgba(255,255,255,0.85);line-height:1.8;white-space:pre-wrap;font-family:inherit;">';
        html += JSON.stringify(data, null, 2) + '</pre></div>';
    }

    container.innerHTML = html;
    
    // 显示数据来源标识
    const source = (meta && meta.source) ? meta.source : 'realtime';
    showDataBadge(source, 'resultContainer');
}
