<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>头像吉凶</title>
    <link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/module-common-2.css">
</head>
<body>
<div class="app">
    <div class="page-header">
        <button class="back-btn" onclick="history.back()">←</button>
        <h1>头像吉凶</h1>
    </div>

    <div class="content-area">
        <div class="stars" id="stars"></div>
        <div class="dev-card">
            <span class="dev-icon">🪪</span>
            <div class="dev-title">头像吉凶</div>
            <div class="dev-desc">分析头像照片的风水吉凶，评估是否适合用作社交头像</div>
            <div class="dev-features">
                <h3>✨ 功能说明</h3>
                <li>上传照片即可获得AI智能分析</li>
                <li>结合传统相学与现代图像识别</li>
                <li>详细解读各项特征的命理含义</li>
                <li>提供个性化的改善建议方案</li>
                <li>支持JPG/PNG/WEBP格式图片</li>
            </div>
            <div class="upload-area">
                <button class="upload-btn" onclick="triggerImageUpload('touxiang')">📷 上传照片分析</button>
            </div>
            <div id="resultArea"></div>
            <button class="back-home-btn" onclick="history.back()">← 返回功能列表</button>
        </div>
    </div>
</div>

<script src="/js/main.js"></script>
<script src="/js/sidenav.js"></script>
<script src="/js/footer.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    if (window.createStars) createStars();
});
</script>
</body>
</html>
