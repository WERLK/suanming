<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>额头分析</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .dev-card { background:linear-gradient(135deg,rgba(26,26,46,0.95),rgba(22,33,62,0.95)); border:1px solid rgba(255,215,0,0.15); border-radius:16px; padding:2rem; text-align:center; }
        .dev-icon { font-size:4rem; display:block; margin-bottom:1rem; }
        .dev-title { color:#ffd700; font-size:1.5rem; font-weight:bold; margin-bottom:0.5rem; }
        .dev-desc { color:rgba(255,255,255,0.7); font-size:0.95rem; margin-bottom:1.5rem; line-height:1.6; }
        .dev-features { text-align:left; background:rgba(255,215,0,0.04); border-radius:12px; padding:1.2rem 1.5rem; margin-bottom:1.5rem; }
        .dev-features h3 { color:#ffd700; font-size:1rem; margin-bottom:0.8rem; }
        .dev-features li { color:rgba(255,255,255,0.6); font-size:0.85rem; margin-bottom:0.3rem; list-style:none; }
        .dev-features li::before { content:'✦ '; color:#ffd700; }
        .upload-area { margin:1.5rem 0; }
        .upload-btn { display:inline-block; padding:1rem 2.5rem; background:linear-gradient(135deg,#ffd700,#ffc107); color:#000; border:none; border-radius:12px; font-size:1.1rem; font-weight:bold; cursor:pointer; transition:all 0.3s; }
        .upload-btn:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(255,215,0,0.3); }
        .back-home-btn { margin-top:1rem; padding:0.6rem 1.5rem; background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.6); border:1px solid rgba(255,255,255,0.1); border-radius:8px; font-size:0.85rem; cursor:pointer; }
        .back-home-btn:hover { background:rgba(255,255,255,0.1); }
        #resultArea { display:none; margin-top:1.5rem; }
    </style>
</head>
<body>
<div class="app">
    <div class="page-header">
        <button class="back-btn" onclick="history.back()">←</button>
        <h1>额头分析</h1>
    </div>

    <div class="content-area">
        <div class="stars" id="stars"></div>
        <div class="dev-card">
            <span class="dev-icon">💆</span>
            <div class="dev-title">额头分析</div>
            <div class="dev-desc">分析额头饱满度与纹理特征，解读早年运势与事业起点</div>
            <div class="dev-features">
                <h3>✨ 功能说明</h3>
                <li>上传照片即可获得AI智能分析</li>
                <li>结合传统相学与现代图像识别</li>
                <li>详细解读各项特征的命理含义</li>
                <li>提供个性化的改善建议方案</li>
                <li>支持JPG/PNG/WEBP格式图片</li>
            </div>
            <div class="upload-area">
                <button class="upload-btn" onclick="triggerImageUpload('etou')">📷 上传照片分析</button>
            </div>
            <div id="resultArea"></div>
            <button class="back-home-btn" onclick="history.back()">← 返回功能列表</button>
        </div>
    </div>
</div>

<script src="/js/main.js"></script>
<script src="/js/sidenav.js"></script>
<script src="/js/footer.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    if (window.createStars) createStars();
});
</script>
</body>
</html>
