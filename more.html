<style>
/* 更多页面特定样式 */
.page-header {
    display: flex;
    align-items: center;
    gap: 1rem;

.search-input:focus {

.search-icon {

.category-tabs {

.category-tab {

.category-title span {
    font-size: 1.2rem;
}

.module-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 1rem;
}

.module-item {
    background: linear-gradient(135deg, rgba(255,215,0,0.05), rgba(255,215,0,0.02));
    border: 1px solid rgba(255,215,0,0.1);
    border-radius: 12px;
    padding: 1rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
}

.module-item:hover {
    background: linear-gradient(135deg, rgba(255,215,0,0.1), rgba(255,215,0,0.03));
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(255,215,0,0.1);
}

.module-item .icon {
    font-size: 2rem;
    margin-bottom: 0.5rem;
}

.module-item h3 {
    color: #ffd700;
    font-size: 0.85rem;
    margin-bottom: 0.3rem;
}

.module-item p {
    font-size: 0.7rem;
    color: rgba(255,255,255,0.6);
    line-height: 1.3;
}

.stats {
    text-align: center;
    padding: 1rem;

    background: linear-gradient(135deg, rgba(255,215,0,0.05), rgba(255,215,0,0.02));

}

.stats p {
    font-size: 0.9rem;
    color: rgba(255,255,255,0.8);
}

.stats strong {
    color: #ffd700;
    font-size: 1.1rem;
}

@media (max-width: 768px) {
    .module-list {

@media (min-width: 1024px) {
    .module-list {

/* 桌面端优化 */

<script>
// 模块数据（将从 JSON 文件加载）
window.moduleData = [];

// 页面加载时初始化
document.addEventListener('DOMContentLoaded', function() {
    createStars();
    loadModuleData();
});

// 加载模块数据
function loadModuleData() {
    showToast('正在加载模块数据...');
    
    // 从 module_list.json 加载真实模块数据
    fetch('/module_list.json')
        .then(function(response) {
            if (!response.ok) throw new Error('加载失败');
            return response.json();
        })
        .then(function(data) {
            window.moduleData = data;
            // 提取所有分类
            var cats = {};
            for (var i = 0; i < data.length; i++) {
                cats[data[i].category] = true;
            }
            window.categories = Object.keys(cats);
            renderCategoryTabs();
            renderAllModules();
            updateStats();
            showToast('加载完成！共 ' + data.length + ' 个模块');
        })
        .catch(function(error) {
            console.error('加载模块数据失败:', error);
            showToast('加载失败，使用演示数据');
            generateDemoData();
            renderCategoryTabs();
            renderAllModules();
            updateStats();
        });
}

// 渲染分类标签
function renderCategoryTabs() {
    var tabsContainer = document.getElementById('categoryTabs');
    var html = '<div class="category-tab active" onclick="showCategory(\'all\', this)">🔮 全部</div>';
    
    for (var i = 0; i < window.categories.length; i++) {
        var category = window.categories[i];
        var icon = getCategoryIcon(category);
        html += '<div class="category-tab" onclick="showCategory(\'' + category + '\', this)">' + icon + ' ' + category + '</div>';
    }
    
    tabsContainer.innerHTML = html;
}

// 获取分类图标
function getCategoryIcon(category) {
    var iconMap = {
        "八字命理": "🎴",
        "紫微斗数": "⭐",
        "生肖运势": "🐉",
        "姓名学": "📝",
        "面相学": "👤",
        "手相学": "🖐️",
        "风水堪舆": "🏠",
        "周公解梦": "😴",
        "塔罗牌占卜": "🎴",
        "黄道吉日": "📅",
        "六爻占卜": "🎋",
        "血型性格": "🩸",
        "星座运势": "✨",
        "奇门遁甲": "🌀",
        "太乙神数": "🔢",
        "铁板神数": "📊",
        "梅花易数": "🌸",
        "数字能量": "🔢",
        "符咒化解": "🧿",
        "择吉文化": "📅"
    };
    return iconMap[category] || "🔮";
}

// 渲染所有模块
function renderAllModules() {
    var container = document.getElementById('moduleContainer');
    var html = '';
    
    for (var i = 0; i < window.categories.length; i++) {
        var category = window.categories[i];
        var categoryModules = window.moduleData.filter(function(m) { return m.category === category; });
        var icon = getCategoryIcon(category);
        
        html += '<div class="category-section active" id="category-' + category + '">';
        html += '<h2 class="category-title"><span>' + icon + '</span> ' + category + '（' + categoryModules.length + '个模块）</h2>';
        html += '<div class="module-list">';
        
        for (var j = 0; j < categoryModules.length; j++) {
            var module = categoryModules[j];
            html += '<div class="module-item" onclick="openModule(\'' + module.path + '\')">';
            html += '<div class="icon">' + getModuleIcon(module.name) + '</div>';
            html += '<h3>' + module.name + '</h3>';
            html += '<p>点击查看详情</p>';
            html += '</div>';
        }
        
        html += '</div></div>';
    }
    
    container.innerHTML = html;
}

// 获取模块图标
function getModuleIcon(moduleName) {
    if (moduleName.indexOf('八字') !== -1) return '🎴';
    if (moduleName.indexOf('紫微') !== -1) return '⭐';
    if (moduleName.indexOf('生肖') !== -1 || moduleName.indexOf('年运势') !== -1) return '🐉';
    if (moduleName.indexOf('姓名') !== -1) return '📝';
    if (moduleName.indexOf('面相') !== -1) return '👤';
    if (moduleName.indexOf('手相') !== -1) return '🖐️';
    if (moduleName.indexOf('风水') !== -1) return '🏠';
    if (moduleName.indexOf('梦境') !== -1 || moduleName.indexOf('解梦') !== -1) return '😴';
    if (moduleName.indexOf('塔罗') !== -1) return '🎴';
    if (moduleName.indexOf('吉日') !== -1 || moduleName.indexOf('择吉') !== -1) return '📅';
    if (moduleName.indexOf('占卜') !== -1) return '🎋';
    if (moduleName.indexOf('血型') !== -1) return '🩸';
    if (moduleName.indexOf('星座') !== -1 || moduleName.indexOf('座运势') !== -1) return '✨';
    if (moduleName.indexOf('奇门') !== -1) return '🌀';
    if (moduleName.indexOf('太乙') !== -1) return '🔢';
    if (moduleName.indexOf('铁板') !== -1) return '📊';
    if (moduleName.indexOf('梅花') !== -1) return '🌸';
    if (moduleName.indexOf('数字') !== -1) return '🔢';
    if (moduleName.indexOf('符') !== -1) return '🧿';
    return '🔮';
}

// 显示分类
function showCategory(category, element) {
    // 更新标签状态
    var tabs = document.querySelectorAll('.category-tab');
    for (var i = 0; i < tabs.length; i++) {
        tabs[i].classList.remove('active');
    }
    if (element) {
        element.classList.add('active');
    }
    
    // 显示对应分类的模块
    if (category === 'all') {
        var sections = document.querySelectorAll('.category-section');
        for (var i = 0; i < sections.length; i++) {
            sections[i].classList.add('active');
        }
    } else {
        var sections = document.querySelectorAll('.category-section');
        for (var i = 0; i < sections.length; i++) {
            sections[i].classList.remove('active');
        }
        var target = document.getElementById('category-' + category);
        if (target) target.classList.add('active');
    }
}

// 搜索模块
function searchModules() {
    var keyword = document.getElementById('searchInput').value.trim().toLowerCase();
    
    if (!keyword) {
        renderAllModules();
        return;
    }
    
    var filteredModules = window.moduleData.filter(function(m) {
        return m.name.toLowerCase().indexOf(keyword) !== -1 || 
               m.category.toLowerCase().indexOf(keyword) !== -1;
    });
    
    var container = document.getElementById('moduleContainer');
    var html = '<div class="category-section active">';
    html += '<h2 class="category-title"><span>🔍</span> 搜索结果（' + filteredModules.length + '个匹配）</h2>';
    html += '<div class="module-list">';
    
    for (var i = 0; i < filteredModules.length; i++) {
        var module = filteredModules[i];
        html += '<div class="module-item" onclick="openModule(\'' + module.path + '\')">';
        html += '<div class="icon">' + getModuleIcon(module.name) + '</div>';
        html += '<h3>' + module.name + '</h3>';
        html += '<p>' + module.category + '</p>';
        html += '</div>';
    }
    
    html += '</div></div>';
    
    container.innerHTML = html;
}

// 打开模块
function openModule(path) {
    window.location.href = path;
}

// 更新统计信息
function updateStats() {
    document.getElementById('totalCount').textContent = window.moduleData.length;
    document.getElementById('categoryCount').textContent = window.categories.length;
}
</script>

</body>
</html>
