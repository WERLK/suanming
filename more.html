        { cat:"ImageUpload", icon:"📸", name:"全身照看相", desc:"全身照片综合看相分析", file:"全身照看相_385.html", isNew:true }
    ];

    var catToGrid = {
        Bazi: "gridBazi", Ziwei: "gridZiwei", Shengxiao: "gridShengxiao",
        Xingming: "gridXingming", Fengshui: "gridFengshui", Tarot: "gridTarot",
        Zhougong: "gridZhougong", Mianxiang: "gridMianxiang", Jiri: "gridJiri",
        Zhanbu: "gridZhanbu", Liuyao: "gridLiuyao", Xingzuo: "gridXingzuo",
        Xuexing: "gridXuexing", Shuzi: "gridShuzi", Qimen: "gridQimen",
        Meihua: "gridMeihua", Taiyi: "gridTaiyi", Tieban: "gridTieban",
        Fuzhou: "gridFuzhou", Zeri: "gridZeri",
        DataAnalysis: "gridDataAnalysis", ImageUpload: "gridImageUpload"
    };

    var catCounts = {};
    modules.forEach(function(m) {
        var grid = document.getElementById(catToGrid[m.cat]);
        if (!grid) return;
        catCounts[m.cat] = (catCounts[m.cat] || 0) + 1;

        var a = document.createElement('a');
        a.className = 'mod-card';
        if (m.isNew) a.classList.add('new-feature');
        a.href = '/modules/' + m.file;
        a.style.position = 'relative';
        a.innerHTML = '<div class="icon">' + m.icon + '</div>'
            + '<div class="name">' + m.name + '</div>'
            + '<div class="desc">' + m.desc + '</div>';
        grid.appendChild(a);
    });

    // Update counts
    Object.keys(catToGrid).forEach(function(cat) {
        var cnt = document.getElementById('cnt' + cat);
        if (cnt) cnt.textContent = '(' + (catCounts[cat] || 0) + '个)';
    });

    // Remove empty sections
    Object.keys(catToGrid).forEach(function(cat) {
        var grid = document.getElementById(catToGrid[cat]);
        if (grid && grid.children.length === 0) {
            var section = grid.parentElement;
            if (section && section.classList.contains('cat-section')) section.remove();
        }
    });
})();

// 折叠/展开分类
function toggleCat(titleEl) {
    var grid = titleEl.nextElementSibling;
    if (!grid) return;
    var isOpen = titleEl.classList.toggle('open');
    if (isOpen) {
        grid.classList.add('open');
    } else {
        grid.classList.remove('open');
    }
}
</script>
