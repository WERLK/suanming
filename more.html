        .module-grid {

            gap: 0.8rem;
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.4s ease, opacity 0.3s ease, padding 0.3s ease, margin 0.3s ease;

            padding: 0.8rem 0.5rem;

        }

        }

        .mod-card .desc { color: rgba(255,255,255,0.45); font-size: 0.68rem; margin-top: 0.25rem; line-height: 1.35; max-width: 130px; }

        .mod-card.new-feature {

        .mod-card.new-feature::after {
            content: 'NEW'; position: absolute; top: 6px; right: 8px;
            font-size: 0.6rem; background: #00c8ff; color: #000;
            padding: 1px 6px; border-radius: 8px; font-weight: bold;
        }
        .mod-card.new-feature .name { color: #00c8ff; }

        var grid = document.getElementById(catToGrid[m.cat]);
        if (!grid) return;
        catCounts[m.cat] = (catCounts[m.cat] || 0) + 1;

        var a = document.createElement('a');
        a.className = 'mod-card';
        if (m.isNew) a.classList.add('new-feature');
        a.href = '/modules/' + m.file;
        a.style.position = 'relative';
        a.innerHTML = '<div class="icon">' + m.icon + '</div>'
            + '<div class="name">' + m.name + '</div>'
            + '<div class="desc">' + m.desc + '</div>';
        grid.appendChild(a);
    });

    // Update counts
    Object.keys(catToGrid).forEach(function(cat) {
        var cnt = document.getElementById('cnt' + cat);
        if (cnt) cnt.textContent = '(' + (catCounts[cat] || 0) + '个)';
    });

    // Remove empty sections
    Object.keys(catToGrid).forEach(function(cat) {
        var grid = document.getElementById(catToGrid[cat]);
        if (grid && grid.children.length === 0) {
            var section = grid.parentElement;
            if (section && section.classList.contains('cat-section')) section.remove();
        }
    });
})();

// 折叠/展开分类
function toggleCat(titleEl) {
    var grid = titleEl.nextElementSibling;
    if (!grid) return;
    var isOpen = titleEl.classList.toggle('open');
    if (isOpen) {
        grid.classList.add('open');
    } else {
        grid.classList.remove('open');
    }
}
