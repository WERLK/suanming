    <style>
        /* 个人中心页面特定样式 */
        .profile-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        
        .profile-header {
            text-align: center;
            padding: 2rem 1rem;
            background: linear-gradient(180deg, rgba(255,215,0,0.1), transparent);
            border-bottom: 1px solid rgba(255,215,0,0.15);
            margin-bottom: 1.5rem;
        }
        
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,215,0,0.05));
            border: 2px solid rgba(255,215,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin: 0 auto 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .profile-avatar:hover {
            transform: scale(1.05);
            border-color: rgba(255,215,0,0.5);
        }
        
        .profile-name {
            color: #ffd700;
            font-size: 1.5rem;
            margin-bottom: 0.3rem;
        }
        
        .profile-info {
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
        }
        
        .profile-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin: 1.5rem 0;
        }
        
        .stat-item {
            text-align: center;
            padding: 1rem;
            background: linear-gradient(135deg, rgba(255,215,0,0.05), rgba(255,215,0,0.02));
            border: 1px solid rgba(255,215,0,0.1);
            border-radius: 12px;
        }
        
        .stat-value {
            color: #ffd700;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 0.3rem;
        }
        
        .stat-label {
            color: rgba(255,255,255,0.6);
            font-size: 0.8rem;
        }
        
        .profile-section {
            margin-bottom: 1.5rem;
        }
        
        .section-title {
            color: #ffd700;
            font-size: 1rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255,215,0,0.1);
        }
        
        .menu-list {
            background: linear-gradient(135deg, rgba(255,215,0,0.05), rgba(255,215,0,0.02));
            border: 1px solid rgba(255,215,0,0.1);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .menu-item {
            display: flex;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid rgba(255,215,0,0.05);
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .menu-item:last-child {
            border-bottom: none;
        }
        
        .menu-item:hover {
            background: rgba(255,215,0,0.05);
        }
        
        .menu-icon {
            font-size: 1.5rem;
            margin-right: 1rem;
            width: 30px;
            text-align: center;
        }
        
        .menu-text {
            flex: 1;
            color: #ffffff;
            font-size: 0.95rem;
        }
        
        .menu-arrow {
            color: rgba(255,255,255,0.3);
            font-size: 1.2rem;
        }
        
        .btn-logout {
            width: 100%;
            padding: 0.9rem;
            background: rgba(255,0,0,0.1);
            border: 1px solid rgba(255,0,0,0.3);
            border-radius: 12px;
            color: #ff6b6b;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }
        
        .btn-logout:hover {
            background: rgba(255,0,0,0.2);
        }

        /* ========== 会员卡片 ========== */
        .vip-card {
            background: linear-gradient(135deg, rgba(255,215,0,0.08), rgba(255,215,0,0.02));
            border: 1px solid rgba(255,215,0,0.2);
            border-radius: 12px;
            margin: 0 1rem 1.5rem;
            overflow: hidden;
        }
        .vip-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 1rem;
            background: linear-gradient(90deg, rgba(255,215,0,0.15), transparent);
        }
        .vip-badge {
            font-size: 0.9rem;
            font-weight: bold;
            padding: 0.25rem 0.7rem;
            border-radius: 20px;
        }
        .vip-badge.free {
            background: rgba(136,136,136,0.15);
            color: #888;
        }
        .vip-badge.basic {
            background: rgba(76,175,80,0.15);
            color: #4caf50;
        }
        .vip-badge.premium {
            background: rgba(255,215,0,0.15);
            color: #ffd700;
        }
        .vip-expire {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.5);
        }
        .vip-card-body {
            padding: 0.8rem 1rem;
        }
        .vip-progress {
            height: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
            margin-bottom: 0.8rem;
            overflow: hidden;
        }
        .vip-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ffed4e);
            border-radius: 3px;
            transition: width 0.5s;
        }
        .vip-info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }
        .vip-info-row span {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.7);
            flex: 1;
        }
        .vip-ad-btn {
            padding: 0.5rem 0.8rem;
            background: linear-gradient(135deg, #ffd700, #ffc107);
            border: none;
            border-radius: 8px;
            color: #000;
            font-size: 0.78rem;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }
        .vip-ad-btn:hover {
            background: linear-gradient(135deg, #ffed4e, #ffd700);
            transform: scale(1.02);
        }
        .vip-ad-btn:disabled {
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.3);
            cursor: not-allowed;
            transform: none;
        }
        /* 广告观看弹窗 */
        .ad-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .ad-modal.show {

        }
        .ad-modal-content {

        }
        .ad-timer {

            color: #ffd700;
            margin: 1rem 0;
            font-weight: bold;
        }
        .ad-hint {
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;

        }
        .ad-skip-btn {

            border-radius: 8px;

        }
        
        .edit-profile-modal {

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

            border-radius: 16px;

        .modal-header {

            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .modal-title {

            cursor: pointer;
        }

        .form-group label {
            display: block;
            color: #ffd700;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;

            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,215,0,0.2);
            border-radius: 8px;

            font-size: 0.95rem;
            transition: all 0.3s;
            box-sizing: border-box;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: rgba(255,215,0,0.5);
            background: rgba(255,255,255,0.08);

    <script>
        // 创建星空背景
        document.addEventListener('DOMContentLoaded', function() {
            createStars();
            checkLoginStatus();
        });
        
        // 检查登录状态
        async function checkLoginStatus() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            
            if (!token) {
                // 未登录，跳转到登录页面
                window.location.href = '/login.html';
                return;
            }
            
            try {
                // 从后端API获取用户信息
                const response = await fetch('/api/profile', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    // token无效，清除并跳转
                    localStorage.removeItem('token');
                    localStorage.removeItem('currentUser');
                    sessionStorage.removeItem('token');
                    sessionStorage.removeItem('currentUser');
                    window.location.href = '/login.html';
                    return;
                }
                
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error(data.message);
                }
                
                const user = data.user;
                
                // 更新页面显示
                document.getElementById('profileName').textContent = user.username || '未设置用户名';
                
                let infoText = '';
                if (user.phone) infoText += user.phone;
                if (user.email) infoText += (infoText ? ' · ' : '') + user.email;
                document.getElementById('profileInfo').textContent = infoText || '暂无联系方式';
                
                // 保存用户信息到本地（用于离线访问）
                if (localStorage.getItem('rememberMe')) {
                    localStorage.setItem('currentUser', JSON.stringify(user));
                } else {
                    sessionStorage.setItem('currentUser', JSON.stringify(user));
                }
                
                // 加载用户统计数据
                loadUserStats(user);
                
                // 加载会员状态
                loadVIPStatus();
                
                // 填充编辑表单
                document.getElementById('editUsername').value = user.username || '';
                document.getElementById('editPhone').value = user.phone || '';
                document.getElementById('editEmail').value = user.email || '';
                document.getElementById('editBirthday').value = user.birthday || '';
                document.getElementById('editGender').value = user.gender || '';
                
            } catch (error) {
                console.error('获取用户信息失败:', error);
                showToast('获取用户信息失败，请重试');
                
                // 尝试从本地存储加载
                const localUser = localStorage.getItem('currentUser') || sessionStorage.getItem('currentUser');
                if (localUser) {
                    const user = JSON.parse(localUser);
                    document.getElementById('profileName').textContent = user.username || '未设置用户名';
                    
                    let infoText = '';
                    if (user.phone) infoText += user.phone;
                    if (user.email) infoText += (infoText ? ' · ' : '') + user.email;
                    document.getElementById('profileInfo').textContent = infoText || '暂无联系方式';
                    
                    loadUserStats(user);
                }
            }
        }
        
        // 加载用户统计数据
        function loadUserStats(user) {
            // 从localStorage获取用户统计数据
            const stats = JSON.parse(localStorage.getItem('userStats_' + user.id) || '{}');
            
            document.getElementById('divinationCount').textContent = stats.divinationCount || 0;
            document.getElementById('favoriteCount').textContent = (stats.favorites || []).length;
            
            // 计算使用天数
            if (user.create_time) {
                const createTime = new Date(user.create_time);
                const now = new Date();
                const days = Math.floor((now - createTime) / (1000 * 60 * 60 * 24));
                document.getElementById('daysCount').textContent = days;
            } else {
                document.getElementById('daysCount').textContent = 0;
            }
        }
        
        // 打开编辑资料弹窗
        function openEditProfile() {
            document.getElementById('editProfileModal').classlist.add('show');
        }
        
        // 关闭编辑资料弹窗
        function closeEditProfile() {
            document.getElementById('editProfileModal').classlist.remove('show');
        }
        
        // 保存资料
        async function saveProfile(event) {
            event.preventDefault();
            
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            
            if (!token) {
                showToast('请先登录');
                window.location.href = '/login.html';
                return;
            }
            
            // 获取表单数据
            const username = document.getElementById('editUsername').value.trim();
            const phone = document.getElementById('editPhone').value.trim();
            const email = document.getElementById('editEmail').value.trim();
            const birthday = document.getElementById('editBirthday').value;
            const gender = document.getElementById('editGender').value;
            
            // 验证用户名
            if (!username) {
                showToast('用户名不能为空');
                return;
            }
            
            try {
                // 调用后端API更新用户信息
                const response = await fetch('/api/profile', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        username: username,
                        phone: phone,
                        email: email,
                        birthday: birthday,
                        gender: gender
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // 更新成功
                    const user = data.user;
                    
                    // 更新页面显示
                    document.getElementById('profileName').textContent = user.username;
                    
                    let infoText = '';
                    if (user.phone) infoText += user.phone;
                    if (user.email) infoText += (infoText ? ' · ' : '') + user.email;
                    document.getElementById('profileInfo').textContent = infoText || '暂无联系方式';
                    
                    // 保存用户信息到本地
                    if (localStorage.getItem('rememberMe')) {
                        localStorage.setItem('currentUser', JSON.stringify(user));
                    } else {
                        sessionStorage.setItem('currentUser', JSON.stringify(user));
                    }
                    
                    // 关闭弹窗
                    closeEditProfile();
                    
                    showToast('资料保存成功！');
                } else {
                    showToast(data.message || '保存失败，请重试');
                }
            } catch (error) {
                console.error('保存资料失败:', error);
                showToast('保存失败，请检查网络');
            }
        }
        
        // 处理退出登录
        async function handleLogout() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            
            try {
                // 调用后端API登出
                if (token) {
                    await fetch('/api/logout', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                }
            } catch (error) {
                // 忽略错误，继续登出
            }
            
            // 清除本地存储
            localStorage.removeItem('token');
            localStorage.removeItem('currentUser');
            localStorage.removeItem('rememberMe');
            sessionStorage.removeItem('token');
            sessionStorage.removeItem('currentUser');
            
            showToast('已退出登录');
            
            // 延迟跳转
            setTimeout(() => {
                window.location.href = '/login.html';
            }, 1000);
        }
        
        // 点击弹窗外部关闭弹窗
        document.getElementById('editProfileModal').addEventListener('click', function(event) {
            if (event.target === this) {
                closeEditProfile();
            }
        });

        // ========== 会员VIP系统 ==========
        let adTimerInterval = null;

        async function loadVIPStatus() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            if (!token) return;
            try {
                const resp = await fetch('/api/vip/status', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await resp.json();
                if (!data.success) return;
                
                const card = document.getElementById('vipCard');
                card.style.display = 'block';
                
                // 会员等级徽章
                const badge = document.getElementById('vipBadge');
                badge.textContent = data.vip_level_name;
                badge.className = 'vip-badge ' + data.vip_level;
                
                // 到期时间
                const expireEl = document.getElementById('vipExpire');
                if (data.vip_expire) {
                    const d = new Date(data.vip_expire);
                    expireEl.textContent = '到期: ' + d.toLocaleDateString('zh-CN');
                } else {
                    expireEl.textContent = data.vip_level === 'free' ? '' : '永久';
                }
                
                // 剩余时长
                const remainEl = document.getElementById('vipRemaining');
                const progressBar = document.getElementById('vipProgressBar');
                if (data.vip_remaining) {
                    remainEl.textContent = '剩余: ' + data.vip_remaining;
                    // 简单进度（按天算比例）
                    const expireDate = new Date(data.vip_expire);
                    const now = new Date();
                    const total = expireDate - now;
                    const max = 7 * 24 * 3600 * 1000;  // 以7天为满
                    const pct = Math.min(100, Math.max(0, (total / max) * 100));
                    progressBar.style.width = pct + '%';
                } else {
                    remainEl.textContent = data.vip_level === 'free' ? '看广告免费升级会员' : '已过期';
                    progressBar.style.width = '0%';
                }
                
                // 广告按钮
                const adBtn = document.getElementById('vipAdBtn');
                const adCount = document.getElementById('adRemain');
                const remaining = data.max_daily_ads - data.today_ads;
                adCount.textContent = '剩' + remaining;
                
                if (remaining <= 0) {
                    adBtn.disabled = true;
                    adBtn.innerHTML = '📺 今日次数已用完';
                } else {
                    adBtn.disabled = false;
                }
            } catch (e) {
                console.error('加载会员状态失败:', e);
            }
        }

        function watchAdForVIP() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            if (!token) { window.location.href = '/login.html'; return; }
            
            const modal = document.getElementById('adModal');
            const timer = document.getElementById('adTimer');
            const skipBtn = document.getElementById('adSkipBtn');
            
            modal.classlist.add('show');
            skipBtn.style.display = 'none';
            
            let seconds = 5;
            timer.textContent = seconds;
            
            if (adTimerInterval) clearInterval(adTimerInterval);
            
            adTimerInterval = setInterval(() => {
                seconds--;
                timer.textContent = seconds;
                if (seconds <= 0) {
                    clearInterval(adTimerInterval);
                    timer.textContent = '✓';
                    skipBtn.style.display = 'inline-block';
                }
            }, 1000);
        }

        async function closeAdModal() {
            clearInterval(adTimerInterval);
            document.getElementById('adModal').classlist.remove('show');
            
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            if (!token) return;
            
            try {
                const resp = await fetch('/api/vip/watch-ad', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await resp.json();
                if (data.success) {
                    showToast('✅ ' + data.message);
                    loadVIPStatus();
                } else {
                    showToast('⚠️ ' + data.message);
                }
            } catch (e) {
                console.error('广告奖励失败:', e);
                showToast('网络错误，请重试');
            }
        }

        // 点击广告弹窗空白处关闭（广告未结束时不能关闭）
        document.getElementById('adModal').addEventListener('click', function(e) {
            if (e.target === this && document.getElementById('adSkipBtn').style.display !== 'none') {
                closeAdModal();
            }
        });

        // ========== 头像上传功能 ==========
        async function uploadAvatar() {
            const input = document.getElementById('avatarInput');
            const file = input.files[0];
            
            if (!file) return;
            
            // 验证文件类型
            if (!file.type.startsWith('image/')) {
                showToast('❌ 请选择图片文件');
                return;
            }
            
            // 验证文件大小（2MB）
            if (file.size > 2 * 1024 * 1024) {
                showToast('❌ 图片大小不能超过2MB');
                return;
            }
            
            // 显示加载状态
            showToast('⏳ 正在上传头像...');
            
            try {
                // 读取图片为 base64
                const reader = new FileReader();
                reader.onload = async function(e) {
                    const base64Image = e.target.result;
                    
                    // 获取 token
                    const token = localStorage.getItem('token') || sessionStorage.getItem('token');
                    if (!token) {
                        showToast('❌ 请先登录');
                        return;
                    }
                    
                    // 上传头像
                    const resp = await fetch('/api/avatar/upload', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ image: base64Image })
                    });
                    
                    const data = await resp.json();
                    
                    if (data.success) {
                        // 更新头像显示
                        const avatarImg = document.getElementById('avatarImg');
                        const avatarDefault = document.getElementById('avatarDefault');
                        
                        avatarImg.src = data.avatar_url + '?t=' + new Date().getTime();
                        avatarImg.style.display = 'block';
                        avatarDefault.style.display = 'none';
                        
                        showToast('✅ ' + data.message);
                    } else {
                        showToast('❌ ' + data.message);
                    }
                };
                reader.readAsDataURL(file);
                
            } catch (e) {
                console.error('头像上传失败:', e);
                showToast('❌ 上传失败，请重试');
            }
            
            // 清空 input
            input.value = '';
        }

        // 加载用户头像
        async function loadAvatar() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            if (!token) return;
            
            try {
                const resp = await fetch('/api/profile', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await resp.json();
                
                if (data.success && data.user.avatar) {
                    const avatarImg = document.getElementById('avatarImg');
                    const avatarDefault = document.getElementById('avatarDefault');
                    
                    avatarImg.src = data.user.avatar + '?t=' + new Date().getTime();
                    avatarImg.style.display = 'block';
                    avatarDefault.style.display = 'none';
                }
            } catch (e) {
                console.error('加载头像失败:', e);
            }
        }

        // 页面加载时加载头像
        loadAvatar();
    </script>
</div>
