<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffd700">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>注册 - 玄机算命网</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/profile-compatible.css">
    <style>
        .auth-body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem; }
        .auth-card { width:100%; max-width:400px; background:linear-gradient(135deg,rgba(26,26,46,0.95),rgba(22,33,62,0.95)); border:1px solid rgba(255,215,0,0.2); border-radius:16px; padding:2rem; }
        .auth-title { text-align:center; color:#ffd700; font-size:1.5rem; margin-bottom:0.3rem; }
        .auth-subtitle { text-align:center; color:rgba(255,255,255,0.5); font-size:0.85rem; margin-bottom:1.5rem; }
        .auth-msg { display:none; padding:0.7rem 1rem; border-radius:8px; margin-bottom:1rem; font-size:0.9rem; text-align:center; }
        .auth-msg.error { display:block; background:rgba(255,59,48,0.15); border:1px solid rgba(255,59,48,0.3); color:#ff6b6b; }
        .auth-msg.success { display:block; background:rgba(76,217,100,0.15); border:1px solid rgba(76,217,100,0.3); color:#4cd964; }
        .form-group { margin-bottom:1rem; }
        .form-group label { display:block; color:rgba(255,255,255,0.7); font-size:0.85rem; margin-bottom:0.4rem; }
        .form-input { width:100%; padding:0.75rem 1rem; background:rgba(255,255,255,0.05); border:1px solid rgba(255,215,0,0.15); border-radius:10px; color:#fff; font-size:0.95rem; box-sizing:border-box; }
        .form-input:focus { outline:none; border-color:rgba(255,215,0,0.5); }
        .btn { width:100%; padding:0.85rem; border:none; border-radius:10px; font-size:1rem; font-weight:bold; cursor:pointer; }
        .btn-primary { background:linear-gradient(135deg,#ffd700,#ffc107); color:#000; }
        .btn-primary:disabled { opacity:0.5; cursor:not-allowed; }
        .auth-links { text-align:center; margin-top:1rem; font-size:0.9rem; }
        .auth-links a { color:#ffd700; text-decoration:none; }
        .strength-bar { height:4px; border-radius:2px; margin-top:0.3rem; transition:width 0.3s,background 0.3s; }
    </style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="auth-body">
    <div class="auth-card">
        <h1 class="auth-title">🔮 注册账号</h1>
        <p class="auth-subtitle">创建你的玄机算命网账号</p>
        <div class="auth-msg" id="authMsg"></div>

        <form id="registerForm" novalidate>
            <div class="form-group">
                <label>用户名 *（3-20位字母数字下划线）</label>
                <input type="text" class="form-input" id="username" placeholder="请输入用户名" maxlength="20" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label>手机号（可选）</label>
                <input type="tel" class="form-input" id="phone" placeholder="选填，用于找回密码" maxlength="11" autocomplete="tel">
            </div>

            <div class="form-group">
                <label>邮箱（可选）</label>
                <input type="email" class="form-input" id="email" placeholder="选填，用于找回密码">
            </div>

            <div class="form-group">
                <label>密码 *（最少6位）</label>
                <input type="password" class="form-input" id="password" placeholder="请输入密码" minlength="6" autocomplete="new-password" required>
                <div class="strength-bar" id="strengthBar" style="width:0;background:rgba(255,255,255,0.15);"></div>
            </div>

            <div class="form-group">
                <label>确认密码 *</label>
                <input type="password" class="form-input" id="confirmPassword" placeholder="请再次输入密码" autocomplete="new-password" required>
            </div>

            <button type="submit" class="btn btn-primary" id="registerBtn">注册</button>
        </form>

        <div class="auth-links">
            已有账号？<a href="/login.html">立即登录</a> | <a href="/">返回首页</a>
        </div>
    </div>
</div>

<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
<script>
(function() {
    var $ = function(id) { return document.getElementById(id); };

    document.addEventListener('DOMContentLoaded', function() {
        if (window.createStars) createStars();
        // 密码强度检测
        $('password').addEventListener('input', function() {
            var v = this.value, l = v.length, bar = $('strengthBar');
            if (l === 0) bar.style.cssText = 'width:0';
            else if (l < 4) bar.style.cssText = 'width:25%;background:#ff3b30';
            else if (l < 6) bar.style.cssText = 'width:50%;background:#ff9500';
            else if (l < 8) bar.style.cssText = 'width:75%;background:#ffd700';
            else bar.style.cssText = 'width:100%;background:#4cd964';
        });
    });

    $('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        var btn = $('registerBtn');

        var username = $('username').value.trim();
        var password = $('password').value;
        var confirmPassword = $('confirmPassword').value;
        var phone = $('phone').value.trim();
        var email = $('email').value.trim();

        // 校验
        if (!username || username.length < 3) {
            Auth.showMsg('authMsg', '用户名至少3个字符', true); return;
        }
        if (!/^[a-zA-Z0-9_]+$/.test(username)) {
            Auth.showMsg('authMsg', '用户名只能包含字母、数字和下划线', true); return;
        }
        if (!password || password.length < 6) {
            Auth.showMsg('authMsg', '密码至少6个字符', true); return;
        }
        if (password !== confirmPassword) {
            Auth.showMsg('authMsg', '两次密码输入不一致', true); return;
        }
        if (phone && !/^1[3-9]\d{9}$/.test(phone)) {
            Auth.showMsg('authMsg', '手机号格式不正确', true); return;
        }
        if (email && !/@/.test(email)) {
            Auth.showMsg('authMsg', '邮箱格式不正确', true); return;
        }

        btn.disabled = true;
        btn.textContent = '注册中...';

        try {
            var result = await Auth.register(username, password, email, phone);
            if (result.success) {
                Auth.showMsg('authMsg', '注册成功！正在跳转...', false);
                setTimeout(function() { window.location.replace('/'); }, 800);
            } else {
                Auth.showMsg('authMsg', result.message || '注册失败', true);
                btn.disabled = false;
                btn.textContent = '注册';
            }
        } catch (e) {
            Auth.showMsg('authMsg', '网络错误，请重试', true);
            btn.disabled = false;
            btn.textContent = '注册';
        }
    });
})();
</script>
</body>
</html>
