<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>用户注册 - 玄机算命网</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* 注册页面特定样式 */
        .register-container {
            max-width: 400px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .register-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-top: 2rem;
        }
        
        .register-header h1 {
            color: #ffd700;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        
        .register-header p {
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
        }
        
        .register-form {
            background: linear-gradient(135deg, rgba(255,215,0,0.05), rgba(255,215,0,0.02));
            border: 1px solid rgba(255,215,0,0.15);
            border-radius: 16px;
            padding: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.2rem;
        }
        
        .form-group label {
            display: block;
            color: #ffd700;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,215,0,0.2);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            transition: all 0.3s;
            box-sizing: border-box;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: rgba(255,215,0,0.5);
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 10px rgba(255,215,0,0.1);
        }
        
        .form-group input::placeholder {
            color: rgba(255,255,255,0.3);
        }
        
        .form-group .hint {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
            margin-top: 0.3rem;
        }
        
        .password-strength {
            margin-top: 0.5rem;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s;
            border-radius: 2px;
        }
        
        .strength-weak {
            background: #ff6b6b;
            width: 33%;
        }
        
        .strength-medium {
            background: #ffd43b;
            width: 66%;
        }
        
        .strength-strong {
            background: #51cf66;
            width: 100%;
        }
        
        .captcha-container {
            margin-bottom: 1.5rem;
        }
        
        .captcha-display {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }
        
        .captcha-image {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,215,0,0.2);
            border-radius: 8px;
            padding: 0.5rem;
            text-align: center;
            cursor: pointer;
        }
        
        .captcha-image img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }
        
        .captcha-refresh {
            background: none;
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 8px;
            color: #ffd700;
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        
        .captcha-refresh:hover {
            background: rgba(255,215,0,0.1);
        }
        
        .slider-container {
            margin-bottom: 1.5rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,215,0,0.2);
            border-radius: 8px;
            padding: 1rem;
        }
        
        .slider-track {
            width: 100%;
            height: 40px;
            background: linear-gradient(90deg, rgba(255,215,0,0.1), rgba(255,215,0,0.3));
            border-radius: 20px;
            position: relative;
            margin: 1rem 0;
        }
        
        .slider-button {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            border-radius: 50%;
            position: absolute;
            left: 0;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            user-select: none;
            transition: left 0.1s;
        }
        
        .slider-button:active {
            cursor: grabbing;
        }
        
        .slider-hint {
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }
        
        .slider-target {
            width: 4px;
            height: 40px;
            background: #ff6b6b;
            position: absolute;
            top: 0;
            border-radius: 2px;
        }
        
        .captcha-type-switch {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .captcha-type-btn {
            background: none;
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 8px;
            color: rgba(255,255,255,0.7);
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85rem;
        }
        
        .captcha-type-btn.active {
            background: rgba(255,215,0,0.1);
            color: #ffd700;
            border-color: rgba(255,215,0,0.5);
        }
