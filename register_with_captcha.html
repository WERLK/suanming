<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>用户注册 - 玄机算命网</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icon-192.png">

    <style>
        /* 注册页面特定样式 */
        .register-container {
            max-width: 400px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .register-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-top: 2rem;
        }
        
        .register-header h1 {
            color: #ffd700;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        
        .register-header p {
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
        }
        
        .register-form {
            background: linear-gradient(135deg, rgba(255,215,0,0.05), rgba(255,215,0,0.02));
            border: 1px solid rgba(255,215,0,0.15);
            border-radius: 16px;
            padding: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.2rem;
        }
        
        .form-group label {
            display: block;
            color: #ffd700;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,215,0,0.2);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            transition: all 0.3s;
            box-sizing: border-box;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: rgba(255,215,0,0.5);
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 10px rgba(255,215,0,0.1);
        }
        
        .form-group input::placeholder {
            color: rgba(255,255,255,0.3);
        }
        
        .form-group .hint {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
            margin-top: 0.3rem;
        }
        
        .password-strength {
            margin-top: 0.5rem;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s;
            border-radius: 2px;
        }
        
        .strength-weak {
            background: #ff6b6b;
            width: 33%;
        }
        
        .strength-medium {
            background: #ffd43b;
            width: 66%;
        }
        
        .strength-strong {
            background: #51cf66;
            width: 100%;
        }
        
        .captcha-container {
            margin-bottom: 1.5rem;
        }
        
        .captcha-display {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }
        
        .captcha-image {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,215,0,0.2);
            border-radius: 8px;
            padding: 0.5rem;
            text-align: center;
            cursor: pointer;
        }
        
        .captcha-image img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }
        
        .captcha-refresh {
            background: none;
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 8px;
            color: #ffd700;
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        
        .captcha-refresh:hover {
            background: rgba(255,215,0,0.1);
        }
        
        .slider-container {
            margin-bottom: 1.5rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,215,0,0.2);
            border-radius: 8px;
            padding: 1rem;
        }
        
        .slider-track {
            width: 100%;
            height: 40px;
            background: linear-gradient(90deg, rgba(255,215,0,0.1), rgba(255,215,0,0.3));
            border-radius: 20px;
            position: relative;
            margin: 1rem 0;
        }
        
        .slider-button {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            border-radius: 50%;
            position: absolute;
            left: 0;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            user-select: none;
            transition: left 0.1s;
        }
        
        .slider-button:active {
            cursor: grabbing;
        }
        
        .slider-hint {
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }
        
        .slider-target {
            width: 4px;
            height: 40px;
            background: #ff6b6b;
            position: absolute;
            top: 0;
            border-radius: 2px;
        }
        
        .captcha-type-switch {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .captcha-type-btn {
            background: none;
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 8px;
            color: rgba(255,255,255,0.7);
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85rem;
        }
        
        .captcha-type-btn.active {
            background: rgba(255,215,0,0.1);
            color: #ffd700;
            border-color: rgba(255,215,0,0.5);
        }
        
        .captcha-type-btn:hover {
            background: rgba(255,215,0,0.15);
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <h1>用户注册</h1>
            <p>创建您的账号，开启玄学之旅</p>
        </div>
        
        <div class="register-form">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" placeholder="请输入用户名（2-20个字符）" maxlength="20">
            </div>
            
            <div class="form-group">
                <label>手机号</label>
                <input type="tel" id="phone" placeholder="请输入手机号" maxlength="11">
            </div>
            
            <div class="form-group">
                <label>邮箱（选填）</label>
                <input type="email" id="email" placeholder="请输入邮箱地址">
            </div>
            
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="请输入密码（6-20个字符）" maxlength="20">
                <div class="password-strength">
                    <div class="password-strength-bar" id="passwordStrength"></div>
                </div>
            </div>
            
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" id="confirmPassword" placeholder="请再次输入密码" maxlength="20">
            </div>
            
            <div class="captcha-container">
                <div class="captcha-type-switch">
                    <button type="button" class="captcha-type-btn active" data-type="image" onclick="switchCaptchaType('image')">图片验证码</button>
                    <button type="button" class="captcha-type-btn" data-type="slider" onclick="switchCaptchaType('slider')">滑块验证</button>
                </div>
                
                <div id="imageCaptcha">
                    <div class="captcha-display">
                        <div class="captcha-image" onclick="loadCaptcha()">
                            <img id="captchaImage" src="" alt="验证码" style="max-width:100%">
                        </div>
                        <button type="button" class="captcha-refresh" onclick="loadCaptcha()">刷新</button>
                    </div>
                    <input type="text" id="captchaInput" placeholder="请输入验证码" maxlength="4">
                    <input type="hidden" id="captchaId" value="">
                </div>
                
                <div id="sliderCaptcha" style="display:none;">
                    <div class="slider-container">
                        <div class="slider-track">
                            <div class="slider-target" id="sliderTarget"></div>
                            <div class="slider-button" id="sliderButton">➤</div>
                        </div>
                        <div class="slider-hint">请拖动滑块完成验证</div>
                    </div>
                </div>
            </div>
            
            <div style="text-align: center; margin: 1.5rem 0;">
                <button type="button" onclick="handleRegister(event)" style="width: 100%; padding: 0.8rem; border: none; border-radius: 8px; background: linear-gradient(135deg, #ffd700, #ffed4e); color: #000; font-size: 1rem; font-weight: bold; cursor: pointer;">注 册</button>
            </div>
            
            <div style="text-align: center; margin-top: 1rem;">
                <p style="color: rgba(255,255,255,0.6); font-size: 0.85rem;">已有账号？<a href="/login.html" style="color: #ffd700;">立即登录</a></p>
            </div>
        </div>
    </div>
    
    <script>
        var currentCaptchaType = 'image';
        
        function switchCaptchaType(type) {
            currentCaptchaType = type;
            document.querySelectorAll('.captcha-type-btn').forEach(btn => btn.classList.remove('active'));
            var targetBtn = document.querySelector('.captcha-type-btn[data-type="' + type + '"]');
            if (targetBtn) targetBtn.classList.add('active');
            
            if (type === 'image') {
                document.getElementById('imageCaptcha').style.display = 'block';
                document.getElementById('sliderCaptcha').style.display = 'none';
                loadCaptcha();
            } else {
                document.getElementById('imageCaptcha').style.display = 'none';
                document.getElementById('sliderCaptcha').style.display = 'block';
            }
        }
        
        async function loadCaptcha() {
            try {
                var response = await fetch('/api/captcha/generate');
                var data = await response.json();
                if (data.success) {
                    document.getElementById('captchaImage').src = data.captcha_image;
                    document.getElementById('captchaId').value = data.captcha_id;
                }
            } catch (error) {
                console.error('加载验证码失败:', error);
            }
        }
        
        function showError(msg) {
            alert(msg);
        }
        
        async function handleRegister(event) {
            event.preventDefault();
            
            var username = document.getElementById('username').value.trim();
            var phone = document.getElementById('phone').value.trim();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            var confirmPassword = document.getElementById('confirmPassword').value;
            
            if (!username || username.length < 3) { showError('用户名至少3个字符'); return; }
            if (!password || password.length < 6) { showError('密码至少6个字符'); return; }
            if (password !== confirmPassword) { showError('两次密码不一致'); return; }
            
            if (currentCaptchaType === 'image') {
                var captchaText = document.getElementById('captchaInput').value.trim();
                var captchaId = document.getElementById('captchaId').value;
                if (!captchaText) { showError('请输入验证码'); return; }
                
                var verifyResp = await fetch('/api/captcha/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ captcha_id: captchaId, captcha_text: captchaText })
                });
                var verifyData = await verifyResp.json();
                if (!verifyData.success) { showError(verifyData.message || '验证码错误'); loadCaptcha(); return; }
            }
            
            try {
                var resp = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password, email: email, phone: phone })
                });
                var data = await resp.json();
                if (data.success) {
                    alert('注册成功！');
                    window.location.href = '/login.html';
                } else {
                    showError(data.message || '注册失败');
                    loadCaptcha();
                }
            } catch (error) {
                showError('网络错误，请重试');
                loadCaptcha();
            }
        }
        
        // Password strength
        document.getElementById('password').addEventListener('input', function(e) {
            var val = e.target.value;
            var bar = document.getElementById('passwordStrength');
            bar.className = 'password-strength-bar';
            if (val.length >= 8) bar.classList.add('strength-strong');
            else if (val.length >= 5) bar.classList.add('strength-medium');
            else if (val.length > 0) bar.classList.add('strength-weak');
        });
        
        loadCaptcha();
    </script>
</body>
</html>
