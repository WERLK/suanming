services:
  - type: web
    name: suanming-fix
    env: python
    region: oregon  # 可选: ohio, oregon, singapore, frankfurt
    plan: free  # 免费计划
    buildCommand: |
      pip install -r requirements.txt
    startCommand: |
      gunicorn -c gunicorn_config.py api.app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: SMTP_SERVER
        value: smtp.qq.com  # 可选：配置邮件服务
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_EMAIL
        value: your_email@qq.com  # 可选：你的邮箱
      - key: SMTP_PASSWORD
        value: your_smtp_password  # 可选：SMTP密码
