<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffd700">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="玄机算命">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="msapplication-TileImage" content="/icon-192.png">
<meta name="msapplication-TileColor" content="#ffd700">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>重置密码 - 玄机算命网</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* 重置密码页面特定样式 */
        .reset-container {
            max-width: 400px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .reset-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-top: 2rem;
        }
        
        .reset-header h1 {
            color: #ffd700;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        
        .reset-header p {
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
        }
        
        .reset-form {
            background: linear-gradient(135deg, rgba(255,215,0,0.05), rgba(255,215,0,0.02));
            border: 1px solid rgba(255,215,0,0.15);
            border-radius: 16px;
            padding: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            color: #ffd700;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,215,0,0.2);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            transition: all 0.3s;
            box-sizing: border-box;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: rgba(255,215,0,0.5);
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 10px rgba(255,215,0,0.1);
        }
        
        .form-group input::placeholder {
            color: rgba(255,255,255,0.3);
        }
        
        .password-strength {
            margin-top: 0.5rem;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s;
            border-radius: 2px;
        }
        
        .strength-weak {
            background: #ff6b6b;
            width: 33%;
        }
        
        .strength-medium {
            background: #ffd43b;
            width: 66%;
        }
        
        .strength-strong {
            background: #51cf66;
            width: 100%;
        }
        
        .btn-submit {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            border: none;
            border-radius: 8px;
            color: #000;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 1rem;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255,215,0,0.3);
        }
        
        .btn-submit:active {
            transform: translateY(0);
        }
        
        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .back-link {
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
        }
        
        .back-link a {
            color: #ffd700;
            text-decoration: none;
            font-weight: bold;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
        
        .error-message {
            display: none;
            background: rgba(255,0,0,0.1);
            border: 1px solid rgba(255,0,0,0.3);
            border-radius: 8px;
            padding: 0.8rem;
            margin-bottom: 1rem;
            color: #ff6b6b;
            font-size: 0.85rem;
            text-align: center;
        }
        
        .error-message.show {
            display: block;
        }
        
        .success-message {
            display: none;
            background: rgba(0,255,0,0.1);
            border: 1px solid rgba(0,255,0,0.3);
            border-radius: 8px;
            padding: 0.8rem;
            margin-bottom: 1rem;
            color: #51cf66;
            font-size: 0.85rem;
            text-align: center;
        }
        
        .success-message.show {
            display: block;
        }
        
        .token-status {
            text-align: center;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        
        .token-valid {
            background: rgba(0,255,0,0.1);
            border: 1px solid rgba(0,255,0,0.3);
            color: #51cf66;
        }
        
        .token-invalid {
            background: rgba(255,0,0,0.1);
            border: 1px solid rgba(255,0,0,0.3);
            color: #ff6b6b;
        }
    </style>
<style>
    .back-btn {
        background: none;
        border: none;
        color: #ffd700;
        font-size: 1.2rem;
        cursor: pointer;
        padding: 0.5rem;
    }
    .page-header {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1rem;
        background: linear-gradient(180deg, rgba(15,12,41,0.98), rgba(26,26,46,0.95));
        border-bottom: 1px solid rgba(255,215,0,0.15);
    }
    .page-header h1 {
        font-size: 1.2rem;
        color: #ffd700;
        font-weight: 600;
    }
</style>
</head>
<body>
<div class="page-header">
        <button class="back-btn" onclick="window.location.href='/'">←</button>
        <h1>重置密码</h1>
    </div>
    <div class="content-area">
    <div class="stars" id="stars"></div>
    
    <div class="app">
        <div class="reset-container">
            <div class="reset-header">
                <h1>🔮 重置密码</h1>
                <p>请设置新密码</p>
            </div>
            
            <div id="tokenStatus"></div>
            
            <div class="reset-form" id="resetForm" style="display: none;">
                <div class="error-message" id="errorMessage"></div>
                <div class="success-message" id="successMessage"></div>
                
                <form id="passwordForm" onsubmit="handleResetPassword(event)">
                    <input type="hidden" id="token" name="token" value="">
                    
                    <div class="form-group">
                        <label for="password">新密码</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="请输入新密码（至少6个字符）"
                            required
                            minlength="6"
                            oninput="checkPasswordStrength(this.value)"
                        >
                        <div class="password-strength">
                            <div class="password-strength-bar" id="passwordStrength"></div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmPassword">确认新密码</label>
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword" 
                            placeholder="请再次输入新密码"
                            required
                        >
                    </div>
                    
                    <button type="submit" class="btn-submit" id="submitBtn">重置密码</button>
                </form>
                
                <div class="back-link">
                    <a href="/login.html">← 返回登录</a>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/js/main.js"></script>
    <script>
        // 创建星空背景
        document.addEventListener('DOMContentLoaded', function() {
            createStars();
            checkToken();
        });
        
        // 获取URL参数
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }
        
        // 检查重置token是否有效
        async function checkToken() {
            const token = getQueryParam('token');
            const tokenStatus = document.getElementById('tokenStatus');
            const resetForm = document.getElementById('resetForm');
            
            if (!token) {
                tokenStatus.className = 'token-status token-invalid';
                tokenStatus.innerHTML = '❌ 重置链接无效<br>请重新申请密码重置';
                return;
            }
            
            // 保存token到表单
            document.getElementById('token').value = token;
            
            // 验证token（通过调用后端API）
            try {
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token,
                        password: 'TempPassword123!' // 临时密码，仅用于验证token
                    })
                });
                
                const data = await response.json();
                
                if (data.message && data.message.includes('密码长度')) {
                    // Token有效，但密码不符合要求（这是预期的）
                    tokenStatus.className = 'token-status token-valid';
                    tokenStatus.innerHTML = '✅ 重置链接有效<br>请设置新密码';
                    resetForm.style.display = 'block';
                } else if (data.success) {
                    // 不应该到这里，因为密码是临时的
                    tokenStatus.className = 'token-status token-valid';
                    tokenStatus.innerHTML = '✅ 重置链接有效<br>请设置新密码';
                    resetForm.style.display = 'block';
                } else {
                    // Token无效或已过期
                    tokenStatus.className = 'token-status token-invalid';
                    tokenStatus.innerHTML = '❌ ' + (data.message || '重置链接已失效') + '<br>请重新申请密码重置';
                }
            } catch (error) {
                // 验证token（通过检查token是否存在于后端）
                // 由于我们无法直接从前端验证token，这里显示表单让用户尝试重置
                tokenStatus.className = 'token-status token-valid';
                tokenStatus.innerHTML = '✅ 重置链接有效<br>请设置新密码';
                resetForm.style.display = 'block';
            }
        }
        
        // 显示错误信息
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            
            // 3秒后自动隐藏
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 3000);
        }
        
        // 显示成功信息
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.classList.add('show');
            
            // 3秒后自动隐藏
            setTimeout(() => {
                successDiv.classList.remove('show');
            }, 3000);
        }
        
        // 检查密码强度
        function checkPasswordStrength(password) {
            const strengthBar = document.getElementById('passwordStrength');
            strengthBar.className = 'password-strength-bar';
            
            if (password.length === 0) {
                return;
            }
            
            let strength = 0;
            
            // 长度检查
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            
            // 复杂度检查
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;
            
            if (strength <= 2) {
                strengthBar.classList.add('strength-weak');
            } else if (strength <= 4) {
                strengthBar.classList.add('strength-medium');
            } else {
                strengthBar.classList.add('strength-strong');
            }
        }
        
        // 处理重置密码
        async function handleResetPassword(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '重置中...';
            
            const token = document.getElementById('token').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // 验证密码
            if (!password) {
                showError('请输入新密码');
                submitBtn.disabled = false;
                submitBtn.textContent = '重置密码';
                return;
            }
            
            if (password.length < 6) {
                showError('密码长度至少6个字符');
                submitBtn.disabled = false;
                submitBtn.textContent = '重置密码';
                return;
            }
            
            // 验证确认密码
            if (password !== confirmPassword) {
                showError('两次输入的密码不一致');
                submitBtn.disabled = false;
                submitBtn.textContent = '重置密码';
                return;
            }
            
            try {
                // 调用后端API
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // 重置成功
                    showSuccess('密码重置成功！正在跳转到登录页面...');
                    
                    // 清除表单
                    document.getElementById('password').value = '';
                    document.getElementById('confirmPassword').value = '';
                    
                    // 延迟跳转
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    // 重置失败
                    showError(data.message || '密码重置失败，请重试');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '重置密码';
                }
            } catch (error) {
                showError('网络错误，请稍后重试');
                submitBtn.disabled = false;
                submitBtn.textContent = '重置密码';
            }
        }
    </script>
</div>
    </body>
</html>
